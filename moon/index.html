<style>
  :root {
    --bg: #0d1117;
    --surface: #161c24;
    --surface-2: #1e2630;
    --border: #2c3644;
    --text: #e6edf3;
    --text-muted: #8b98a8;
    --accent: #cfd8dc;
    --accent-soft: rgba(207, 216, 220, 0.12);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    padding: 16px 24px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    position: relative;
    z-index: 2;
  }

  header h1 { font-size: 1.2rem; font-weight: 800; }
  header h1 span { color: var(--accent); }
  header .clock { font-size: 0.9rem; color: var(--text-muted); font-variant-numeric: tabular-nums; letter-spacing: 0.05em; }

  /* ===== ΕΡΓΑΛΕΙΑ (γλώσσα + εγκατάσταση) ===== */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .lang-switch {
    display: flex;
    border: 1px solid var(--border);
    border-radius: 999px;
    overflow: hidden;
  }

  .lang-switch button {
    background: none;
    border: none;
    padding: 6px 12px;
    color: var(--text-muted);
    cursor: pointer;
    font: 700 0.75rem "Segoe UI", system-ui, sans-serif;
    letter-spacing: 0.04em;
  }

  .lang-switch button.active {
    background: var(--surface-2);
    color: var(--text);
  }

  #installBtn {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 999px;
    padding: 6px 14px;
    cursor: pointer;
    font: 700 0.75rem "Segoe UI", system-ui, sans-serif;
  }
  #installBtn:hover { border-color: var(--accent); }

  /* ===== ΟΥΡΑΝΟΣ ===== */
  #sky {
    position: fixed;
    inset: 0;
    z-index: 0;
    transition: background 2s linear;
  }

  #stars {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    opacity: 0;
    transition: opacity 2s ease;
  }

  #stars.visible { opacity: 1; }

  main {
    flex: 1;
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 26px;
    padding: 20px;
    overflow-y: auto;
  }

  .moon-stage { position: relative; }

  #moonCanvas {
    display: block;
    filter: drop-shadow(0 0 42px rgba(255, 252, 240, 0.35));
  }

  .moon-info { text-align: center; }

  .phase-name {
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: 0.01em;
  }

  .phase-sub {
    margin-top: 6px;
    font-size: 0.85rem;
    color: var(--text-muted);
    line-height: 1.6;
  }

  .phase-sub b { color: var(--text); font-variant-numeric: tabular-nums; }

  /* ===== ΚΑΡΤΑ ΠΑΡΑΤΗΡΗΣΗΣ ===== */
  .facts {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
    max-width: 720px;
  }

  .fact {
    background: rgba(22, 28, 36, 0.72);
    backdrop-filter: blur(8px);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 20px;
    text-align: center;
    min-width: 130px;
  }

  .fact .k {
    font-size: 0.66rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-muted);
    font-weight: 800;
    margin-bottom: 6px;
  }

  .fact .v {
    font-size: 1.05rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  footer {
    position: relative;
    z-index: 2;
    padding: 14px 24px;
    border-top: 1px solid var(--border);
    font-size: 0.76rem;
    color: var(--text-muted);
    text-align: center;
    line-height: 1.7;
  }

  footer a { color: var(--text); text-decoration: none; border-bottom: 1px dotted var(--text-muted); }
  footer a:hover { border-bottom-style: solid; }

  .kbd {
    display: inline-block;
    padding: 1px 6px;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 0.68rem;
    font-family: ui-monospace, monospace;
  }
</style>

        data-el="Χωρίς cookies · Χωρίς tracking · Ανοιχτού κώδικα · Υπολογισμός 100% τοπικός">No cookies · No tracking · Open source · Computed 100% locally</span>

<script>
"use strict";
(function () {

  var SYNODIC = 29.530588853;                 // μέση συνοδική περίοδος (μέρες)
  var KNOWN_NEW = Date.UTC(2000, 0, 6, 18, 14) / 86400000; // νέα σελήνη 6/1/2000 18:14 UTC

  var skyEl = document.getElementById("sky");
  var starsCanvas = document.getElementById("stars");
  var starsCtx = starsCanvas.getContext("2d");
  var moonCanvas = document.getElementById("moonCanvas");
  var mctx = moonCanvas.getContext("2d");
  var clockEl = document.getElementById("clock");
  var phaseNameEl = document.getElementById("phaseName");
  var phaseSubEl = document.getElementById("phaseSub");
  var ageEl = document.getElementById("ageEl");
  var illumEl = document.getElementById("illumEl");
  var fullEl = document.getElementById("fullEl");
  var newEl = document.getElementById("newEl");
  var langEnBtn = document.getElementById("langEn");
  var langElBtn = document.getElementById("langEl");
  var installBtn = document.getElementById("installBtn");

  // ===== i18n (κοινό μοτίβο σε όλη τη σουίτα) =====
  var LANG_KEY = "soffitta.lang";

  var T = {
    title: {
      en: "Moon & Sky — Soffitta",
      el: "Σελήνη & Ουρανός — Soffitta"
    },
    metaDesc: {
      en: "The current moon phase and the color of the sky, hour by hour. Time-travel through days and years. Free, open source, no cookies, no tracking.",
      el: "Η φάση της σελήνης και το χρώμα του ουρανού ανά ώρα. Ο πιο ήσυχος συνοδός σου. Χωρίς cookies, χωρίς tracking."
    },
    days: { en: " days", el: " ημέρες" },
    months: {
      en: ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"],
      el: ["Ιαν", "Φεβ", "Μαρ", "Απρ", "Μαϊ", "Ιουν", "Ιουλ", "Αυγ", "Σεπ", "Οκτ", "Νοε", "Δεκ"]
    }
  };

  var currentLang = detectLang();

  function detectLang() {
    try {
      var saved = localStorage.getItem(LANG_KEY);
      if (saved === "en" || saved === "el") return saved;
    } catch (e) {}
    var nav = (navigator.language || "en").slice(0, 2).toLowerCase();
    return nav === "el" ? "el" : "en";
  }

  function applyStatic() {
    document.documentElement.setAttribute("lang", currentLang);
    document.title = T.title[currentLang];
    var metaDesc = document.querySelector('meta[name="description"]');
    if (metaDesc) metaDesc.setAttribute("content", T.metaDesc[currentLang]);
    var nodes = document.querySelectorAll("[data-en]");
    for (var i = 0; i < nodes.length; i++) {
      nodes[i].textContent = currentLang === "el"
        ? nodes[i].getAttribute("data-el")
        : nodes[i].getAttribute("data-en");
    }
    langEnBtn.classList.toggle("active", currentLang === "en");
    langElBtn.classList.toggle("active", currentLang === "el");
    update(); // τα JS-rendered κείμενα (φάσεις, μήνες) σε ενεργή γλώσσα
  }

  function setLang(lang) {
    currentLang = lang;
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
    applyStatic();
  }

  langEnBtn.addEventListener("click", function () { setLang("en"); });
  langElBtn.addEventListener("click", function () { setLang("el"); });

  // ===== ΦΑΣΕΙΣ (δίγλωσσες — JS-rendered όπως οι παλέτες) =====
    var PHASES = [
    { upto: 0.017, name_en: "New Moon",         name_el: "Νέα Σελήνη",        sub_en: "The moon hides together with the sun.",    sub_el: "Το φεγγάρι κρύβεται μαζί με τον ήλιο." },
    { upto: 0.236, name_en: "Waxing Crescent",   name_el: "Αύξων Αμφίκυρτος",  sub_en: "A thin sliver of light toward the west.",  sub_el: "Λεπτή λόγχη φωτός προς τη δύση." },
    { upto: 0.264, name_en: "First Quarter",     name_el: "Πρώτο Τέταρτο",     sub_en: "Half disk, half way there.",                sub_el: "Μισός δίσκος, μισός δρόμος." },
    { upto: 0.486, name_en: "Waxing Gibbous",    name_el: "Αύξων Λαμπρός",     sub_en: "Almost full — it grows every night.",       sub_el: "Σχεδόν πλήρες — μεγαλώνει κάθε βράδυ." },
    { upto: 0.514, name_en: "Full Moon",         name_el: "Πανσέληνος",        sub_en: "The whole disk lit as bright as it gets.",  sub_el: "Ολόκληρος ο δίσκος φωτεινός όσο γίνεται." },
    { upto: 0.736, name_en: "Waning Gibbous",    name_el: "Φθίνων Λαμπρός",    sub_en: "The light recedes little by little.",      sub_el: "Το φως αποσύρεται σιγά σιγά." },
    { upto: 0.764, name_en: "Last Quarter",       name_el: "Τελευταίο Τέταρτο", sub_en: "The second half — the beginning of the end.", sub_el: "Το δεύτερο μισό — αρχή του τέλους." },
    { upto: 0.983, name_en: "Waning Crescent",   name_el: "Φθίνων Αμφίκυρτος", sub_en: "A thin sliver before the new beginning.",  sub_el: "Λεπτή λόγχη πριν από το καινούργιο ξεκίνημα." },
    { upto: 1.001, name_en: "New Moon",          name_el: "Νέα Σελήνη",        sub_en: "The moon hides together with the sun.",    sub_el: "Το φεγγάρι κρύβεται μαζί με τον ήλιο." }
  ];

  // ===== STATE =====
  var dayOffset = 0;      // χρονοταξίδευμα (ημέρες από το τώρα)
  var stars = [];
  var moonPhase = 0;      // 0..1, 0 = νέα σελήνη

  // ===== ΦΑΣΗ ΣΕΛΗΝΗΣ (αστρονομία — αμετάβλητη) =====
  function moonAge(date) {
    var days = date.getTime() / 86400000;
    var age = (days - KNOWN_NEW) % SYNODIC;
    if (age < 0) age += SYNODIC;
    return age;
  }

  function moonPhaseFromAge(age) {
    return age / SYNODIC; // 0..1
  }

  function phaseInfo(p) {
    for (var i = 0; i < PHASES.length; i++) {
      if (p <= PHASES[i].upto) return PHASES[i];
    }
    return PHASES[PHASES.length - 1];
  }

  function illumination(p) {
    return (1 - Math.cos(2 * Math.PI * p)) / 2;
  }

  // ===== ΣΧΕΔΙΑΣΜΟΣ ΦΕΓΓΑΡΙΟΥ (αμετάβλητο — καθαρισμένο crater clip) =====
  function drawMoon(phase) {
    var w = moonCanvas.width, h = moonCanvas.height;
    mctx.clearRect(0, 0, w, h);

    var cx = w / 2, cy = h / 2;
    var R = Math.min(w, h) / 2 - 8;

    // Σκούρος «κρυφός» δίσκος — πάντα ορατός αμυδρά
    mctx.fillStyle = "rgba(120, 128, 138, 0.22)";
    circle(cx, cy, R);
    mctx.fill();

    // Φωτεινό τμήμα: σύνθεση δύο τόξων
    mctx.save();
    mctx.beginPath();
    mctx.arc(cx, cy, R, 0, Math.PI * 2);
    mctx.clip();

    mctx.fillStyle = "#fdf6e3";
    mctx.shadowColor = "rgba(255, 252, 240, 0.8)";
    mctx.shadowBlur = 22;

    if (phase < 0.5) {
      // Αύξουσα: φως δεξιά
      drawLune(cx, cy, R, phase * 4, true);
    } else {
      // Φθίνουσα: φως αριστερά
      drawLune(cx, cy, R, (phase - 0.5) * 4, false);
    }
    mctx.restore();

    // Κρατήρες — illustrative, αμυδρά σε όλο τον δίσκο
    mctx.save();
    mctx.beginPath();
    mctx.arc(cx, cy, R, 0, Math.PI * 2);
    mctx.clip();
    mctx.globalAlpha = 0.12;
    mctx.fillStyle = "#555";
    crater(cx - R * 0.3, cy - R * 0.2, R * 0.16);
    crater(cx + R * 0.25, cy + R * 0.3, R * 0.11);
    crater(cx + R * 0.1, cy - R * 0.45, R * 0.07);
    crater(cx - R * 0.45, cy + R * 0.4, R * 0.09);
    mctx.restore();
  }

  function circle(x, y, r) {
    mctx.beginPath();
    mctx.arc(x, y, r, 0, Math.PI * 2);
  }

  function crater(x, y, r) {
    circle(x, y, r);
    mctx.fill();
  }

  // Σχεδίαση φωτεινού λοξοτόμου (μηνώδους τμήματος)
  // t: 0..1 μέσα στο μισό κύκλο (0=λεπτό, 0.5=ημισέληνος, 1=πλήρης)
  function drawLune(cx, cy, R, t, waxingRight) {
    var tt = Math.max(-1, Math.min(1, t)); // clamp

    mctx.beginPath();

    // Εξωτερικό ημικύκλιο προς τη φωτεινή πλευρά
    var startAng, endAng;
    if (waxingRight) {
      startAng = -Math.PI / 2;
      endAng = Math.PI / 2;
    } else {
      startAng = Math.PI / 2;
      endAng = Math.PI * 1.5;
    }
    mctx.arc(cx, cy, R, startAng, endAng);

    // Εσωτερικό όριο: ημικύκλιο/έλλειψη με άξονα R * k
    var k = Math.cos(Math.PI * (tt / 2)); // 1 → -1
    var rx = R * Math.abs(k);
    var sweep = (k >= 0) !== waxingRight;

    mctx.ellipse(cx, cy, rx, R, 0, endAng, startAng, sweep);
    mctx.closePath();
    mctx.fill();
  }
  
    // ===== ΟΥΡΑΝΟΣ =====
  function skyFor(hour) {
    var stops = [
      { h: 0,  top: "#05070d", bottom: "#0b1020" },
      { h: 4,  top: "#06080f", bottom: "#101728" },
      { h: 5.5,top: "#1a1f35", bottom: "#3a3050" },
      { h: 7,  top: "#4a5d8c", bottom: "#d98a6a" },
      { h: 9,  top: "#7da8d9", bottom: "#bcd9ec" },
      { h: 12, top: "#6ba3dd", bottom: "#cfe3f0" },
      { h: 16, top: "#6b9bd1", bottom: "#c9dbe8" },
      { h: 18, top: "#4a5d8c", bottom: "#e8a76a" },
      { h: 19.5,top: "#23284a", bottom: "#8c4a5c" },
      { h: 21, top: "#0c1020", bottom: "#1a1f35" },
      { h: 24, top: "#05070d", bottom: "#0b1020" }
    ];

    var i, a, b, t;
    for (i = 0; i < stops.length - 1; i++) {
      if (hour >= stops[i].h && hour <= stops[i + 1].h) {
        a = stops[i];
        b = stops[i + 1];
        t = (hour - a.h) / (b.h - a.h);
        break;
      }
    }
    if (!a) { a = stops[0]; b = stops[1]; t = 0; }

    return "linear-gradient(180deg, " + mixHex(a.top, b.top, t) + " 0%, " + mixHex(a.bottom, b.bottom, t) + " 100%)";
  }

  function mixHex(c1, c2, t) {
    var a = hexRgb(c1), b = hexRgb(c2);
    var r = Math.round(a[0] + (b[0] - a[0]) * t);
    var g = Math.round(a[1] + (b[1] - a[1]) * t);
    var bl = Math.round(a[2] + (b[2] - a[2]) * t);
    return "rgb(" + r + "," + g + "," + bl + ")";
  }

  function hexRgb(hex) {
    return [
      parseInt(hex.slice(1, 3), 16),
      parseInt(hex.slice(3, 5), 16),
      parseInt(hex.slice(5, 7), 16)
    ];
  }

  function nightAmount(hour) {
    if (hour <= 5 || hour >= 21) return 1;
    if (hour >= 7 && hour <= 18) return 0;
    if (hour > 5 && hour < 7) return 1 - (hour - 5) / 2;
    return 1 - (hour - 18) / 3;
  }

  // ===== ΑΣΤΕΡΙΑ =====
  function seedStars() {
    starsCanvas.width = window.innerWidth;
    starsCanvas.height = window.innerHeight;
    stars = [];
    var n = Math.round((starsCanvas.width * starsCanvas.height) / 6500);
    for (var i = 0; i < n; i++) {
      stars.push({
        x: Math.random() * starsCanvas.width,
        y: Math.random() * starsCanvas.height * 0.85,
        r: 0.4 + Math.random() * 1.2,
        tw: Math.random() * Math.PI * 2,
        sp: 0.5 + Math.random() * 1.5
      });
    }
  }

  function drawStars(t) {
    starsCtx.clearRect(0, 0, starsCanvas.width, starsCanvas.height);
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      var alpha = 0.35 + 0.45 * Math.abs(Math.sin(s.tw + t * 0.001 * s.sp));
      starsCtx.globalAlpha = alpha;
      starsCtx.fillStyle = "#ffffff";
      starsCtx.fillRect(s.x, s.y, s.r, s.r);
    }
    starsCtx.globalAlpha = 1;
  }

  // ===== ΚΥΡΙΟΣ ΒΡΟΧΟΣ =====
  function nowDate() {
    return new Date(Date.now() + dayOffset * 86400000);
  }

  function fmtDate(d) {
    var M = T.months[currentLang];
    return d.getDate() + " " + M[d.getMonth()] + " " + d.getFullYear();
  }

  function update() {
    var d = nowDate();
    var hour = d.getHours() + d.getMinutes() / 60;

    // Ουρανός & αστέρια
    skyEl.style.background = skyFor(hour);
    var na = nightAmount(hour);
    starsCanvas.classList.toggle("visible", na > 0.35);
    starsCanvas.style.opacity = String(Math.min(1, na * 1.4));

    // Φεγγάρι
    var age = moonAge(d);
    moonPhase = moonPhaseFromAge(age);
    drawMoon(moonPhase);

    // Κείμενα
    clockEl.textContent = fmtDate(d) + " · " +
      ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);

    var info = phaseInfo(moonPhase);
    phaseNameEl.textContent = currentLang === "el" ? info.name_el : info.name_en;
    phaseSubEl.textContent = currentLang === "el" ? info.sub_el : info.sub_en;

    ageEl.textContent = age.toFixed(1) + T.days[currentLang];
    illumEl.textContent = Math.round(illumination(moonPhase) * 100) + "%";

    // Επόμενες πανσέληνοι/νέες σελήνες
    fullEl.textContent = fmtDate(findPhase(moonPhase, 0.5, d));
    newEl.textContent = fmtDate(findPhase(moonPhase, 0, d));
  }

  function findPhase(currentPhase, target, from) {
    var diff = target - currentPhase;
    if (diff < 0) diff += 1;
    if (diff === 0) diff = 1;
    return new Date(from.getTime() + diff * SYNODIC * 86400000);
  }

  // ===== ANIMATION LOOP =====
  var lastUpdate = 0;

  function loop(t) {
    drawStars(t);
    if (Date.now() - lastUpdate > 20000) {
      update();
      lastUpdate = Date.now();
    }
    requestAnimationFrame(loop);
  }

  // ===== ΧΡΟΝΟΤΑΞΙΔΕΥΜΑ =====
  // N δουλεύει και σε ελληνικό layout (ν/Ν) — bug #3 του audit
  document.addEventListener("keydown", function (e) {
    var tag = (e.target && e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "select" || tag === "textarea") return;
    if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
      dayOffset += (e.key === "ArrowRight") ? 1 : -1;
      if (dayOffset > 3650) dayOffset = 3650;
      if (dayOffset < -3650) dayOffset = -3650;
      update();
    } else if (e.key === "n" || e.key === "N" || e.key === "ν" || e.key === "Ν" || e.key === "Home") {
      dayOffset = 0;
      update();
    }
  });

  // Κράτημα: χρονοταξίδευμα — κάθε 90ms = 1 μέρα
  var holding = false;
  var holdDir = 0;

  document.body.addEventListener("pointerdown", function (e) {
    if (e.target.closest("a, button")) return;
    holding = true;
    holdDir = e.clientX > window.innerWidth / 2 ? 1 : -1;
  });
  document.addEventListener("pointerup", function () { holding = false; });

  setInterval(function () {
    if (holding) {
      dayOffset += holdDir;
      if (dayOffset > 3650) dayOffset = 3650;
      if (dayOffset < -3650) dayOffset = -3650;
      update();
    }
  }, 90);

  window.addEventListener("resize", function () {
    seedStars();
    update();
  });

  // ===== INIT =====
  applyStatic();
  seedStars();
  requestAnimationFrame(loop);

  // ===== ΕΓΚΑΤΑΣΤΑΣΗ (PWA) =====
  var deferredPrompt = null;

  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.hidden = false;
  });

  installBtn.addEventListener("click", function () {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt = null;
    installBtn.hidden = true;
  });

  window.addEventListener("appinstalled", function () {
    deferredPrompt = null;
    installBtn.hidden = true;
  });

  // ===== SERVICE WORKER (offline — κοινός SW της σουίτας στη ρίζα) =====
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("../sw.js").catch(function (err) {
        console.warn("SW registration failed:", err);
      });
    });
  }

})();
</script>
