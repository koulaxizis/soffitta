<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moon &amp; Sky</title> <!-- SUITE NAME prefix όταν επιλεγεί το όνομα -->
<meta name="description" content="Η φάση της σελήνης και το χρώμα του ουρανού ανά ώρα. Ο πιο ήσυχος συνοδός σου. Χωρίς cookies, χωρίς tracking.">
<style>
  :root {
    --bg: #0d1117;
    --surface: #161c24;
    --surface-2: #1e2630;
    --border: #2c3644;
    --text: #e6edf3;
    --text-muted: #8b98a8;
    --accent: #cfd8dc;
    --accent-soft: rgba(207, 216, 220, 0.12);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    padding: 16px 24px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    position: relative;
    z-index: 2;
  }

  header h1 { font-size: 1.2rem; font-weight: 800; }
  header h1 span { color: var(--accent); }
  header .clock { font-size: 0.9rem; color: var(--text-muted); font-variant-numeric: tabular-nums; letter-spacing: 0.05em; }

  /* ===== ΟΥΡΑΝΟΣ ===== */
  #sky {
    position: fixed;
    inset: 0;
    z-index: 0;
    transition: background 2s linear;
  }

  #stars {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    opacity: 0;
    transition: opacity 2s ease;
  }

  #stars.visible { opacity: 1; }

  main {
    flex: 1;
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 26px;
    padding: 20px;
    overflow-y: auto;
  }

  .moon-stage { position: relative; }

  #moonCanvas {
    display: block;
    filter: drop-shadow(0 0 42px rgba(255, 252, 240, 0.35));
  }

  .moon-info { text-align: center; }

  .phase-name {
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: 0.01em;
  }

  .phase-sub {
    margin-top: 6px;
    font-size: 0.85rem;
    color: var(--text-muted);
    line-height: 1.6;
  }

  .phase-sub b { color: var(--text); font-variant-numeric: tabular-nums; }

  /* ===== ΚΑΡΤΑ ΠΑΡΑΤΗΡΗΣΗΣ ===== */
  .facts {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
    max-width: 720px;
  }

  .fact {
    background: rgba(22, 28, 36, 0.72);
    backdrop-filter: blur(8px);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 20px;
    text-align: center;
    min-width: 130px;
  }

  .fact .k {
    font-size: 0.66rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-muted);
    font-weight: 800;
    margin-bottom: 6px;
  }

  .fact .v {
    font-size: 1.05rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  footer {
    position: relative;
    z-index: 2;
    padding: 14px 24px;
    border-top: 1px solid var(--border);
    font-size: 0.76rem;
    color: var(--text-muted);
    text-align: center;
    line-height: 1.7;
  }

  footer a { color: var(--text); text-decoration: none; border-bottom: 1px dotted var(--text-muted); }
  footer a:hover { border-bottom-style: solid; }

  .kbd {
    display: inline-block;
    padding: 1px 6px;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 0.68rem;
    font-family: ui-monospace, monospace;
  }
</style>
</head>
<body>

<div id="sky"></div>
<canvas id="stars"></canvas>

<header>
  <h1>🌙 Moon &amp; <span>Sky</span></h1>
  <span class="clock" id="clock"></span>
</header>

<main>
  <div class="moon-stage">
    <canvas id="moonCanvas" width="220" height="220"></canvas>
  </div>

  <div class="moon-info">
    <div class="phase-name" id="phaseName"></div>
    <div class="phase-sub" id="phaseSub"></div>
  </div>

  <div class="facts">
    <div class="fact">
      <div class="k">Ηλικία σελήνης</div>
      <div class="v" id="ageEl"></div>
    </div>
    <div class="fact">
      <div class="k">Φωτεινότητα</div>
      <div class="v" id="illumEl"></div>
    </div>
    <div class="fact">
      <div class="k">Επόμενη πανσέληνος</div>
      <div class="v" id="fullEl"></div>
    </div>
    <div class="fact">
      <div class="k">Επόμενη νέα σελήνη</div>
      <div class="v" id="newEl"></div>
    </div>
  </div>

  <p style="font-size:0.72rem;color:var(--text-muted);">
    <span class="kbd">Η</span> χρονο ταξίδευμα · <span class="kbd">now</span> επιστροφή στο τώρα
  </p>
</main>

<footer>
  Designed by <a href="https://koulaxizis.gr" target="_blank" rel="noopener">Christos Koulaxizis</a> ·
  <a href="../">Όλα τα apps</a><br>
  Χωρίς cookies · Χωρίς tracking · Open source · Υπολογισμός 100% τοπικός
</footer>

<script>
"use strict";
(function () {

  var SYNODIC = 29.530588853;                 // μέση συνοδική περίοδος (μέρες)
  var KNOWN_NEW = Date.UTC(2000, 0, 6, 18, 14) / 86400000; // νέα σελήνη 6/1/2000 18:14 UTC (Julian-like)

  var skyEl = document.getElementById("sky");
  var starsCanvas = document.getElementById("stars");
  var starsCtx = starsCanvas.getContext("2d");
  var moonCanvas = document.getElementById("moonCanvas");
  var mctx = moonCanvas.getContext("2d");
  var clockEl = document.getElementById("clock");
  var phaseNameEl = document.getElementById("phaseName");
  var phaseSubEl = document.getElementById("phaseSub");
  var ageEl = document.getElementById("ageEl");
  var illumEl = document.getElementById("illumEl");
  var fullEl = document.getElementById("fullEl");
  var newEl = document.getElementById("newEl");

  var dayOffset = 0; // χρονοταξίδευμα (ημέρες από το τώρα)
  var stars = [];
  var moonPhase = 0; // 0..1, 0 = νέα σελήνη

  // ===== ΦΑΣΗ ΣΕΛΗΝΗΣ =====
  function moonAge(date) {
    var days = date.getTime() / 86400000;
    var age = (days - KNOWN_NEW) % SYNODIC;
    if (age < 0) age += SYNODIC;
    return age;
  }

  function moonPhaseFromAge(age) {
    return age / SYNODIC; // 0..1
  }

  var PHASES = [
    { upto: 0.017,   name: "Νέα Σελήνη",        sub: "Το φεγγάρι κρύβεται μαζί με τον ήλιο." },
    { upto: 0.236,   name: "Αυξανόμενο Αμφίκυρτο", sub: "Λεπτή λεπροπή ουρανού προς τη δύση." },
    { upto: 0.264,   name: "Πρώτο Τέταρτο",     sub: "Μισός δίσκος, μισός δρόμος." },
    { upto: 0.486,   name: "Αυξανόμενο Λαμπρό", sub: "Σχεδόν πλήρες — μεγαλώνει κάθε βράδυ." },
    { upto: 0.514,   name: "Πανσέληνος",         sub: "Ολόκληρος ο δίσκος φωτεινός όσο γίνεται." },
    { upto: 0.736,   name: "Φθίνον Λαμπρό",     sub: "Το φως αποσύρεται σιγά σιγά." },
    { upto: 0.764,   name: "Τελευταίο Τέταρτο", sub: "Το δεύτερο μισό — αρχή του τέλους." },
    { upto: 0.983,   name: "Φθίνον Αμφίκυρτο",  sub: "Λεπτή λεπροπή πριν από το καινούργιο ξεκίνημα." },
    { upto: 1.001,   name: "Νέα Σελήνη",        sub: "Το φεγγάρι κρύβεται μαζί με τον ήλιο." }
  ];

  function phaseInfo(p) {
    for (var i = 0; i < PHASES.length; i++) {
      if (p <= PHASES[i].upto) return PHASES[i];
    }
    return PHASES[PHASES.length - 1];
  }

  function illumination(p) {
    // κλάσμα φωτισμένου δίσκου
    return (1 - Math.cos(2 * Math.PI * p)) / 2;
  }

  // ===== ΣΧΕΔΙΑΣΜΟΣ ΦΕΓΓΑΡΙΟΥ =====
  function drawMoon(phase) {
    var w = moonCanvas.width, h = moonCanvas.height;
    mctx.clearRect(0, 0, w, h);

    var cx = w / 2, cy = h / 2;
    var R = Math.min(w, h) / 2 - 8;

    // Σκούρος «κρυφός» δίσκος — πάντα ορατός αμυδρά
    mctx.fillStyle = "rgba(120, 128, 138, 0.22)";
    circle(cx, cy, R);
    mctx.fill();

    // Φωτεινό τμήμα: σύνθεση δύο τόξων
    // p: 0=νέα, 0.25=πρώτο τέταρτο (δεξιά φωτεινή), 0.5=πλήρης, 0.75=τελευταίο τέταρτο (αριστερά φωτεινή)
    mctx.save();
    mctx.beginPath();
    mctx.arc(cx, cy, R, 0, Math.PI * 2);
    mctx.clip();

    mctx.fillStyle = "#fdf6e3";
    mctx.shadowColor = "rgba(255, 252, 240, 0.8)";
    mctx.shadowBlur = 22;

    if (phase < 0.5) {
      // Αύξουσα: φως δεξιά
      drawLune(cx, cy, R, phase * 4, true);
    } else {
      // Φθίνουσα: φως αριστερά
      drawLune(cx, cy, R, (phase - 0.5) * 4, false);
    }
    mctx.restore();

    // Κρατήρες (μόνο στο φωτεινό μέρος — illustrative)
    mctx.save();
    mctx.beginPath();
    if (phase < 0.5) mctx.arc(cx, cy, R, 0, Math.PI * 2);
    mctx.clip();
    mctx.globalAlpha = 0.12;
    mctx.fillStyle = "#555";
    crater(cx - R * 0.3, cy - R * 0.2, R * 0.16);
    crater(cx + R * 0.25, cy + R * 0.3, R * 0.11);
    crater(cx + R * 0.1, cy - R * 0.45, R * 0.07);
    crater(cx - R * 0.45, cy + R * 0.4, R * 0.09);
    mctx.restore();
  }

  function circle(x, y, r) {
    mctx.beginPath();
    mctx.arc(x, y, r, 0, Math.PI * 2);
  }

  function crater(x, y, r) {
    circle(x, y, r);
    mctx.fill();
  }

  // Σχεδίαση φωτεινού λοξοτόμου (μηλώδες τμήμα)
  // t: 0..1 μέσα στο μισό κύκλο (0=λέπτυσμα, 0.5=ημισέληνος, 1=πλήρης)
  function drawLune(cx, cy, R, t, waxingRight) {
    // Το φως καταλαμβάνει πλάτος R*|cos(theta)| από το ανάλογο τόξο
    // Απλοποιημένο μοντέλο: ellipse x-semiaxis = R*(1 - 2t') με σωστό τόξο
    // t' σε [-1, 1]: -1 = καμία φωτεινή πλευρά (τέρμα), 1 = πλήρης
    var tt = Math.max(-1, Math.min(1, t)); // clamp

    mctx.beginPath();

    // Εξωτερικό ημικύκλιο προς τη φωτεινή πλευρά
    var startAng, endAng;
    if (waxingRight) {
      startAng = -Math.PI / 2;
      endAng = Math.PI / 2;
    } else {
      startAng = Math.PI / 2;
      endAng = Math.PI * 1.5;
    }
    mctx.arc(cx, cy, R, startAng, endAng);

    // Εσωτερικό όριο: ημικύκλιο/έλλειψη με άξονα R * k
    var k = Math.cos(Math.PI * (tt / 2)); // 1 → -1
    // Όταν tt=0 → k=1 (λεπτή σедельник), tt=1 → k=-1 (πλήρης)
    var rx = R * Math.abs(k);
    var sweep = (k >= 0) !== waxingRight; // κατεύθυνση εσωτερικού τόξου

    mctx.ellipse(cx, cy, rx, R, 0, endAng, startAng, sweep);
    mctx.closePath();
    mctx.fill();
  }

  // ===== ΟΥΡΑΝΟΣ =====
  // Gradient ουρανού ανάλογα με την ώρα (ημέρα/νύχτα/λικνίστρες)
  function skyFor(hour) {
    // Σημεία-κλειδιά: 0=βαθιά νύχτα, 5=προαύγιο, 7=sunrise, 12=μεσημέρι, 18=sunset, 20=σούρουπο
    var stops = [
      { h: 0,  top: "#05070d", bottom: "#0b1020" },
      { h: 4,  top: "#06080f", bottom: "#101728" },
      { h: 5.5,top: "#1a1f35", bottom: "#3a3050" },
      { h: 7,  top: "#4a5d8c", bottom: "#d98a6a" },
      { h: 9,  top: "#7da8d9", bottom: "#bcd9ec" },
      { h: 12, top: "#6ba3dd", bottom: "#cfe3f0" },
      { h: 16, top: "#6b9bd1", bottom: "#c9dbe8" },
      { h: 18, top: "#4a5d8c", bottom: "#e8a76a" },
      { h: 19.5,top: "#23284a", bottom: "#8c4a5c" },
      { h: 21, top: "#0c1020", bottom: "#1a1f35" },
      { h: 24, top: "#05070d", bottom: "#0b1020" }
    ];

    var i, a, b, t;
    for (i = 0; i < stops.length - 1; i++) {
      if (hour >= stops[i].h && hour <= stops[i + 1].h) {
        a = stops[i];
        b = stops[i + 1];
        t = (hour - a.h) / (b.h - a.h);
        break;
      }
    }
    if (!a) { a = stops[0]; b = stops[1]; t = 0; }

    return "linear-gradient(180deg, " + mixHex(a.top, b.top, t) + " 0%, " + mixHex(a.bottom, b.bottom, t) + " 100%)";
  }

  function mixHex(c1, c2, t) {
    var a = hexRgb(c1), b = hexRgb(c2);
    var r = Math.round(a[0] + (b[0] - a[0]) * t);
    var g = Math.round(a[1] + (b[1] - a[1]) * t);
    var bl = Math.round(a[2] + (b[2] - a[2]) * t);
    return "rgb(" + r + "," + g + "," + bl + ")";
  }

  function hexRgb(hex) {
    return [
      parseInt(hex.slice(1, 3), 16),
      parseInt(hex.slice(3, 5), 16),
      parseInt(hex.slice(5, 7), 16)
    ];
  }

  function nightAmount(hour) {
    // 1 = πλήρης νύχτα (αστέρια ορατά), 0 = μέση ημέρα
    if (hour <= 5 || hour >= 21) return 1;
    if (hour >= 7 && hour <= 18) return 0;
    if (hour > 5 && hour < 7) return 1 - (hour - 5) / 2;
    return 1 - (hour - 18) / 3;
  }

  // ===== ΑΣΤΕΡΙΑ =====
  function seedStars() {
    starsCanvas.width = window.innerWidth;
    starsCanvas.height = window.innerHeight;
    stars = [];
    var n = Math.round((starsCanvas.width * starsCanvas.height) / 6500);
    for (var i = 0; i < n; i++) {
      stars.push({
        x: Math.random() * starsCanvas.width,
        y: Math.random() * starsCanvas.height * 0.85,
        r: 0.4 + Math.random() * 1.2,
        tw: Math.random() * Math.PI * 2,   // φάση twinkle
        sp: 0.5 + Math.random() * 1.5       // ταχύτητα twinkle
      });
    }
  }

  function drawStars(t) {
    starsCtx.clearRect(0, 0, starsCanvas.width, starsCanvas.height);
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      var alpha = 0.35 + 0.45 * Math.abs(Math.sin(s.tw + t * 0.001 * s.sp));
      starsCtx.globalAlpha = alpha;
      starsCtx.fillStyle = "#ffffff";
      starsCtx.fillRect(s.x, s.y, s.r, s.r);
    }
    starsCtx.globalAlpha = 1;
  }

  // ===== ΚΥΡΙΟΣ ΒΡΟΧΟΣ =====
  function nowDate() {
    return new Date(Date.now() + dayOffset * 86400000);
  }

  var MONTHS = ["Ιαν", "Φεβ", "Μαρ", "Απρ", "Μαϊ", "Ιουν", "Ιουλ", "Αυγ", "Σεπ", "Οκτ", "Νοε", "Δεκ"];

  function fmtDate(d) {
    return d.getDate() + " " + MONTHS[d.getMonth()] + " " + d.getFullYear();
  }

  function update() {
    var d = nowDate();
    var hour = d.getHours() + d.getMinutes() / 60;

    // Ουρανός & αστέρια
    skyEl.style.background = skyFor(hour);
    var na = nightAmount(hour);
    starsCanvas.classList.toggle("visible", na > 0.35);
    starsCanvas.style.opacity = String(Math.min(1, na * 1.4));

    // Φεγγάρι
    var age = moonAge(d);
    moonPhase = moonPhaseFromAge(age);
    drawMoon(moonPhase);

    // Κείμενα
    clockEl.textContent = fmtDate(d) + " · " +
      ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);

    var info = phaseInfo(moonPhase);
    phaseNameEl.textContent = info.name;
    phaseSubEl.textContent = info.sub;

    ageEl.textContent = age.toFixed(1) + " ημέρες";
    illumEl.textContent = Math.round(illumination(moonPhase) * 100) + "%";

    // Επόμενες πανσέληνοι/νέες σελήνες
    fullEl.textContent = fmtDate(findPhase(moonPhase, 0.5, d));
    newEl.textContent = fmtDate(findPhase(moonPhase, 0, d));
  }

  function findPhase(currentPhase, target, from) {
    var diff = target - currentPhase;
    if (diff < 0) diff += 1;
    if (diff === 0) diff = 1;
    return new Date(from.getTime() + diff * SYNODIC * 86400000);
  }

  // ===== ANIMATION LOOP =====
  var lastUpdate = 0;

  function loop(t) {
    drawStars(t);
    if (Date.now() - lastUpdate > 20000) { // ανανέωση κάθε 20''
      update();
      lastUpdate = Date.now();
    }
    requestAnimationFrame(loop);
  }

  // ===== ΧΡΟΝΟΤΑΞΙΔΕΥΜΑ =====
  document.addEventListener("keydown", function (e) {
    var tag = (e.target && e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "select" || tag === "textarea") return;
    if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
      dayOffset += (e.key === "ArrowRight") ? 1 : -1;
      if (dayOffset > 3650) dayOffset = 3650;
      if (dayOffset < -3650) dayOffset = -3650;
      update();
    } else if (e.key === "n" || e.key === "N" || e.key === "Home") {
      dayOffset = 0;
      update();
    }
  });

  // Σάρωση/πατήμα: χρονοταξίδευση ελαφρώς — κάθε 90ms = 1 μέρα
  var holding = false;
  var holdDir = 0;

  skyEl.parentElement.addEventListener("pointerdown", function (e) {
    if (e.target.closest("a, button")) return;
    holding = true;
    holdDir = e.clientX > window.innerWidth / 2 ? 1 : -1;
  });
  document.addEventListener("pointerup", function () { holding = false; });

  setInterval(function () {
    if (holding) {
      dayOffset += holdDir;
      if (dayOffset > 3650) dayOffset = 3650;
      if (dayOffset < -3650) dayOffset = -3650;
      update();
    }
  }, 90);

  window.addEventListener("resize", function () {
    seedStars();
    update();
  });

  // ===== INIT =====
  seedStars();
  update();
  requestAnimationFrame(loop);

})();
</script>

</body>
</html>
