<style>
  :root {
    --bg: #130f1a;
    --surface: #1b1526;
    --surface-2: #241b33;
    --border: #3a2c52;
    --text: #efeaf7;
    --text-muted: #a696c4;
    --accent: #c9a0ff;
    --accent-soft: rgba(201, 160, 255, 0.13);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background:
      radial-gradient(ellipse at 50% -20%, #251a35 0%, var(--bg) 65%);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  header h1 { font-size: 1.2rem; font-weight: 800; }
  header h1 span { color: var(--accent); }
  header .hint { font-size: 0.78rem; color: var(--text-muted); }

  /* ===== ΕΡΓΑΛΕΙΑ (γλώσσα + εγκατάσταση) ===== */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .lang-switch {
    display: flex;
    border: 1px solid var(--border);
    border-radius: 999px;
    overflow: hidden;
  }

  .lang-switch button {
    background: none;
    border: none;
    padding: 6px 12px;
    color: var(--text-muted);
    cursor: pointer;
    font: 700 0.75rem "Segoe UI", system-ui, sans-serif;
    letter-spacing: 0.04em;
  }

  .lang-switch button.active {
    background: var(--surface-2);
    color: var(--text);
  }

  #installBtn {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 999px;
    padding: 6px 14px;
    cursor: pointer;
    font: 700 0.75rem "Segoe UI", system-ui, sans-serif;
  }
  #installBtn:hover { border-color: var(--accent); }

  main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 300px;
    gap: 0;
  }

  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
    .side { border-left: none !important; border-top: 1px solid var(--border); }
  }

  /* ===== ΠΕΡΙΟΧΗ ΑΠΟΤΕΛΕΣΜΑΤΩΝ ===== */
  .results {
    padding: 30px 28px 44px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    overflow-y: auto;
  }

  .name-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
  }

  @keyframes popIn {
    from { transform: translateY(10px) scale(0.97); opacity: 0; }
    to   { transform: none; opacity: 1; }
  }

  .name-card .name {
    font-size: 1.12rem;
    font-weight: 800;
    letter-spacing: 0.01em;
    word-break: break-all;
    flex: 1;
  }

  .name-card .badge {
    font-size: 0.62rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px 9px;
    white-space: nowrap;
  }

  .name-card .actions {
    display: flex;
    gap: 6px;
  }

  .name-card .actions button {
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    width: 34px;
    height: 34px;
    cursor: pointer;
    font-size: 0.95rem;
    color: var(--text);
    transition: border-color 0.15s ease, background 0.15s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .name-card .actions button:hover { border-color: var(--accent); background: var(--accent-soft); }
  .name-card .actions button.starred { background: var(--accent-soft); border-color: var(--accent); }

  .more-btn {
    font-family: inherit;
    font-size: 1rem;
    font-weight: 800;
    padding: 15px;
    border-radius: 12px;
    cursor: pointer;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #1c1230;
    transition: filter 0.15s ease, transform 0.1s ease;
  }
  .more-btn:hover { filter: brightness(1.07); }
  .more-btn:active { transform: translateY(1px); }

  .copied-toast {
    position: fixed;
    bottom: 26px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--accent);
    color: #1c1230;
    font-size: 0.85rem;
    font-weight: 800;
    padding: 10px 22px;
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 30;
  }
  .copied-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ===== ΠΛΕΥΡΗ ΣΤΗΛΗ ===== */
  .side {
    border-left: 1px solid var(--border);
    padding: 24px 20px 34px;
    display: flex;
    flex-direction: column;
    gap: 22px;
    overflow-y: auto;
  }

  h2.section {
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    font-weight: 800;
    margin-bottom: 8px;
  }

  .modes { display: flex; flex-direction: column; gap: 7px; }

  .mode {
    font-family: inherit;
    text-align: left;
    font-size: 0.88rem;
    font-weight: 700;
    border-radius: 10px;
    padding: 10px 14px;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .mode small {
    display: block;
    font-size: 0.66rem;
    font-weight: 400;
    color: var(--text-muted);
    margin-top: 2px;
  }
  .mode:hover { border-color: var(--accent); }
  .mode.active { background: var(--accent-soft); border-color: var(--accent); }
  .mode.active small { color: var(--accent); opacity: 0.85; }

  /* Γλώσσα handles */
  .lang-toggle { display: flex; gap: 8px; }
  .lang-toggle button {
    font-family: inherit;
    font-size: 0.78rem;
    font-weight: 700;
    border-radius: 999px;
    padding: 6px 16px;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
  }
  .lang-toggle button.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

  /* Ύφος handles */
  .style-check {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 0.82rem;
    padding: 6px 0;
    color: var(--text);
    cursor: pointer;
    user-select: none;
  }
  .style-check input { accent-color: var(--accent); }

  /* Αγαπημένα */
  .fav-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .fav-list li {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 0.86rem;
    display: flex;
    align-items: center;
    gap: 8px;
    word-break: break-all;
  }
  .fav-list li .rm {
    margin-left: auto;
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 0.85rem;
    padding: 2px 4px;
  }
  .fav-list li .rm:hover { color: var(--accent); }
  .fav-empty { font-size: 0.78rem; color: var(--text-muted); font-style: italic; }

  footer {
    margin-top: auto;
    padding: 14px 24px;
    border-top: 1px solid var(--border);
    font-size: 0.76rem;
    color: var(--text-muted);
    text-align: center;
    line-height: 1.7;
  }
  footer a { color: var(--text); text-decoration: none; border-bottom: 1px dotted var(--text-muted); }
  footer a:hover { border-bottom-style: solid; }

  .kbd {
    display: inline-block;
    padding: 1px 6px;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 0.68rem;
    font-family: ui-monospace, monospace;
  }
</style>
</head>

</header>

<main>

  <section class="results" id="results">
    <button class="more-btn" id="genBtn">✦ <span data-en="Generate 8 names" data-el="Γέννησε 8 ονόματα">Generate 8 names</span></button>

  <aside class="side">

    <div>
      <h2 class="section" data-en="Mode" data-el="Τρόπος">Mode</h2>

        <button class="mode active" data-mode="handle">

        <button class="mode" data-mode="title">

      </div>
    </div>

    <div id="handleOpts">
      <h2 class="section" data-en="Character set" data-el="Αλφάβητο">Character set</h2>
      <div class="lang-toggle">
        <button class="active" data-lang="en" data-en="Latin (EN)" data-el="Λατινικά (EN)">Latin (EN)</button>
        <button data-lang="greek" data-en="Greek (GR)" data-el="Ελληνικά (GR)">Greek (GR)</button>
      </div>

      <h2 class="section" style="margin-top:18px;" data-en="Style" data-el="Ύφος">Style</h2>
      <label class="style-check">

        <span data-en="Leet variants (a→@)" data-el="Leet παραλλαγές (a→@)">Leet variants (a→@)</span>

      <label class="style-check">
        <input type="checkbox" id="chkSep" checked>

      </label>
      <label class="style-check">
        <input type="checkbox" id="chkNum">
        <span data-en="Numeric suffixes" data-el="Αριθμητικά επιθέματα">Numeric suffixes</span>
      </label>
    </div>

    <div>
      <h2 class="section" data-en="Favorites" data-el="Αγαπημένα">Favorites</h2>
      <ul class="fav-list" id="favList"></ul>
      <p class="fav-empty" id="favEmpty"

         data-el="Κανένα ακόμα — ⭐ ένα όνομα για να το κρατήσεις.">None yet — ⭐ a name to keep it.</p>
    </div>

  </aside>

</main>

<footer>
  <span data-en="Designed by" data-el="Σχεδιασμένο από τον">Designed by</span>
  <a href="https://koulaxizis.gr" target="_blank" rel="noopener">Christos Koulaxizis</a> ·
  <a href="../" data-en="All apps" data-el="Όλα τα apps">All apps</a><br>

</footer>

<div class="copied-toast" id="toast" data-en="Copied!" data-el="Αντιγράφηκε!">Copied!</div>

  };

  function detectLang() {
    try {
      var saved = localStorage.getItem(LANG_KEY);
      if (saved === "en" || saved === "el") return saved;
    } catch (e) {}
    var nav = (navigator.language || "en").slice(0, 2).toLowerCase();
    return nav === "el" ? "el" : "en";
  }

  var currentLang = detectLang();

  function applyStatic() {
    document.documentElement.setAttribute("lang", currentLang);
    document.title = T.title[currentLang];
    var metaDesc = document.querySelector('meta[name="description"]');
    if (metaDesc) metaDesc.setAttribute("content", T.metaDesc[currentLang]);
    var nodes = document.querySelectorAll("[data-en]");
    for (var i = 0; i < nodes.length; i++) {
      nodes[i].textContent = currentLang === "el"
        ? nodes[i].getAttribute("data-el")
        : nodes[i].getAttribute("data-en");
    }
    langEnBtn.classList.toggle("active", currentLang === "en");
    langElBtn.classList.toggle("active", currentLang === "el");
    toastEl.textContent = T.toast[currentLang];
    favEmptyEl.textContent = T.favEmpty[currentLang];
  }

  function setLang(lang) {
    currentLang = lang;
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
    applyStatic();
    renderFavs();   // τίτλοι κουμπιών αφαίρεσης

  // ===== ΛΕΞΙΚΟ — HANDLES (ελληνικά, κατά γένος) =====
  // bug #1: επίθετο + ουσιαστικό πάντα από την ίδια λίστα γένους

    "χρυσή","σιδερένια","τυχερή","γρήγορη","φωτεινή","άγρια","γλυκιά",

  ];
  var TITLE_DOMAINS_EL = [
    "της Ήσυχης Ιστοσελίδας","των Ανοιχτών Δρόμων","του Ελεύθερου Λογισμικού","της Μακριάς Νύχτας",
    "της Θάλασσας Static","των Φωλιασμένων Βρόχων","των Άγραφων","του Κοινού Κτήρους",
    "του Χωρίου 404","των Παραποτάμων Git","της Αυγής Τερματικού","του Βαθέος Cache",
    "των Αναλογικών Νήσων","του Αργού Διαδικτύου","του Αιθέριου LAN","της Ομίχλης Μεταγλώττισης"
  ];

  // ===== ΛΕΞΙΚΟ — ΔΥΝΑΣΤΙΚΑ ΖΕΥΓΗ =====
  var FIRST_EL = [
    "Ορέστης","Σαπφώ","Λάζαρος","Νεφέλη","Άρης","Ιφιγένεια","Θουκυδίδης",
    "Μαργαρίτα","Ελένη","Δημήτρης","Αγγελική","Λέων","Αμαλία","Κίμων"
  ];
  var EPITHET_EL = [
    "ο Σιωπηλός","του Φάρου","ο Αδέσποτος","της Σιωπής","ο Καλός",
    "της Λεωφόρου","ο Νυχτερινός","της Καταιγίδας","ο Ασημένιος","του Ψηλού Κόσμου"
  ];
  var PLACE_EL = [
    "της Πόλης","των Βράχων","της Ακτής","του Ανέμου","της Λεκάνης",
    "του Βορρά","της Στέππας","των Νησιών","της Χώρας","του Λιμανιού"
  ];

  var FIRST_EN = [
    "Orestis","Sappho","Lazaros","Nefeli","Aris","Ifigenia","Thoukydidis",
    "Margarita","Eleni","Dimitris","Angeliki","Leon","Amalia","Kimonas"
  ];
  var EPITHET_EN = [
    "the Silent","of the Lighthouse","the Unclaimed","of Silence","the Good",
    "of the Avenue","the Nightly","of the Storm","the Silver","of the High World"
  ];
  var PLACE_EN = [
    "of the City","of the Rocks","of the Coast","of the Wind","of the Basin",
    "of the North","of the Steppe","of the Islands","of the Land","of the Harbour"
  ];

  // ===== ΕΡΓΑΛΕΙΑ =====
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  // Handle σε λατινικούς χαρακτήρες: leet / separators / αριθμοί
  function toHandleEn(adj, noun) {
    var sep = style.sep ? pick(["", "_", "-", "."]) : "";
    var a = adj.toLowerCase();
    var n = noun.toLowerCase();
    if (style.leet && Math.random() < 0.28) {
      a = a.replace(/o/g, "0").replace(/e/g, "3").replace(/a/g, "@");
    }
    var h = a + sep + n;
    if (style.num && Math.random() < 0.4) {
      h += String(Math.floor(Math.random() * 90) + 10);
    }
    return h;
  }

  // Handle σε ελληνικά: σωστό ταιριασμα γένους (bug #1)
  // Σημ.: leet/αριθμοί έχουν νόημα μόνο σε λατινικούς — σκόπιμα δεν εφαρμόζονται εδώ
  function toHandleGr(adj, noun) {
    var sep = style.sep ? pick(["_", "-", ""]) : "";
    return adj + sep + noun;
  }

  function generateOne() {
    if (mode === "handle") {
      if (charset === "greek") {
        var g = pick(["m", "f", "n"]);
        var adj = g === "m" ? pick(ADJ_GR_M) : g === "f" ? pick(ADJ_GR_F) : pick(ADJ_GR_N);
        var noun = g === "m" ? pick(NOUN_GR_M) : g === "f" ? pick(NOUN_GR_F) : pick(NOUN_GR_N);
        return toHandleGr(adj, noun);
      }
      return toHandleEn(pick(ADJ_EN), pick(NOUN_EN));
    }
    if (mode === "title") {
      var roles = currentLang === "el" ? TITLE_ROLES_EL : TITLE_ROLES_EN;
      var domains = currentLang === "el" ? TITLE_DOMAINS_EL : TITLE_DOMAINS_EN;
      var sep = pick([" ", " ", " · ", " "]);
      return pick(roles) + (Math.random() < 0.55 ? sep + pick(domains) : "");
    }
    // duo — γλώσσα content = γλώσσα UI
    var first = currentLang === "el" ? pick(FIRST_EL) : pick(FIRST_EN);
    var ep = currentLang === "el" ? pick(EPITHET_EL) : pick(EPITHET_EN);
    var pl = currentLang === "el" ? pick(PLACE_EL) : pick(PLACE_EN);
    return first + " " + ep + " " + pl;
  }

  // ===== ΑΓΑΠΗΜΕΝΑ =====
  var favorites = [];
  try {
    var f = JSON.parse(localStorage.getItem(LS_FAVS) || "null");
    if (Array.isArray(f)) favorites = f.slice(0, 50);
  } catch (e) {}

  function saveFavs() {
    try { localStorage.setItem(LS_FAVS, JSON.stringify(favorites)); } catch (e) {}
  }

  // ===== RENDER =====
  function modeLabel() {
    return T.badge[mode][currentLang];
  }

  function renderBatch() {
    // Καθαρισμός παλιών καρτών (κρατάμε το κουμπί)
    Array.prototype.forEach.call(resultsEl.querySelectorAll(".name-card"), function (el) { el.remove(); });

    genBtn.textContent = T.gen[currentLang];

    for (var i = 0; i < 8; i++) {
      var name = generateOne();
      var card = document.createElement("div");
      card.className = "name-card";
      card.style.animationDelay = (i * 0.04) + "s";

      var nameEl = document.createElement("span");
      nameEl.className = "name";
      nameEl.textContent = name;

      var badge = document.createElement("span");
      badge.className = "badge";
      badge.textContent = modeLabel();

      var actions = document.createElement("div");
      actions.className = "actions";

      var star = document.createElement("button");
      star.title = T.tStar[currentLang];
      var starred = favorites.indexOf(name) !== -1;
      star.textContent = starred ? "⭐" : "☆";
      if (starred) star.classList.add("starred");
      star.addEventListener("click", function (nm, btn) {
        return function () { toggleFavorite(nm, btn); };
      }(name, star));

      var copy = document.createElement("button");
      copy.title = T.tCopy[currentLang];
      copy.textContent = "📋";
      copy.addEventListener("click", function (nm) {
        return function () { copyName(nm); };
      }(name));

      actions.appendChild(star);
      actions.appendChild(copy);

      card.appendChild(nameEl);
      card.appendChild(badge);
      card.appendChild(actions);

      resultsEl.insertBefore(card, genBtn);
    }
  }

  function toggleFavorite(name, btn) {
    var idx = favorites.indexOf(name);
    if (idx === -1) {
      favorites.unshift(name);
      if (favorites.length > 50) favorites.pop();
      btn.textContent = "⭐";
      btn.classList.add("starred");
    } else {
      favorites.splice(idx, 1);
      btn.textContent = "☆";
      btn.classList.remove("starred");
    }
    saveFavs();
    renderFavs();
  }

  function copyName(name) {
    function done() {
      toastEl.classList.add("show");
      setTimeout(function () { toastEl.classList.remove("show"); }, 1400);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(name).then(done, done);
    } else {
      var ta = document.createElement("textarea");
      ta.value = name;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); } catch (e) {}
      ta.remove();
      done();
    }
  }

  function renderFavs() {
    favListEl.innerHTML = "";
    favEmptyEl.style.display = favorites.length ? "none" : "block";
    for (var i = 0; i < favorites.length; i++) {
      var li = document.createElement("li");
      li.textContent = favorites[i];

      var rm = document.createElement("button");
      rm.className = "rm";
      rm.title = T.tRemove[currentLang];
      rm.textContent = "✕";
      rm.addEventListener("click", function (nm) {
        return function () {
          var idx = favorites.indexOf(nm);
          if (idx !== -1) { favorites.splice(idx, 1); saveFavs(); renderFavs(); renderBatch(); }
        };
      }(favorites[i]));

      li.appendChild(rm);
      favListEl.appendChild(li);
    }
  }

  // ===== UI EVENTS =====
  genBtn.addEventListener("click", renderBatch);

  var modeBtns = document.querySelectorAll(".mode");
  modeBtns.forEach(function (btn) {
    btn.addEventListener("click", function () {
      mode = btn.getAttribute("data-mode");
      modeBtns.forEach(function (b) { b.classList.remove("active"); });
      btn.classList.add("active");
      // Το σύνολο χαρακτήρων/ύφος αφορά μόνο τα handles
      handleOptsEl.style.opacity = (mode === "handle") ? "1" : "0.35";
      handleOptsEl.style.pointerEvents = (mode === "handle") ? "auto" : "none";
      renderBatch();
    });
  });

  var langBtns = document.querySelectorAll(".lang-toggle button");
  langBtns.forEach(function (btn) {
    btn.addEventListener("click", function () {
      charset = btn.getAttribute("data-lang");
      langBtns.forEach(function (b) { b.classList.remove("active"); });
      btn.classList.add("active");
    });
  });

  document.getElementById("chkLeet").addEventListener("change", function () { style.leet = this.checked; });
  document.getElementById("chkSep").addEventListener("change", function () { style.sep = this.checked; });
  document.getElementById("chkNum").addEventListener("change", function () { style.num = this.checked; });

  // ===== ΠΛΗΚΤΡΟΛΟΓΙΟ =====
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    var tag = (e.target && e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "textarea" || tag === "button" || tag === "select") return;
    renderBatch();
  });

  // ===== ΕΓΚΑΤΑΣΤΑΣΗ (PWA) =====
  var deferredPrompt = null;

  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.hidden = false;
  });

  installBtn.addEventListener("click", function () {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt = null;
    installBtn.hidden = true;
  });

  window.addEventListener("appinstalled", function () {
    deferredPrompt = null;
    installBtn.hidden = true;
  });

  // ===== SERVICE WORKER (offline — κοινός SW της σουίτας στη ρίζα) =====
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("../sw.js").catch(function (err) {
        console.warn("SW registration failed:", err);
      });
    });
  }

  // ===== INIT =====
  applyStatic();
  renderFavs();
  renderBatch();

})();
</script>

</body>
</html>
