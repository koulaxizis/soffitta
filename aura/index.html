<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aura Painter — Soffitta</title>
<meta name="description" content="Paint your aura — a few questions, an animated energy field, and a PNG or video to keep. Free, open source, no cookies, no tracking.">
<link rel="canonical" href="https://soffitta.site/aura/">

<meta property="og:url" content="https://soffitta.site/aura/">
<meta property="og:title" content="Aura Painter — Soffitta">
<meta property="og:description" content="Paint your aura — animated energy field, PNG and WebM export.">
<!-- TODO (αργότερα): og-cover.png 1200×630 στον φάκελο aura/ -->
<meta property="og:image" content="https://soffitta.site/aura/og-cover.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#171021">
<link rel="icon" type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23171021'/%3E%3Cpath d='M10 35L32 11L54 35' fill='none' stroke='%23e6ce9a' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='25' y='40' width='14' height='13' rx='3' fill='%23e0a3ff'/%3E%3C/svg%3E">
<link rel="manifest" href="../manifest.webmanifest">
<style>
  :root {
    --bg: #171021;
    --surface: #1e1629;
    --surface-2: #271d34;
    --border: #3a2b4d;
    --text: #f0e9f5;
    --text-muted: #a696b5;
    --accent: #e0a3ff;
    --accent-soft: rgba(224, 163, 255, 0.15);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  header h1 { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.01em; }
  header h1 span { color: var(--accent); }
  header .hint { font-size: 0.8rem; color: var(--text-muted); }

  /* ===== ΕΡΓΑΛΕΙΑ (γλώσσα + εγκατάσταση) ===== */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .lang-switch {
    display: flex;
    border: 1px solid var(--border);
    border-radius: 999px;
    overflow: hidden;
  }

  .lang-switch button {
    background: none;
    border: none;
    padding: 6px 12px;
    color: var(--text-muted);
    cursor: pointer;
    font: 700 0.75rem "Segoe UI", system-ui, sans-serif;
    letter-spacing: 0.04em;
  }

  .lang-switch button.active {
    background: var(--surface-2);
    color: var(--text);
  }

  #installBtn {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 999px;
    padding: 6px 14px;
    cursor: pointer;
    font: 700 0.75rem "Segoe UI", system-ui, sans-serif;
  }
  #installBtn:hover { border-color: var(--accent); }

  .layout {
    display: grid;
    grid-template-columns: 300px 1fr;
    gap: 0;
    flex: 1;
  }

  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; }
  }

  /* ===== CONTROLS ===== */
  aside {
    border-right: 1px solid var(--border);
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    overflow-y: auto;
  }

  @media (max-width: 820px) { aside { border-right: none; border-bottom: 1px solid var(--border); } }

  .group { display: flex; flex-direction: column; gap: 8px; }

  .group label {
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    font-weight: 700;
  }

  select, input[type="text"] {
    width: 100%;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 11px;
    font-size: 0.9rem;
    font-family: inherit;
    outline: none;
  }

  select:focus, input:focus { border-color: var(--accent); }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 6px;
    border-radius: 3px;
    background: var(--surface-2);
    outline: none;
    border: 1px solid var(--border);
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }

  input[type="range"]::-moz-range-thumb {
    width: 16px; height: 16px;
    border: none;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }

  .range-val { font-size: 0.78rem; color: var(--accent); font-variant-numeric: tabular-nums; }

   .check-row {
     display: flex;
     align-items: center;
     gap: 10px;
     font-size: 0.88rem;
     cursor: pointer;
     user-select: none;
   }
   .check-row input { accent-color: var(--accent); width: 16px; height: 16px; cursor: pointer; }

  /* Mood chips */
  .moods {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }

  .mood {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    border-radius: 10px;
    padding: 10px 6px;
    cursor: pointer;
    text-align: center;
    font: 700 0.8rem "Segoe UI", system-ui, sans-serif;
    transition: border-color 0.15s ease, color 0.15s ease, transform 0.1s ease;
  }

  .mood:hover { transform: translateY(-2px); border-color: var(--text); }
  .mood.active {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-soft);
  }

  button {
    font-family: inherit;
    font-size: 0.88rem;
    font-weight: 700;
    border-radius: 8px;
    padding: 10px 14px;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
  }

  button:hover { background: var(--surface-2); border-color: var(--accent); }
  button:active { transform: translateY(1px); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #241430; }
  button.primary:hover { filter: brightness(1.08); background: var(--accent); }
  button.primary.recording { background: #ff6e8a; border-color: #ff6e8a; color: #2a0d14; }

  .btn-row { display: flex; gap: 8px; }
  .btn-row button { flex: 1; }

  footer {
    margin-top: auto;
    padding: 18px 24px;
    border-top: 1px solid var(--border);
    font-size: 0.78rem;
    color: var(--text-muted);
    text-align: center;
    line-height: 1.7;
  }

  footer a { color: var(--text); text-decoration: none; border-bottom: 1px dotted var(--text-muted); }
  footer a:hover { border-bottom-style: solid; }

  /* ===== PREVIEW ===== */
  main {
    padding: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 50vh;
  }

  .canvas-frame {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.45);
    max-width: 100%;
  }

  #aura {
    display: block;
    max-width: 100%;
    max-height: 68vh;
    width: auto;
    height: auto;
    border-radius: 6px;
    background: #000;
  }

  .status {
    text-align: center;
    margin-top: 10px;
    font-size: 0.76rem;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }
  
</style>
</head>

<body>

<header>
  <div>
    <h1>🌈 Aura <span>Painter</span></h1>
    <p class="hint" data-en="Answer a little, watch your aura breathe, keep it as PNG or video."
       data-el="Απάντησε σε λίγες ερωτήσεις, δες την αύρα σου να ανασαίνει, κράτα τη σε PNG ή βίντεο.">Paint your aura — animated energy field, PNG and WebM export.</p>
  </div>
  <div class="toolbar">
    <button id="installBtn" hidden data-en="⬇ Install app" data-el="⬇ Εγκατάσταση">⬇ Install app</button>
    <div class="lang-switch" role="group" aria-label="Language">
      <button id="langEn" class="active">EN</button>
      <button id="langEl">ΕΛ</button>

  </div>
</header>

<div class="layout">

  <aside>

    <div class="group">
      <label for="nameInput" data-en="Your name" data-el="Το όνομά σου">Your name</label>
      <input type="text" id="nameInput" maxlength="24" placeholder="e.g. asteri" autocomplete="off" spellcheck="false">
    </div>

    <div class="group">
      <label data-en="Mood" data-el="Διάθεση">Mood</label>
      <div class="moods" id="moods">
        <button class="mood active" data-mood="calm"     data-en="😌 Calm"     data-el="😌 Γαλήνη">😌 Calm</button>
        <button class="mood" id="moodJoyBtn" data-mood="bright" data-en="✨ Radiant" data-el="✨ Λάμψη">✨ Radiant</button>
        <button class="mood" id="moodDreamBtn" data-mood="dream" data-en="🌙 Dreamy" data-el="🌙 Ονειρικό">🌙 Dreamy</button>
        <button class="mood" id="moodFireBtn" data-mood="fire" data-en="🔥 Fierce" data-el="🔥 Φλογερό">🔥 Fiery</button>
        <button class="mood" id="moodSage" data-mood="sage" data-en="🌿 Grounded" data-el="🌿 Γήινο">🌿 Grounded</button>
        <button class="mood" id="moodWave" data-mood="deep" data-en="🌊 Deep" data-el="🌊 Βαθύ">🌊 Deep</button>
      </div>
    </div>

    <div class="group">
      <label for="pulseRange"><span data-en="Pulse" data-el="Σφυγμός">Pulse</span> <span class="range-val" id="pulseVal">50%</span></label>
      <input type="range" id="pulseRange" min="10" max="100" value="50">
    </div>

    <div class="group">
      <label for="raysRange"><span data-en="Layers" data-el="Στρώματα">Layers</span> <span class="range-val" id="raysVal">5</span></label>
      <input type="range" id="raysRange" min="3" max="9" value="5">
    </div>

    <div class="group">
      <label class="check-row">
        <input type="checkbox" id="sparklesChk" checked>
        <span data-en="Sparkles" data-el="Σπίθες">Sparkles</span>
      </label>
    </div>

    <div class="group">
      <button class="primary" id="paintBtn" data-en="✦ Repaint aura" data-el="✦ Ξαναζωγράφισε">✦ Repaint</button>
    </div>

    <div class="group">
      <div class="btn-row">
        <button id="pngBtn">💾 PNG</button>
        <button id="webmBtn">🎥 WebM</button>
      </div>
    </div>

  </aside>

  <main>
    <div class="canvas-frame">
      <canvas id="aura" width="960" height="960"></canvas>
      <div class="status" id="statusLine"></div>
    </div>
  </main>

</div>

<footer>
  <span data-en="Designed by" data-el="Σχεδιασμένο από τον">Designed by</span>
  <a href="https://koulaxizis.gr" target="_blank" rel="noopener">Christos Koulaxizis</a> ·
  <a href="../" data-en="All apps" data-el="Όλα τα apps">All apps</a><br>
  <span data-en="No cookies · No tracking · Open source"
        data-el="Χωρίς cookies · Χωρίς tracking · Ανοιχτού κώδικα">No cookies · No tracking · Open source</span>
</footer>

<script>
"use strict";
(function () {

  var TAU = Math.PI * 2;

  // ===== ΣΤΑΘΕΡΕΣ =====
  // Παλέτες ανά mood — τα κλειδιά ταιριάζουν με τα data-mood του Part 2
  var MOODS = {
    calm:   { name_en: "Calm",     name_el: "Γαλήνη",  colors: ["#7ee8d8", "#4fd1c5", "#2bb3b0", "#a5f3e4"] },
    bright: { name_en: "Radiant",  name_el: "Λάμψη",   colors: ["#ffe29a", "#ffd166", "#ffb35c", "#f0a5ff"] },
    dream:  { name_en: "Dreamy",   name_el: "Ονειρικό", colors: ["#8ea6ff", "#6c7bff", "#a5b4fc", "#c3b5ff"] },
    fire:   { name_en: "Fierce",   name_el: "Φλογερό", colors: ["#ff8a70", "#ff6e5e", "#ffa76a", "#ff4d6d"] },
    sage:   { name_en: "Grounded", name_el: "Γήινο",   colors: ["#a8d5a2", "#8bc34a", "#c5e1a5", "#6fbf73"] },
    deep:   { name_en: "Deep",     name_el: "Βαθύ",    colors: ["#6ea8ff", "#4f7bff", "#59d2ff", "#3a6bd6"] }
  };

  // ===== DOM =====
  var canvas = document.getElementById("aura");
  var ctx = canvas.getContext("2d");
  var nameInput = document.getElementById("nameInput");
  var moodsEl = document.getElementById("moods");
  var pulseRange = document.getElementById("pulseRange");
  var raysRange = document.getElementById("raysRange");
  var pulseVal = document.getElementById("pulseVal");
  var raysVal = document.getElementById("raysVal");
  var sparklesChk = document.getElementById("sparklesChk");
  var paintBtn = document.getElementById("paintBtn");
  var pngBtn = document.getElementById("pngBtn");
  var webmBtn = document.getElementById("webmBtn");
  var statusLine = document.getElementById("statusLine");
  var langEnBtn = document.getElementById("langEn");
  var langElBtn = document.getElementById("langEl");
  var installBtn = document.getElementById("installBtn");

  // ===== i18n (κοινό μοτίβο σε όλη τη σουίτα) =====
  var LANG_KEY = "soffitta.lang";

  var T = {
    title: {
      en: "Aura Painter — Soffitta",
      el: "Ζωγράφος Αύρας — Soffitta"
    },
    metaDesc: {
      en: "Paint your aura — a few questions, an animated energy field, and a PNG or video to keep. Free, open source, no cookies, no tracking.",
      el: "Ζωγράφισε την αύρα σου — λίγες απαντήσεις, ένα κινούμενο πεδίο ενέργειας, PNG ή βίντεο για να την κρατήσεις. Χωρίς cookies, χωρίς tracking."
    },
    recording: { en: "Recording…", el: "Καταγραφή…" },
    savedPng: { en: "Saved PNG ✓", el: "Το PNG αποθηκεύτηκε ✓" },
    savedWebm: { en: "Saved WebM ✓", el: "Το WebM αποθηκεύτηκε ✓" },
    noVideo: {
      en: "Video export is not supported in this browser.",
      el: "Η εξαγωγή βίντεο δεν υποστηρίζεται σε αυτόν τον browser."
    },
    anonymous: { en: "nameless one", el: "ανώνυμος" }
  };

  var currentLang = detectLang();

  function detectLang() {
    try {
      var saved = localStorage.getItem(LANG_KEY);
      if (saved === "en" || saved === "el") return saved;
    } catch (e) {}
    var nav = (navigator.language || "en").slice(0, 2).toLowerCase();
    return nav === "el" ? "el" : "en";
  }

  function applyStatic() {
    document.documentElement.setAttribute("lang", currentLang);
    document.title = T.title[currentLang];
    var metaDesc = document.querySelector('meta[name="description"]');
    if (metaDesc) metaDesc.setAttribute("content", T.metaDesc[currentLang]);
    var nodes = document.querySelectorAll("[data-en]");
    for (var i = 0; i < nodes.length; i++) {
      nodes[i].textContent = currentLang === "el"
        ? nodes[i].getAttribute("data-el")
        : nodes[i].getAttribute("data-en");
    }
    langEnBtn.classList.toggle("active", currentLang === "en");
    langElBtn.classList.toggle("active", currentLang === "el");
    renderStatus();
  }

  function setLang(lang) {
    currentLang = lang;
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
    applyStatic();
  }

  langEnBtn.addEventListener("click", function () { setLang("en"); });
  langElBtn.addEventListener("click", function () { setLang("el"); });

  // ===== STATE =====
  var state = {
    name: "",
    mood: "calm",
    pulse: 0.5,     // 0.1..1
    layers: 5,      // 3..9
    sparkles: true,
    seed: ""
  };

  // Κατά-entity παραμετρικοί χειριστές (από το seed — deterministic)
  var entity = { phases: [], wobs: [], speeds: [], sparkle: [] };

  // ===== RNG (deterministic από seed — ίδιο pattern με Wallpaper) =====
  function xmur3(str) {
    var h = 1779033703 ^ str.length;
    for (var i = 0; i < str.length; i++) {
      h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
      h = (h << 13) | (h >>> 19);
    }
    return function () {
      h = Math.imul(h ^ (h >>> 16), 2246822507);
      h = Math.imul(h ^ (h >>> 13), 3266489909);
      return (h ^= h >>> 16) >>> 0;
    };
  }

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function deriveEntity() {
    var hasher = xmur3(state.seed);
    var rng = mulberry32(hasher());
    entity.phases = [];
    entity.wobs = [];
    entity.speeds = [];
    entity.sparkle = [];
    for (var i = 0; i < 9; i++) { // μέγιστο layers = 9
      entity.phases.push(rng() * TAU);
      entity.wobs.push(0.05 + rng() * 0.10);
      entity.speeds.push(0.3 + rng() * 0.8);
    }
    for (var s = 0; s < 40; s++) {
      entity.sparkle.push({
        x: 0.1 + rng() * 0.8,
        y: 0.1 + rng() * 0.8,
        ph: rng() * TAU,
        sp: 0.5 + rng() * 1.5,
        r: 1 + rng() * 2
      });
    }
  }

  // ===== ΒΟΗΘΗΤΙΚΑ =====
  function rgba(hex, a) {
    var r = parseInt(hex.slice(1, 3), 16);
    var g = parseInt(hex.slice(3, 5), 16);
    var b = parseInt(hex.slice(5, 7), 16);
    return "rgba(" + r + "," + g + "," + b + "," + a + ")";
  }

  // ===== RENDER (συνεχές animation loop) =====
  var t0 = performance.now();

  function drawBlob(cx, cy, R, col, wob, ph, t) {
    ctx.beginPath();
    var steps = 56;
    for (var s = 0; s <= steps; s++) {
      var ang = (s / steps) * TAU;
      var rr = R * (1 + wob * (
        0.5 * Math.sin(3 * ang + ph) +
        0.3 * Math.sin(5 * ang - ph * 1.7 + t * 0.7) +
        0.2 * Math.sin(2 * ang + t * 0.5 + ph)
      ));
      var x = cx + Math.cos(ang) * rr;
      var y = cy + Math.sin(ang) * rr;
      if (s === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
    var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 1.2);
    g.addColorStop(0, rgba(col, 0.34));
    g.addColorStop(0.65, rgba(col, 0.16));
    g.addColorStop(1, rgba(col, 0));
    ctx.fillStyle = g;
    ctx.fill();
  }

  function draw(t) {
    var W = canvas.width;
    var H = canvas.height;
    var cx = W / 2;
    var cy = H / 2;
    var minDim = Math.min(W, H);

    // Background: βαθύ βιολετέ σκούρο με απαλή άκρη
    ctx.globalCompositeOperation = "source-over";
    var bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, minDim * 0.72);
    bg.addColorStop(0, "#241430");
    bg.addColorStop(1, "#0c0813");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    var pal = MOODS[state.mood].colors;
    var L = state.layers;

    // Αναπνοή — κύμα σφυγμού
    var beat = Math.sin(t * (1.2 + state.pulse * 2.2));
    var breath = 1 + (0.03 + state.pulse * 0.09) * beat;

    // Στρώματα (additive light)
    ctx.globalCompositeOperation = "lighter";
    for (var i = 0; i < L; i++) {
      var R = minDim * 0.24 * (0.42 + 0.58 * (i / Math.max(1, L - 1))) * breath;
      var col = pal[i % pal.length];
      drawBlob(cx, cy, R, col, entity.wobs[i], entity.phases[i], t * entity.speeds[i]);
    }

    // Κέντρο: καύσα φωτεινό πυρήνας
    var core = ctx.createRadialGradient(cx, cy, 0, cx, cy, minDim * 0.07 * breath);
    core.addColorStop(0, rgba("#ffffff", 0.5));
    core.addColorStop(1, rgba("#ffffff", 0));
    ctx.fillStyle = core;
    ctx.beginPath();
    ctx.arc(cx, cy, minDim * 0.07 * breath, 0, TAU);
    ctx.fill();

    // Σπίθες
    if (state.sparkles) {
      for (var s = 0; s < entity.sparkle.length; s++) {
        var sp = entity.sparkle[s];
        var tw = 0.5 + 0.5 * Math.sin(t * sp.sp + sp.ph);
        if (tw < 0.25) continue; // αναβοσβήνουν
        ctx.fillStyle = rgba("#ffffff", 0.25 * tw);
        ctx.beginPath();
        ctx.arc(sp.x * W, sp.y * H, sp.r * tw, 0, TAU);
        ctx.fill();
      }
    }
  }

  function frame() {
    var t = (performance.now() - t0) / 1000;
    draw(t);
    window.requestAnimationFrame(frame);
  }

  // ===== STATUS =====
  function renderStatus() {
    var moodName = currentLang === "el" ? MOODS[state.mood].name_el : MOODS[state.mood].name_en;
    var who = state.name.trim() || T.anonymous[currentLang];
    statusLine.textContent = who + " · " + moodName + " · " + canvas.width + " × " + canvas.height;
  }

  // ===== EVENTS =====
  moodsEl.addEventListener("click", function (e) {
    var btn = e.target;
    if (!btn.classList || !btn.classList.contains("mood")) return;
    var mood = btn.getAttribute("data-mood");
    if (!mood || !MOODS[mood]) return;
    state.mood = mood;
    var kids = moodsEl.querySelectorAll(".mood");
    for (var i = 0; i < kids.length; i++) {
      kids[i].classList.toggle("active", kids[i] === btn);
    }
    renderStatus();
  });

  nameInput.addEventListener("input", function () {
    state.name = nameInput.value;
    state.seed = buildSeed();
    deriveEntity();
    renderStatus();
  });

  pulseRange.addEventListener("input", function () {
    state.pulse = pulseRange.value / 100;
    pulseVal.textContent = pulseRange.value + "%";
  });

  raysRange.addEventListener("input", function () {
    state.layers = parseInt(raysRange.value, 10) || 5;
    raysVal.textContent = raysRange.value;
  });

  sparklesChk.addEventListener("change", function () {
    state.sparkles = sparklesChk.checked;
  });

  function buildSeed() {
    var who = nameInput.value.trim().toLowerCase() || "anonymous";
    return who + "|" + state.mood + "|" + state.seedSalt;
  }

  state.seedSalt = "0";

  paintBtn.addEventListener("click", function () {
    // Νέο salt → νέα μορφή για την ίδια ταυτότητα
    state.seedSalt = String(Math.floor(Math.random() * 1e9));
    state.seed = buildSeed();
    deriveEntity();
  });

  // ===== ΕΞΑΓΩΓΗ =====
  var savedTimer = null;

  function flashStatus(msg) {
    statusLine.textContent = msg;
    clearTimeout(savedTimer);
    savedTimer = setTimeout(renderStatus, 2200);
  }

  function downloadBlob(blob, fname) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = fname;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
  }

  function safeName() {
    var who = (state.name.trim() || "aura").toLowerCase();
    return who.replace(/[^a-z0-9\-_]/gi, "_");
  }

  pngBtn.addEventListener("click", function () {
    canvas.toBlob(function (blob) {
      if (!blob) return;
      downloadBlob(blob, "aura_" + safeName() + "_" + canvas.width + "x" + canvas.height + ".png");
      flashStatus(T.savedPng[currentLang]);
    }, "image/png");
  });

  // WebM: live καταγραφή 4 δευτερολέπτων μέσω MediaRecorder
  var recording = false;

  webmBtn.addEventListener("click", function () {
    if (recording) return;

    if (!canvas.captureStream || typeof MediaRecorder === "undefined") {
      statusLine.textContent = T.noVideo[currentLang];
      return;
    }

    var mime = null;
    var candidates = ["video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"];
    for (var i = 0; i < candidates.length; i++) {
      if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(candidates[i])) {
        mime = candidates[i];
        break;
      }
    }

    try {
      var stream = canvas.captureStream(30);
      var rec = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
      var chunks = [];

      rec.ondataavailable = function (ev) {
        if (ev.data && ev.data.size > 0) chunks.push(ev.data);
      };
      rec.onstop = function () {
        recording = false;
        webmBtn.classList.remove("recording");
        var blob = new Blob(chunks, { type: "video/webm" });
        downloadBlob(blob, "aura_" + safeName() + ".webm");
        flashStatus(T.savedWebm[currentLang]);
      };

      recording = true;
      webmBtn.classList.add("recording");
      statusLine.textContent = T.recording[currentLang];

      rec.start();
      setTimeout(function () {
        try { rec.stop(); } catch (e) {}
      }, 4000);
    } catch (e) {
      recording = false;
      webmBtn.classList.remove("recording");
      statusLine.textContent = T.noVideo[currentLang];
    }
  });

  // ===== UI SETUP =====
  (function init() {
    state.pulse = pulseRange.value / 100;
    state.layers = parseInt(raysRange.value, 10) || 5;
    state.name = nameInput.value;
    state.seed = buildSeed();
    deriveEntity();
    applyStatic();   // i18n πριν το πρώτο frame
    frame();         // συνεχές animation loop
  })();

  // ===== ΕΓΚΑΤΑΣΤΑΣΗ (PWA) =====
  var deferredPrompt = null;

  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.hidden = false;
  });

  installBtn.addEventListener("click", function () {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt = null;
    installBtn.hidden = true;
  });

  window.addEventListener("appinstalled", function () {
    deferredPrompt = null;
    installBtn.hidden = true;
  });

  // ===== SERVICE WORKER (offline — κοινός SW της σουίτας στη ρίζα) =====
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("../sw.js").catch(function (err) {
        console.warn("SW registration failed:", err);
      });
    });
  }

})();
</script>

</body>
</html>
