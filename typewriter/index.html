<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Typewriter — Soffitta</title>
<meta name="description" content="A typewriter with sounds, a bell and a paper roll. Type for fun — nothing is ever saved. Free, open source, no cookies, no tracking.">
<link rel="canonical" href="https://soffitta.site/typewriter/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://soffitta.site/typewriter/">
<meta property="og:title" content="Typewriter — Soffitta">
<meta property="og:description" content="A typewriter with sounds, a bell and a paper roll. Nothing is ever saved.">
<!-- TODO (αργότερα): og-cover.png 1200×630 στον φάκελο typewriter/ -->

      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231a1512'/%3E%3Cpath d='M10 35L32 11L54 35' fill='none' stroke='%23e6ce9a' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='25' y='40' width='14' height='13' rx='3' fill='%23d7ccc8'/%3E%3C/svg%3E">
<link rel="manifest" href="../manifest.webmanifest">
<style>
  :root {
    --bg: #1a1512;
    --desk: #241d16;
    --paper: #f0e8d8;
    --paper-shade: #e2d8c4;
    --ink: #33302a;
    --text: #ede5d5;
    --text-muted: #a89a80;
    --border: #3e3528;
    --accent: #d7ccc8;
    --machine: #4a3f33;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 16px 24px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  header h1 { font-size: 1.2rem; font-weight: 800; }
  header h1 span { color: var(--accent); }
  header .hint { font-size: 0.78rem; color: var(--text-muted); }

  /* ===== ΕΡΓΑΛΕΙΑ (γλώσσα + εγκατάσταση) ===== */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .lang-switch {
    display: flex;
    border: 1px solid var(--border);
    border-radius: 999px;
    overflow: hidden;
  }

  .lang-switch button {
    background: none;
    border: none;
    padding: 6px 12px;
    color: var(--text-muted);
    cursor: pointer;
    font: 700 0.75rem "Segoe UI", system-ui, sans-serif;
    letter-spacing: 0.04em;
  }

  .lang-switch button.active {
    background: var(--machine);
    color: var(--text);
  }

  #installBtn {
    border: 1px solid var(--border);
    background: var(--machine);
    color: var(--text);
    border-radius: 999px;
    padding: 6px 14px;
    cursor: pointer;
    font: 700 0.75rem "Segoe UI", system-ui, sans-serif;
  }
  #installBtn:hover { border-color: var(--accent); }

  /* ===== DESK / STAGE ===== */
  #stage {
    flex: 1;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 30px 16px 60px;
    overflow: hidden;
    background:
      radial-gradient(ellipse at 50% 0%, #2c2318 0%, var(--bg) 70%);
  }

  .paper-scroll {
    width: min(680px, 100%);
    display: flex;
    flex-direction: column;
    align-items: stretch;
  }

  /* Ρολό χαρτιού (κορυφή) */
  .roll-top {
    height: 34px;
    background: linear-gradient(#d8cdb6, var(--paper-shade));
    border: 1px solid #c4b89e;
    border-bottom: none;
    border-radius: 10px 10px 0 0;
    position: relative;
  }
  .roll-top::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -2px;
    height: 6px;
    background: repeating-linear-gradient(90deg,
      transparent 0 46px, rgba(0,0,0,0.06) 46px 50px);
  }

  .paper {
    background: var(--paper);
    color: var(--ink);
    font-family: "Courier New", Courier, monospace;
    font-size: 1.02rem;
    line-height: 1.85;
    padding: 38px 44px 90px;
    min-height: 340px;
    border-left: 1px solid #c4b89e;
    border-right: 1px solid #c4b89e;
    position: relative;
    cursor: text;
    box-shadow: inset 0 0 60px rgba(120, 90, 40, 0.08);
  }

  /* Γραμμές χαρτιού — υπαισθησία με watermark */
  .paper.lines::before {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      transparent 0 calc(1.85em - 1px),
      rgba(120, 90, 40, 0.10) calc(1.85em - 1px) 1.85em);
    pointer-events: none;
  }

  .paper .line { white-space: pre-wrap; word-break: break-word; min-height: 1.85em; }

  /* Κέρσορας γραφομηχανής */
  .caret {
    display: inline-block;
    width: 0.55em;
    background: var(--ink);
    margin-left: 1px;
    animation: caretBlink 1s steps(1) infinite;
  }
  @keyframes caretBlink { 50% { opacity: 0; } }

  /* Πάτημα μπάρας: μικρό jitter σε όλο το χαρτί */
  .paper.keyed { animation: keyJolt 0.08s ease; }
  @keyframes keyJolt {
    0% { transform: translateY(0); }
    50% { transform: translateY(1.5px); }
    100% { transform: translateY(0); }
  }

  /* Κολλημένος τροχός: παροδική μικρή οριζόντια μετατόπιση */
  .paper.stuck { animation: stickJolt 0.1s ease; }
  @keyframes stickJolt {
    0% { transform: translateX(0); }
    50% { transform: translateX(1.2px); }
    100% { transform: translateX(0); }
  }

  /* Το χαρτί «σηκώνεται» καθώς γεμίζει */
  .paper-wrap { position: relative; overflow: hidden; max-height: 62vh; }
  .paper-inner {
    position: relative;
    transition: top 0.05s linear;
  }

  /* Κατώτερο άκρο — «κόβεται» */
  .cut-edge {
    height: 22px;
    background: var(--paper-shade);
    border: 1px solid #c4b89e;
    border-top: none;
    border-radius: 0 0 10px 10px;
  }

  /* ===== MACHINE BAR ===== */
  .machine {
    margin-top: 18px;
    background: linear-gradient(var(--machine), #3a3126);
    border: 1px solid #2c251c;
    border-radius: 14px;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }

  .machine .model {
    font-size: 0.72rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #8f8371;
    font-weight: 800;
  }

  .machine .keys-hint { font-size: 0.76rem; color: #a89a80; }

  button {
    font-family: inherit;
    font-size: 0.8rem;
    font-weight: 700;
    border-radius: 8px;
    padding: 8px 14px;
    cursor: pointer;
    border: 1px solid #2c251c;
    background: #57493a;
    color: var(--text);
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
  }

  button:hover { border-color: var(--accent); }
  button:active { transform: translateY(1px); }
  button.danger:hover { border-color: #ff8a80; }

  .dials { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  .switch {
    font-size: 0.72rem;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    user-select: none;
  }
  .switch input { accent-color: #d7ccc8; cursor: pointer; }

  footer {
    padding: 14px 24px;
    border-top: 1px solid var(--border);
    font-size: 0.76rem;
    color: var(--text-muted);
    text-align: center;
    line-height: 1.7;
  }

  footer a { color: var(--text); text-decoration: none; border-bottom: 1px dotted var(--text-muted); }
  footer a:hover { border-bottom-style: solid; }

  .kbd {
    display: inline-block;
    padding: 1px 6px;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 0.68rem;
    font-family: ui-monospace, monospace;
  }
</style>
</head>

<body>

<header>
  <div>
    <h1>⌨️ Type<span>writer</span></h1>
    <p class="hint">
      <span data-en="Type whatever you like — nothing is saved anywhere."
            data-el="Γράψε ό,τι θες — τίποτα δεν σώζεται πουθενά.">Type whatever you like — nothing is saved anywhere.</span>
      <span class="kbd">Esc</span>
      <span data-en="new sheet" data-el="νέο φύλλο">new sheet</span>
    </p>
  </div>
  <div class="toolbar">
    <button id="installBtn" hidden data-en="⬇ Install app" data-el="⬇ Εγκατάσταση">⬇ Install app</button>
    <div class="lang-switch" role="group" aria-label="Language">
      <button id="langEn" class="active">EN</button>
      <button id="langEl">ΕΛ</button>

</header>

<div id="stage">
  <div class="paper-scroll">

    <div class="roll-top"></div>

    <div class="paper-wrap">
      <div class="paper-inner" id="paperInner">
        <div class="paper lines" id="paper">
          <div class="line" id="renderLine"></div>
        </div>
      </div>
    </div>

    <div class="cut-edge"></div>

    <div class="machine">
      <span class="model" id="modelLabel" data-en="THERMOS &amp; CO — MODEL K-7" data-el="ΘΕΡΜΟΣ &amp; ΣΙΑ — ΜΟΝΤΕΛΟ Κ‑7">THERMOS &amp; CO — MODEL K-7</span>
      <div class="dials">
        <label class="switch" id="soundLbl">
          <input type="checkbox" id="soundChk" checked>
          <span data-en="Sound" data-el="Ήχος">Sound</span>
        </label>
        <label class="switch" id="misalignLbl">
          <input type="checkbox" id="misalignChk" checked>
          <span data-en="Sticky keys" data-el="Κολλημένα πλήκτρα">Sticky keys</span>
        </label>
        <button id="bellBtn">🔔</button>
        <button id="returnBtn">↵</button>
        <button id="clearBtn" class="danger">🧻 <span data-en="New sheet" data-el="Νέο φύλλο">New sheet</span></button>
      </div>
      <span class="keys-hint" id="keysHint">0 words · 0 characters</span>
    </div>

  </div>
</div>

<footer>
  <span data-en="Designed by" data-el="Σχεδιασμένο από τον">Designed by</span>
  <a href="https://koulaxizis.gr" target="_blank" rel="noopener">Christos Koulaxizis</a> ·
  <a href="../" data-en="All apps" data-el="Όλα τα apps">All apps</a><br>
  <span data-en="No cookies · No tracking · Open source · Nothing is ever saved"
        data-el="Χωρίς cookies · Χωρίς tracking · Ανοιχτού κώδικα · Τίποτα δεν αποθηκεύεται">No cookies · No tracking · Open source · Nothing is ever saved</span>
</footer>

<script>
"use strict";
(function () {

  // ===== DOM =====
  var paper = document.getElementById("paper");
  var paperInner = document.getElementById("paperInner");
  var renderLine = document.getElementById("renderLine");
  var soundChk = document.getElementById("soundChk");
  var misalignChk = document.getElementById("misalignChk");
  var bellBtn = document.getElementById("bellBtn");
  var returnBtn = document.getElementById("returnBtn");
  var clearBtn = document.getElementById("clearBtn");
  var keysHint = document.getElementById("keysHint");
  var soundLbl = document.getElementById("soundLbl");
  var misalignLbl = document.getElementById("misalignLbl");
  var langEnBtn = document.getElementById("langEn");
  var langElBtn = document.getElementById("langEl");
  var installBtn = document.getElementById("installBtn");

  // ===== i18n (κοινό μοτίβο σε όλη τη σουίτα) =====
  var LANG_KEY = "soffitta.lang";

  var T = {
    title: {
      en: "Typewriter — Soffitta",
      el: "Γραφομηχανή — Soffitta"
    },
    metaDesc: {
      en: "A typewriter with sounds, a bell and a paper roll. Type for fun — nothing is ever saved. Free, open source, no cookies, no tracking.",
      el: "Μια γραφομηχανή με ήχους και ρολό χαρτί. Γράφεις για πλάκα — τίποτα δεν σώζεται. Χωρίς cookies, χωρίς tracking."
    },
    soundTitle: { en: "Key sounds", el: "Ήχοι πλήκτρων" },
    stickyTitle: { en: "Occasional sticky keys — for authenticity!", el: "Περιστασιακά κολλημένα πλήκτρα — για γνησιότητα!" },
    bellTitle: { en: "Ring the bell", el: "Κουδούνισμα" },
    returnTitle: { en: "Carriage return", el: "Αλλαγή γραμμής — καρότσι" },
    words: { en: "words", el: "λέξεις" },
    chars: { en: "characters", el: "γράμματα" }
  };

  var currentLang = detectLang();

  function detectLang() {
    try {
      var saved = localStorage.getItem(LANG_KEY);
      if (saved === "en" || saved === "el") return saved;
    } catch (e) {}
    var nav = (navigator.language || "en").slice(0, 2).toLowerCase();
    return nav === "el" ? "el" : "en";
  }

  function applyStatic() {
    document.documentElement.setAttribute("lang", currentLang);
    document.title = T.title[currentLang];
    var metaDesc = document.querySelector('meta[name="description"]');
    if (metaDesc) metaDesc.setAttribute("content", T.metaDesc[currentLang]);
    var nodes = document.querySelectorAll("[data-en]");
    for (var i = 0; i < nodes.length; i++) {
      nodes[i].textContent = currentLang === "el"
        ? nodes[i].getAttribute("data-el")
        : nodes[i].getAttribute("data-en");
    }
    langEnBtn.classList.toggle("active", currentLang === "en");
    langElBtn.classList.toggle("active", currentLang === "el");
    soundLbl.setAttribute("title", T.soundTitle[currentLang]);
    misalignLbl.setAttribute("title", T.misalignTitle[currentLang]);
    bellBtn.setAttribute("title", T.bellTitle[currentLang]);
    returnBtn.setAttribute("title", T.returnTitle[currentLang]);
    renderCounters(); // ο μετρητής σε λειτουργική γλώσσα
  }

  function setLang(lang) {
    currentLang = lang;
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
    applyStatic();
  }

  langEnBtn.addEventListener("click", function () { setLang("en"); });
  langElBtn.addEventListener("click", function () { setLang("el"); });

  // ===== STATE (μόνο στη μνήμη — ποτέ αποθήκευση) =====
  var lines = [""];
  var curLine = 0;
  var charsPerLine = 46;      // μετράται από το πλάτος στο measure()
  var lineBelled = false;     // flag κουδουνιού ανά γραμμή

  // ===== ΉΧΟΣ (Web Audio, 100% procedural) =====
  var AC = null;

  function ac() {
    if (!AC) {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      AC = new Ctx();
    }
    if (AC.state === "suspended") AC.resume();
    return AC;
  }

  // Θόρυβος πλήκτρου: κοντό filtered noise burst
  function keySound() {
    var ctx = ac();
    if (!ctx) return;
    var dur = 0.06;
    var buf = ctx.createBuffer(1, ctx.sampleRate * dur, ctx.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < d.length; i++) {
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2.5);
    }
    var src = ctx.createBufferSource();
    src.buffer = buf;
    var filt = ctx.createBiquadFilter();
    filt.type = "bandpass";
    filt.frequency.value = 1400 + Math.random() * 900;
    filt.Q.value = 1.2;
    var gain = ctx.createGain();
    gain.gain.value = 0.16;
    src.connect(filt).connect(gain).connect(ctx.destination);
    src.start();
  }

  // Δίσκος/κουδούνι: μεταλλικό ντιν
  function bellSound() {
    var ctx = ac();
    if (!ctx) return;
    var t = ctx.currentTime;
    [1567, 2349, 3136].forEach(function (f, idx) {
      var osc = ctx.createOscillator();
      var g = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(idx === 0 ? 0.22 : 0.07, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 1.2);
      osc.connect(g).connect(ctx.destination);
      osc.start(t);
      osc.stop(t + 1.3);
    });
  }

  // Καρότσι (carriage return): παχύ «ζσσσπ»
  function returnSound() {
    var ctx = ac();
    if (!ctx) return;
    var dur = 0.22;
    var buf = ctx.createBuffer(1, ctx.sampleRate * dur, ctx.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < d.length; i++) {
      var env = i / d.length;
      d[i] = (Math.random() * 2 - 1) * (env < 0.85 ? 0.5 : (1 - env) / 0.15 * 0.5);
    }
    var src = ctx.createBufferSource();
    src.buffer = buf;
    var filt = ctx.createBiquadFilter();
    filt.type = "lowpass";
    filt.frequency.value = 2600;
    var gain = ctx.createGain();
    gain.gain.value = 0.18;
    src.connect(filt).connect(gain).connect(ctx.destination);
    src.start();
    // και το «κλακ» στο τέλος
    setTimeout(keySound, dur * 1000);
  }

  // Διάστημα (space): πιο απαλό
  function spaceSound() {
    var ctx = ac();
    if (!ctx) return;
    var dur = 0.045;
    var buf = ctx.createBuffer(1, ctx.sampleRate * dur, ctx.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < d.length; i++) {
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3);
    }
    var src = ctx.createBufferSource();
    src.buffer = buf;
    var filt = ctx.createBiquadFilter();
    filt.type = "lowpass";
    filt.frequency.value = 900;
    var gain = ctx.createGain();
    gain.gain.value = 0.10;
    src.connect(filt).connect(gain).connect(ctx.destination);
    src.start();
  }

  // Νέο φύλλο: «σέρσιμο» χαρτιού
  function sheetSound() {
    var ctx = ac();
    if (!ctx) return;
    var dur = 0.35;
    var buf = ctx.createBuffer(1, ctx.sampleRate * dur, ctx.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < d.length; i++) {
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 1.5) * 0.6;
    }
    var src = ctx.createBufferSource();
    src.buffer = buf;
    var filt = ctx.createBiquadFilter();
    filt.type = "highpass";
    filt.frequency.value = 1800;
    var gain = ctx.createGain();
    gain.gain.value = 0.12;
    src.connect(filt).connect(gain).connect(ctx.destination);
    src.start();
  }
  
    // ===== MEASURE (init/resize μόνο — όχι ανά keystroke) =====
  function measure() {
    var probe = document.createElement("span");
    probe.style.visibility = "hidden";
    probe.style.whiteSpace = "pre";
    probe.style.font = "inherit";
    probe.textContent = "0000000000";
    paper.appendChild(probe);
    var w10 = probe.getBoundingClientRect().width;
    probe.remove();
    if (w10 > 0) charsPerLine = Math.max(20, Math.floor((paper.clientWidth - 88) / (w10 / 10)));
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function makeLine(i) {
    var div = document.createElement("div");
    div.className = "line";
    if (i === curLine) {
      div.setAttribute("data-cur", "1");
      div.innerHTML = escapeHtml(lines[i]) + '<span class="caret">&nbsp;</span>';
    } else {
      div.innerHTML = escapeHtml(lines[i]) || "&nbsp;";
    }
    return div;
  }

  // ===== RENDER (clean: sync children, ενημέρωση μόνο της τρέχουσας γραμμής) =====
  function render(full) {
    if (full) {
      // Πλήρης επανακατασκευή: αλλαγή δομής (νέα γραμμή, backspace στην αρχή, Esc, resize)
      paper.innerHTML = "";
      for (var i = 0; i < lines.length; i++) {
        var div = makeLine(i);
        if (i === curLine) renderLine = div;
        paper.appendChild(div);
      }
    } else {
      // Ταχεία διαδρομή: μόνο η τρέχουσα γραμμή ξαναγράφεται
      renderLine.innerHTML = escapeHtml(lines[curLine]) + '<span class="caret">&nbsp;</span>';
    }
    renderLine.id = "renderLine";

    renderCounters();

    // Scroll: κράτα την τρέχουσα γραμμή ορατή
    var cur = paper.querySelector('.line[data-cur="1"]');
    if (cur) {
      var offset = cur.offsetTop - 40;
      paperInner.style.top = Math.max(0, offset - 60) * -1 + "px";
    }

    // Κουδούνι πλησίον άκρης γραμμής: 12 γράμματα πριν το τέλος (>=, flag ανά γραμμή)
    if (lines[curLine].length >= charsPerLine - 12 && !lineBelled) {
      lineBelled = true;
      if (soundChk.checked) bellSound();
    }
  }

  function renderCounters() {
    var all = lines.join("\n");
    var wordCount = all.trim() ? all.trim().split(/\s+/).length : 0;
    var charCount = all.replace(/\n/g, "").length;
    keysHint.textContent = wordCount + " " + T.words[currentLang] + " · " + charCount + " " + T.chars[currentLang];
  }

  // ===== INPUT =====
  function typeChar(ch) {
    if (lines[curLine].length >= charsPerLine) {
      newLine();
    } else {
      lineBelled = false;
    }

    // «Κολλημένα πλήκτρα»: 4% — παροδική οριζόντια μετατόπιση του χαρτιού
    if (misalignChk.checked && Math.random() < 0.04) {
      paper.classList.remove("stuck");
      void paper.offsetWidth;
      paper.classList.add("stuck");
    }

    lines[curLine] += ch;

    render(false);
    paper.classList.remove("keyed");
    void paper.offsetWidth;
    paper.classList.add("keyed");

    if (soundChk.checked) {
      if (ch === " ") spaceSound();
      else keySound();
    }
  }

  function newLine() {
    lines.push("");
    curLine++;
    lineBelled = false;
    render(true);
    if (soundChk.checked) returnSound();
  }

  function backspace() {
    if (lines[curLine].length > 0) {
      lines[curLine] = lines[curLine].slice(0, -1);
      lineBelled = false;
    } else if (curLine > 0) {
      lines.pop();
      curLine--;
    } else {
      return;
    }
    render(true);
    if (soundChk.checked) keySound(); // «ξε-πάτημα» — μικρό κλικ
  }

  function newSheet() {
    lines = [""];
    curLine = 0;
    lineBelled = false;
    render(true);
    if (soundChk.checked) sheetSound();
  }

  // ===== KEYBOARD (desktop) =====
  document.addEventListener("keydown", function (e) {
    // Μηδέν παρεμβολή σε πραγματικά controls (και κουμπιά — το Space κάνει κλικ εκεί)
    var tag = (e.target && e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "select" || tag === "textarea" || tag === "button") return;

    if (e.key === "Escape") { newSheet(); return; }
    if (e.key === "Enter") { e.preventDefault(); newLine(); return; }
    if (e.key === "Backspace") { e.preventDefault(); backspace(); return; }

    // Εκτυπώσιμοι χαρακτήρες μόνο
    if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
      e.preventDefault();
      typeChar(e.key);
    }
  });

  // ===== MOBILE: κρυφό textarea για εγγενές πληκτρολόγιο =====
  var bridge = document.createElement("textarea");
  bridge.setAttribute("aria-hidden", "true");
  bridge.style.position = "fixed";
  bridge.style.opacity = "0";
  bridge.style.pointerEvents = "none";
  bridge.style.left = "-9999px";
  document.body.appendChild(bridge);

  paper.addEventListener("click", function () {
    bridge.focus({ preventScroll: true });
  });

  bridge.addEventListener("input", function () {
    var v = bridge.value;
    if (v) {
      for (var i = 0; i < v.length; i++) typeChar(v[i]);
      bridge.value = "";
    }
  });

  bridge.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); newLine(); }
    else if (e.key === "Backspace") { e.preventDefault(); backspace(); }
  });

  // ===== BUTTONS =====
  bellBtn.addEventListener("click", function () {
    if (soundChk.checked) bellSound();
  });

  returnBtn.addEventListener("click", function () {
    newLine();
  });

  clearBtn.addEventListener("click", function () {
    newSheet();
  });

  // Πρώτο user gesture ενεργοποιεί το AudioContext
  document.addEventListener("pointerdown", function once() {
    ac();
    document.removeEventListener("pointerdown", once);
  }, { once: true });

  window.addEventListener("resize", function () {
    measure();
    render(true);
  });

  // ===== INIT =====
  applyStatic();
  measure();
  render(true);

  // ===== ΕΓΚΑΤΑΣΤΑΣΗ (PWA) =====
  var deferredPrompt = null;

  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.hidden = false;
  });

  installBtn.addEventListener("click", function () {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt = null;
    installBtn.hidden = true;
  });

  window.addEventListener("appinstalled", function () {
    deferredPrompt = null;
    installBtn.hidden = true;
  });

  // ===== SERVICE WORKER (offline — κοινός SW της σουίτας στη ρίζα) =====
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("../sw.js").catch(function (err) {
        console.warn("SW registration failed:", err);
      });
    });
  }

})();
</script>

</body>
</html>
