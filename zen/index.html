<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Micro-Zen — Soffitta</title>
<meta name="description" content="A breathing circle and a minute of quiet. 4-4-4 and 4-7-8 patterns, sessions of 1–5 minutes. Free, open source, no cookies, no tracking.">
<link rel="canonical" href="https://soffitta.site/zen/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://soffitta.site/zen/">
<meta property="og:title" content="Micro-Zen — Soffitta">
<meta property="og:description" content="A breathing circle and a minute of quiet — 4-4-4, 4-7-8, coherent breathing.">

<link rel="manifest" href="../manifest.webmanifest">
<style>
  :root {
    --bg: #0c1410;
    --surface: #12201a;
    --surface-2: #182a21;
    --border: #24402f;
    --text: #e3f2e7;
    --text-muted: #8fae9c;
    --accent: #a5d6a7;
    --accent-soft: rgba(165, 214, 167, 0.12);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background: radial-gradient(ellipse at 50% 110%, #16301f 0%, var(--bg) 60%);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    padding: 16px 24px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    position: relative;
    z-index: 2;
  }

  header h1 { font-size: 1.2rem; font-weight: 800; }
  header h1 span { color: var(--accent); }
  header .session { font-size: 0.8rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }

  /* ===== ΕΡΓΑΛΕΙΑ (γλώσσα + εγκατάσταση) ===== */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .lang-switch {
    display: flex;
    border: 1px solid var(--border);
    border-radius: 999px;
    overflow: hidden;
  }

  .lang-switch button {
    background: none;
    border: none;
    padding: 6px 12px;
    color: var(--text-muted);
    cursor: pointer;
    font: 700 0.75rem "Segoe UI", system-ui, sans-serif;
    letter-spacing: 0.04em;
  }

  .lang-switch button.active {
    background: var(--surface-2);
    color: var(--text);
  }

  #installBtn {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 999px;
    padding: 6px 14px;
    cursor: pointer;
    font: 700 0.75rem "Segoe UI", system-ui, sans-serif;
  }
  #installBtn:hover { border-color: var(--accent); }

  main {
    flex: 1;
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 30px;
    padding: 20px;
    overflow-y: auto;
  }

  /* ===== ΚΥΚΛΟΣ ΑΝΑΠΝΟΗΣ ===== */
  .breath-stage {
    position: relative;
    width: min(70vw, 300px);
    height: min(70vw, 300px);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .ring {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
  }

  .ring.outer {
    width: 100%;
    height: 100%;
    border: 1px solid var(--border);
  }

  .ring.mid {
    width: 74%;
    height: 74%;
    border: 1px dashed var(--border);
    opacity: 0.6;
  }

  .core {
    position: relative;
    width: 46%;
    height: 46%;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 32%, #cde9cf, var(--accent) 60%, #6aab6e);
    box-shadow: 0 0 60px rgba(165, 214, 167, 0.45);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s ease-out;
    will-change: transform;
  }

  .core .phase {
    font-size: 0.72rem;
    font-weight: 800;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #17301a;
    text-align: center;
  }

  .core .count {
    font-size: 2.2rem;
    font-weight: 800;
    color: #122b14;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    margin-top: 2px;
  }

  /* Ήπια παλμική εξωτερική λάμψη */
  .ring.pulse {
    width: 46%;
    height: 46%;
    background: rgba(165, 214, 167, 0.25);
    transition: transform 0.2s ease-out, background 1s ease;
  }

  .tap-hint {
    font-size: 0.8rem;
    color: var(--text-muted);
    letter-spacing: 0.04em;
  }

  /* ===== ΡΥΘΜΙΣΕΙΣ ===== */
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    max-width: 560px;
  }

  .pattern {
    font-family: inherit;
    font-size: 0.82rem;
    font-weight: 700;
    border-radius: 999px;
    padding: 8px 18px;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .pattern:hover { border-color: var(--accent); }
  .pattern.active {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
  }

  .pattern small {
    display: block;
    font-size: 0.62rem;
    font-weight: 400;
    color: var(--text-muted);
    letter-spacing: 0.03em;
  }
  .pattern.active small { color: var(--accent); opacity: 0.8; }

  /* Διάρκεια */
  .duration {
    display: flex;
    gap: 8px;
    align-items: center;
    color: var(--text-muted);
    font-size: 0.78rem;
  }

  .duration button {
    font-family: inherit;
    font-size: 0.78rem;
    font-weight: 700;
    border-radius: 8px;
    padding: 6px 12px;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
  }

  .duration button.active {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
  }

  .duration button:hover { border-color: var(--accent); }

  footer {
    position: relative;
    z-index: 2;
    padding: 14px 24px;
    border-top: 1px solid var(--border);
    font-size: 0.76rem;
    color: var(--text-muted);
    text-align: center;
    line-height: 1.7;
  }
  footer a { color: var(--text); text-decoration: none; border-bottom: 1px dotted var(--text-muted); }
  footer a:hover { border-bottom-style: solid; }

  .kbd {
    display: inline-block;
    padding: 1px 6px;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 0.68rem;
    font-family: ui-monospace, monospace;
  }

  /* Παλλόμενα σωματίδια σκόνης στο παρασκήνιο */
  .dust {
    position: absolute;
    width: 3px; height: 3px;
    border-radius: 50%;
    background: rgba(165, 214, 167, 0.3);
    pointer-events: none;
    animation: dustFloat linear infinite;
  }
  @keyframes dustFloat {
    0% { transform: translateY(0) translateX(0); opacity: 0; }
    20% { opacity: 0.8; }
    80% { opacity: 0.5; }
    100% { transform: translateY(-90vh) translateX(20px); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .dust { display: none; }
  }
</style>
</head>

<body>

<header>
  <div>
    <h1>🌬️ Micro-<span>Zen</span></h1>
  </div>
  <div class="toolbar">
    <span class="session" id="sessionEl">0 breaths · 00:00</span>
    <button id="installBtn" hidden data-en="⬇ Install app" data-el="⬇ Εγκατάσταση">⬇ Install app</button>
    <div class="lang-switch" role="group" aria-label="Language">
      <button id="langEn" class="active">EN</button>
      <button id="langEl">ΕΛ</button>
    </div>
  </div>
</header>

<main id="main">

  <div class="breath-stage" id="breathStage" role="button" tabindex="0"
       data-aria-en="Start or pause breathing" data-aria-el="Έναρξη ή παύση αναπνοής"
       aria-label="Start or pause breathing">
    <div class="ring outer"></div>
    <div class="ring mid"></div>
    <div class="ring pulse" id="pulseRing"></div>
    <div class="core" id="coreCircle">
      <span class="phase" id="phaseEl">Ready</span>
      <span class="count" id="countEl">●</span>
    </div>
  </div>

  <p class="tap-hint" data-en="Tap the circle to begin" data-el="Άγγιξε τον κύκλο για έναρξη">Tap the circle to begin</p>

  <div class="controls">
    <button class="pattern active" data-pattern="444">
      <span data-en="Box" data-el="Τετράγωνο">Box</span>
      <small>4–4–4 · <span data-en="balance" data-el="ισορροπία">balance</span></small>
    </button>
    <button class="pattern" data-pattern="478">
      <span data-en="Relax" data-el="Χαλάρωση">Relax</span>
      <small>4–7–8 · <span data-en="sleep" data-el="ύπνος">sleep</span></small>
    </button>
    <button class="pattern" data-pattern="coherent">
      <span data-en="Coherent" data-el="Συνεκτικό">Coherent</span>
      <small>5.5 <span data-en="continuous" data-el="συνεχόμενες">continuous</span></small>
    </button>
  </div>

  <div class="duration">
    <span data-en="Duration:" data-el="Διάρκεια:">Duration:</span>
    <button data-min="1">1′</button>
    <button data-min="3" class="active">3′</button>
    <button data-min="5">5′</button>
    <button data-min="0" data-en="Free" data-el="Ελεύθερο">Free</button>
  </div>

</main>

<footer>
  <span data-en="Designed by" data-el="Σχεδιασμένο από τον">Designed by</span>
  <a href="https://koulaxizis.gr" target="_blank" rel="noopener">Christos Koulaxizis</a> ·
  <a href="../" data-en="All apps" data-el="Όλα τα apps">All apps</a><br>
  <span data-en="No cookies · No tracking · Open source" data-el="Χωρίς cookies · Χωρίς tracking · Ανοιχτού κώδικα">No cookies · No tracking · Open source</span>
  · <span class="kbd">Space</span>
  <span data-en="start/pause" data-el="έναρξη/παύση">start/pause</span>
</footer>

<script>
"use strict";
(function () {

  // ===== DOM =====
  var stage = document.getElementById("breathStage");
  var core = document.getElementById("coreCircle");
  var pulse = document.getElementById("pulseRing");
  var phaseEl = document.getElementById("phaseEl");
  var countEl = document.getElementById("countEl");
  var sessionEl = document.getElementById("sessionEl");
  var langEnBtn = document.getElementById("langEn");
  var langElBtn = document.getElementById("langEl");
  var installBtn = document.getElementById("installBtn");

  // ===== i18n (κοινό μοτίβο σε όλη τη σουίτα) =====
  var LANG_KEY = "soffitta.lang";

  var T = {
    title: {
      en: "Micro-Zen — Soffitta",
      el: "Micro-Zen — Soffitta"
    },
    metaDesc: {
      en: "A breathing circle and a minute of quiet. 4-4-4 and 4-7-8 patterns, sessions of 1–5 minutes. Free, open source, no cookies, no tracking.",
      el: "Ένας κύκλος αναπνοής και ένα λεπτό ησυχίας. Διάταξεις 4-4-4 και 4-7-8, συνεδρίες 1–5 λεπτών. Χωρίς cookies, χωρίς tracking."
    },
    breaths: { en: "breaths", el: "αναπνοές" },
    ready: { en: "Ready", el: "Έτοιμο" },
    paused: { en: "Paused", el: "Παύση" },
    wellDone: { en: "Well done", el: "Καλά τα πήγες" },
    inhale: { en: "Inhale", el: "Εισπνοή" },
    hold: { en: "Hold", el: "Κράτα" },
    exhale: { en: "Exhale", el: "Εκπνοή" },
    ariaStage: { en: "Start or pause breathing", el: "Έναρξη ή παύση αναπνοής" }
  };

  // ===== ΠΡΟΓΡΑΜΜΑΤΑ ΑΝΑΠΝΟΗΣ =====
  var PATTERNS = {
    "444": { phases: [
      { key: "in",   secs: 4 },
      { key: "hold", secs: 4 },
      { key: "out",  secs: 4 }
    ]},
    "478": { phases: [
      { key: "in",   secs: 4 },
      { key: "hold", secs: 7 },
      { key: "out",  secs: 8 }
    ]},
    "coherent": { phases: [
      { key: "in",  secs: 5.5 },
      { key: "out", secs: 5.5 }
    ]}
  };

  // Φάσεις: label από το T ανά ενεργή γλώσσα
  function phaseLabel(key) {
    if (key === "in") return T.inhale[currentLang];
    if (key === "hold") return T.hold[currentLang];
    return T.exhale[currentLang];
  }

  // ===== STATE =====
  var running = false;
  var paused = false;        // bug #2: καθαρή flag, όχι string compare
  var finished = false;      // «Καλά τα πήγες» — ξεκινάμε νέα συνεδρία μετά
  var phaseIdx = 0;
  var phaseElapsed = 0;      // δευτ. στην τρέχουσα φάση
  var breathCount = 0;
  var totalSeconds = 0;
  var lastTs = 0;

  var patternKey = "444";
  var targetMinutes = 3; // 0 = ελεύθερο

  // Scale του κύκλου ανά φάση
  var SCALE = { in: 1.6, hold: 1.6, out: 1 };

  // ===== i18n APPLY =====
  var currentLang = detectLang();

  function detectLang() {
    try {
      var saved = localStorage.getItem(LANG_KEY);
      if (saved === "en" || saved === "el") return saved;
    } catch (e) {}
    var nav = (navigator.language || "en").slice(0, 2).toLowerCase();
    return nav === "el" ? "el" : "en";
  }

  function applyStatic() {
    document.documentElement.setAttribute("lang", currentLang);
    document.title = T.title[currentLang];
    var metaDesc = document.querySelector('meta[name="description"]');
    if (metaDesc) metaDesc.setAttribute("content", T.metaDesc[currentLang]);
    var nodes = document.querySelectorAll("[data-en]");
    for (var i = 0; i < nodes.length; i++) {
      nodes[i].textContent = currentLang === "el"
        ? nodes[i].getAttribute("data-el")
        : nodes[i].getAttribute("data-en");
    }
    langEnBtn.classList.toggle("active", currentLang === "en");
    langElBtn.classList.toggle("active", currentLang === "el");
    stage.setAttribute("aria-label", T.ariaStage[currentLang]);

    // Τρέχουσα κατάσταση στην ενεργή γλώσσα (χωρίς να πειράξει το engine)
    if (finished) phaseEl.textContent = T.wellDone[currentLang];
    else if (!running) phaseEl.textContent = T.ready[currentLang];
    else if (paused) phaseEl.textContent = T.paused[currentLang];
    else phaseEl.textContent = phaseLabel(currentPhase().key);

    updateSessionText();
  }

  function setLang(lang) {
    currentLang = lang;
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
    applyStatic();
  }

  langEnBtn.addEventListener("click", function () { setLang("en"); });
  langElBtn.addEventListener("click", function () { setLang("el"); });

  // ===== ΚΥΚΛΟΣ =====
  function setScale(s) {
    core.style.transform = "scale(" + s + ")";
    pulse.style.transform = "scale(" + (s * 1.08) + ")";
  }

  function currentPhase() {
    return PATTERNS[patternKey].phases[phaseIdx];
  }

  function nextPhase() {
    var p = currentPhase();
    if (p.key === "out") {
      breathCount++;
    }
    phaseIdx = (phaseIdx + 1) % PATTERNS[patternKey].phases.length;
    phaseElapsed = 0;
    var np = currentPhase();
    phaseEl.textContent = phaseLabel(np.key);
    applyPhaseScale(np.key);
    if (np.secs % 1 !== 0) {
      countEl.textContent = ""; // δεκαδικά — μόνο ο κύκλος μετράει
    }
  }

  function applyPhaseScale(key) {
    if (key === "in" || key === "out") {
      var dur = currentPhase().secs;
      core.style.transition = "transform " + dur + "s ease-in-out";
      pulse.style.transition = "transform " + dur + "s ease-in-out";
      setScale(key === "in" ? SCALE.in : SCALE.out);
    }
    // hold: μένει στη θέση του (transition ήδη ολοκληρωμένο)
  }

  function tick(ts) {
    if (!running) return;
    if (!lastTs) lastTs = ts;
    var dt = Math.min(0.1, (ts - lastTs) / 1000);
    lastTs = ts;

    phaseElapsed += dt;
    totalSeconds += dt;

    var p = currentPhase();
    if (p.secs % 1 === 0) {
      countEl.textContent = String(Math.max(0, Math.ceil(p.secs - phaseElapsed)));
    }

    if (phaseElapsed >= p.secs) {
      nextPhase();
    }

    // Έλεγχος ορίου διάρκειας
    if (targetMinutes > 0 && totalSeconds >= targetMinutes * 60) {
      finishSession();
      return;
    }

    updateSessionText();
    requestAnimationFrame(tick);
  }

  function updateSessionText() {
    var mm = Math.floor(totalSeconds / 60);
    var ss = Math.floor(totalSeconds % 60);
    sessionEl.textContent = breathCount + " " + T.breaths[currentLang] + " · " +
      ("0" + mm).slice(-2) + ":" + ("0" + ss).slice(-2);
  }

  function startSession() {
    running = true;
    paused = false;
    finished = false;
    phaseIdx = 0;
    phaseElapsed = 0;
    phaseEl.textContent = phaseLabel(currentPhase().key);
    if (currentPhase().secs % 1 === 0) {
      countEl.textContent = String(currentPhase().secs);
    }
    applyPhaseScale(currentPhase().key);
    lastTs = 0;
    requestAnimationFrame(tick);
  }

  function pauseSession() {
    running = false;
    paused = true;
    phaseEl.textContent = T.paused[currentLang];
  }

  function resumeSession() {
    running = true;
    paused = false;
    lastTs = 0;
    phaseEl.textContent = phaseLabel(currentPhase().key);
    // Το transition ξαναπιάνει από την τρέχουσα κλίμακα —
    // δεν ξανατρέχουμε applyPhaseScale ώστε να μη «χτενίζει» η αρχή της φάσης
    requestAnimationFrame(tick);
  }

  function finishSession() {
    running = false;
    finished = true;
    phaseEl.textContent = T.wellDone[currentLang];
    countEl.textContent = "🙏";
    core.style.transition = "transform 0.6s ease-out";
    pulse.style.transition = "transform 0.6s ease-out";
    setScale(1);
  }

  // ===== ΕΝΑΡΞΗ / ΠΑΥΣΗ (καθαρό state machine — bug #2) =====
  function toggle() {
    if (!running) {
      if (paused) {
        resumeSession();          // συνέχεια από εκεί που σταμάτησε
      } else if (finished || totalSeconds > 0) {
        totalSeconds = 0;         // νέα συνεδρία
        breathCount = 0;
        finished = false;
        updateSessionText();
        startSession();
      } else {
        startSession();           // πρώτη έναρξη
      }
    } else {
      pauseSession();
    }
  }

  stage.addEventListener("click", toggle);

  stage.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      toggle();
    }
  });

  // ===== ΠΡΟΓΡΑΜΜΑΤΑ =====
  var patternBtns = document.querySelectorAll(".pattern");
  patternBtns.forEach(function (btn) {
    btn.addEventListener("click", function () {
      var key = btn.getAttribute("data-pattern").trim();
      if (!PATTERNS[key]) return;
      patternKey = key;
      patternBtns.forEach(function (b) { b.classList.remove("active"); });
      btn.classList.add("active");
      // Επανεκκίνηση με νέο ρυθμό
      running = false;
      paused = false;
      finished = false;
      totalSeconds = 0;
      breathCount = 0;
      phaseIdx = 0;
      phaseElapsed = 0;
      setScale(1);
      phaseEl.textContent = T.ready[currentLang];
      countEl.textContent = "●";
      updateSessionText();
    });
  });

  // ===== ΔΙΑΡΚΕΙΑ =====
  var durationBtns = document.querySelectorAll(".duration button");
  durationBtns.forEach(function (btn) {
    btn.addEventListener("click", function () {
      targetMinutes = parseInt(btn.getAttribute("data-min"), 10) || 0;
      durationBtns.forEach(function (b) { b.classList.remove("active"); });
      btn.classList.add("active");
    });
  });

  // ===== ΠΛΗΚΤΡΟΛΟΓΙΟ (bug #1: το stage έχει το δικό του handler) =====
  document.addEventListener("keydown", function (e) {
    if (e.code !== "Space") return;
    var tag = (e.target && e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "select" || tag === "textarea" || tag === "button") return;
    if (e.target === stage) return; // το stage το χειρίζεται μόνο του (Enter/Space)
    e.preventDefault();
    toggle();
  });

  // ===== ΣΚΟΝΗ (ατμόσφαιρα) =====
  (function seedDust() {
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var main = document.getElementById("main");
    for (var i = 0; i < 14; i++) {
      var d = document.createElement("div");
      d.className = "dust";
      d.style.left = (5 + Math.random() * 90) + "%";
      d.style.top = (60 + Math.random() * 40) + "%";
      d.style.animationDuration = (14 + Math.random() * 18) + "s";
      d.style.animationDelay = (-Math.random() * 20) + "s";
      main.appendChild(d);
    }
  })();

  // ===== ΕΓΚΑΤΑΣΤΑΣΗ (PWA) =====
  var deferredPrompt = null;

  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.hidden = false;
  });

  installBtn.addEventListener("click", function () {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt = null;
    installBtn.hidden = true;
  });

  window.addEventListener("appinstalled", function () {
    deferredPrompt = null;
    installBtn.hidden = true;
  });

  // ===== SERVICE WORKER (offline — κοινός SW της σουίτας στη ρίζα) =====
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("../sw.js").catch(function (err) {
        console.warn("SW registration failed:", err);
      });
    });
  }

  // ===== INIT =====
  applyStatic(); // i18n + κατάσταση «Ready» στην ενεργή γλώσσα + session text

})();
</script>

</body>
</html>
