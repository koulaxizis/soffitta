<style>
  :root {
    --bg: #151018;
    --surface: #1e1720;
    --surface-2: #271c2b;
    --border: #3a2b3f;
    --text: #f2e9f2;
    --text-muted: #a897ad;
    --accent: #ff6ea9;
    --accent-soft: rgba(255, 110, 169, 0.15);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  header h1 { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.01em; }
  header h1 span { color: var(--accent); }
  header .hint { font-size: 0.8rem; color: var(--text-muted); }

  /* ===== ΕΡΓΑΛΕΙΑ (γλώσσα + εγκατάσταση) ===== */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .lang-switch {
    display: flex;
    border: 1px solid var(--border);
    border-radius: 999px;
    overflow: hidden;
  }

  .lang-switch button {
    background: none;
    border: none;
    padding: 6px 12px;
    color: var(--text-muted);
    cursor: pointer;
    font: 700 0.75rem "Segoe UI", system-ui, sans-serif;
    letter-spacing: 0.04em;
  }

  .lang-switch button.active {
    background: var(--surface-2);
    color: var(--text);
  }

  #installBtn {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 999px;
    padding: 6px 14px;
    cursor: pointer;
    font: 700 0.75rem "Segoe UI", system-ui, sans-serif;
  }
  #installBtn:hover { border-color: var(--accent); }

  .layout {
    display: grid;
    grid-template-columns: 300px 1fr;
    gap: 0;
    flex: 1;
  }

  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; }
  }

  /* ===== CONTROLS ===== */
  aside {
    border-right: 1px solid var(--border);
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    overflow-y: auto;
  }

  @media (max-width: 820px) { aside { border-right: none; border-bottom: 1px solid var(--border); } }

  .group { display: flex; flex-direction: column; gap: 8px; }

  .group label {
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    font-weight: 700;
  }

  select, input[type="text"], input[type="number"] {
    width: 100%;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 11px;
    font-size: 0.9rem;
    font-family: inherit;
    outline: none;
  }

  select:focus, input:focus { border-color: var(--accent); }

  .seed-row { display: flex; gap: 8px; }
  .seed-row input[type="text"] { flex: 1; }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 6px;
    border-radius: 3px;
    background: var(--surface-2);
    outline: none;
    border: 1px solid var(--border);
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }

  input[type="range"]::-moz-range-thumb {
    width: 16px; height: 16px;
    border: none;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }

  .range-val { font-size: 0.78rem; color: var(--accent); font-variant-numeric: tabular-nums; }

  .check-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.88rem;
    cursor: pointer;
    user-select: none;
  }

  .check-row input { accent-color: var(--accent); width: 16px; height: 16px; cursor: pointer; }

  .custom-dims { display: none; gap: 8px; }
  .custom-dims.visible { display: flex; }
  .custom-dims input { width: 100%; }

  button {
    font-family: inherit;
    font-size: 0.88rem;
    font-weight: 700;
    border-radius: 8px;
    padding: 10px 14px;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
  }

  button:hover { background: var(--surface-2); border-color: var(--accent); }
  button:active { transform: translateY(1px); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #1a0b12; }
  button.primary:hover { filter: brightness(1.08); background: var(--accent); }

  .btn-row { display: flex; gap: 8px; }
  .btn-row button { flex: 1; }

  footer {
    margin-top: auto;
    padding: 18px 24px;
    border-top: 1px solid var(--border);
    font-size: 0.78rem;
    color: var(--text-muted);
    text-align: center;
    line-height: 1.7;
  }

  footer a { color: var(--text); text-decoration: none; border-bottom: 1px dotted var(--text-muted); }
  footer a:hover { border-bottom-style: solid; }

  /* ===== PREVIEW ===== */
  main {
    padding: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 50vh;
  }

  .canvas-frame {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.45);
    max-width: 100%;
  }

  #art {
    display: block;
    max-width: 100%;
    max-height: 68vh;
    width: auto;
    height: auto;
    border-radius: 6px;
    background: #000;
  }

  .status {
    text-align: center;
    margin-top: 10px;
    font-size: 0.76rem;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }
</style>

<body>

        <option value="3840x2160" data-en="4K 3840 × 2160" data-el="4K 3840 × 2160">4K 3840 × 2160</option>
        <option value="2048x2048" data-en="Square 2048 × 2048" data-el="Τετράγωνο 2048 × 2048">Square 2048 × 2048</option>

<script>
"use strict";
(function () {

  var TAU = Math.PI * 2;

  // ===== ΣΤΑΘΕΡΕΣ =====
  var PALETTES = [
    { name_en: "Sunset", name_el: "Ηλιοβασίλεμα", bg: "#2b1055", colors: ["#ffd166", "#ff8c42", "#ff6ea9", "#c14bff", "#7b5cff"] },
    { name_en: "Deep Sea", name_el: "Βαθιά Θάλασσα", bg: "#031c33", colors: ["#caf0f8", "#48cae4", "#00b4d8", "#0077b6", "#023e8a"] },
    { name_en: "Retro 80s", name_el: "Ρετρό 80s", bg: "#12071f", colors: ["#ff2975", "#ff8c42", "#ffd93d", "#33e1ed", "#8338ec"] },
    { name_en: "Pastel Dream", name_el: "Παστέλ Όνειρο", bg: "#f7f2ea", colors: ["#ffb3c6", "#bde0fe", "#a2d2ff", "#cdb4db", "#ffc8dd"] },
    { name_en: "Olympus", name_el: "Όλυμπος", bg: "#0b1f16", colors: ["#d8f3dc", "#95d5b2", "#52b788", "#2d6a4f", "#74c69d"] },
    { name_en: "Monochrome", name_el: "Μονόχρωμο", bg: "#0d0d11", colors: ["#f5f5fa", "#b8b8c6", "#7a7a8a", "#4a4a56"] }
  ];

  var SEED_WORDS = [
    "asteri", "kyma", "xazos", "selini", "elaia", "thalassa", "anemos",
    "foti", "gyali", "rodo", "dendro", "oneiro", "nikti", "ora", "portokali"
  ];

  // ===== DOM =====
  var canvas = document.getElementById("art");
  var ctx = canvas.getContext("2d");
  var seedInput = document.getElementById("seedInput");
  var seedBtn = document.getElementById("seedBtn");
  var styleSel = document.getElementById("styleSel");
  var paletteSel = document.getElementById("paletteSel");
  var densityRange = document.getElementById("densityRange");
  var chaosRange = document.getElementById("chaosRange");
  var densityVal = document.getElementById("densityVal");
  var chaosVal = document.getElementById("chaosVal");
  var grainChk = document.getElementById("grainChk");
  var resSel = document.getElementById("resSel");
  var customDims = document.getElementById("customDims");
  var customW = document.getElementById("customW");
  var customH = document.getElementById("customH");
  var regenBtn = document.getElementById("regenBtn");
  var pngBtn = document.getElementById("pngBtn");
  var jpgBtn = document.getElementById("jpgBtn");
  var statusLine = document.getElementById("statusLine");
  var langEnBtn = document.getElementById("langEn");
  var langElBtn = document.getElementById("langEl");
  var installBtn = document.getElementById("installBtn");

  // ===== i18n (κοινό μοτίβο σε όλη τη σουίτα) =====
  var LANG_KEY = "soffitta.lang";

  var T = {
    title: {
      en: "Wallpaper Generator — Soffitta",
      el: "Γεννήτρια Ταπετσαριών — Soffitta"
    },
    metaDesc: {
      en: "Generative art wallpapers with seeds — 5 styles, 6 palettes, exports up to 8192px. Free, open source, no cookies, no tracking.",
      el: "Δημιούργησε wallpaper με generative art: seeds, παλέτες, στυλ και εξαγωγή σε κάθε ανάλυση. Χωρίς cookies, χωρίς tracking."
    },
    randomSeed: { en: "Random seed", el: "Τυχαίο seed" },
    wPlaceholder: { en: "Width", el: "Πλάτος" },
    hPlaceholder: { el: "Ύψος", en: "Height" },
    downloaded: { en: "Saved wallpaper ✓", el: "Το wallpaper αποθηκεύτηκε ✓" },
    savedAs: { en: "· seed: ", el: "· seed: " }
  };

  var currentLang = detectLang();

  function detectLang() {
    try {
      var saved = localStorage.getItem(LANG_KEY);
      if (saved === "en" || saved === "el") return saved;
    } catch (e) {}
    var nav = (navigator.language || "en").slice(0, 2).toLowerCase();
    return nav === "el" ? "el" : "en";
  }

  function applyStatic() {
    document.documentElement.setAttribute("lang", currentLang);
    document.title = T.title[currentLang];
    var metaDesc = document.querySelector('meta[name="description"]');
    if (metaDesc) metaDesc.setAttribute("content", T.metaDesc[currentLang]);
    var nodes = document.querySelectorAll("[data-en]");
    for (var i = 0; i < nodes.length; i++) {
      nodes[i].textContent = currentLang === "el"
        ? nodes[i].getAttribute("data-el")
        : nodes[i].getAttribute("data-en");
    }
    langEnBtn.classList.toggle("active", currentLang === "en");
    langElBtn.classList.toggle("active", currentLang === "el");
    seedBtn.setAttribute("title", T.randomSeed[currentLang]);
    customW.setAttribute("placeholder", T.wPlaceholder[currentLang]);
    customH.setAttribute("placeholder", T.hPlaceholder[currentLang]);
    fillPaletteOptions(); // τα ονόματα παλετών είναι JS-generated
  }

  function fillPaletteOptions() {
    // Διατηρούμε την επιλογή κατά τη διαχωγή
    var sel = paletteSel.selectedIndex;
    paletteSel.innerHTML = "";
    for (var i = 0; i < PALETTES.length; i++) {
      var opt = document.createElement("option");
      opt.value = String(i);
      opt.textContent = currentLang === "el" ? PALETTES[i].name_el : PALETTES[i].name_en;
      paletteSel.appendChild(opt);
    }
    paletteSel.selectedIndex = Math.max(0, Math.min(sel, PALETTES.length - 1));
  }

  function setLang(lang) {
    currentLang = lang;
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
    applyStatic();
    renderStatus(); // το status line ξαναγράφεται στην ενεργή γλώσσα
  }

  langEnBtn.addEventListener("click", function () { setLang("en"); });
  langElBtn.addEventListener("click", function () { setLang("el"); });

  // ===== STATE =====
  var state = {
    seed: "",
    style: "waves",
    palette: 0,
    density: 0.5,
    chaos: 0.5,
    grain: true,
    w: 1920,
    h: 1080
  };

  var pendingRender = false;

  // ===== RNG (deterministic από seed) =====
  function xmur3(str) {
    var h = 1779033703 ^ str.length;
    for (var i = 0; i < str.length; i++) {
      h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
      h = (h << 13) | (h >>> 19);
    }
    return function () {
      h = Math.imul(h ^ (h >>> 16), 2246822507);
      h = Math.imul(h ^ (h >>> 13), 3266489909);
      return (h ^= h >>> 16) >>> 0;
    };
  }

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Value noise 0..1, πλέγμα μεγέθους g (τυλιγμένο)
  function makeNoise(rng, g) {
    var grid = [];
    var i, j;
    for (j = 0; j <= g; j++) {
      var row = [];
      for (i = 0; i <= g; i++) row.push(rng());
      grid.push(row);
    }
    function smooth(t) { return t * t * (3 - 2 * t); }
    function at(x, y) {
      x = ((x % g) + g) % g;
      y = ((y % g) + g) % g;
      return grid[y][x];
    }
    return function (x, y) {
      var xi = Math.floor(x), yi = Math.floor(y);
      var u = smooth(x - xi), v = smooth(y - yi);
      var a = at(xi, yi), b = at(xi + 1, yi);
      var c = at(xi, yi + 1), d = at(xi + 1, yi + 1);
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    };
  }

  // ===== ΒΟΗΘΗΤΙΚΑ =====
  function rgba(hex, a) {
    var r = parseInt(hex.slice(1, 3), 16);
    var g = parseInt(hex.slice(3, 5), 16);
    var b = parseInt(hex.slice(5, 7), 16);
    return "rgba(" + r + "," + g + "," + b + "," + a + ")";
  }

  function fillBg(pal) {
    ctx.fillStyle = pal.bg;
    ctx.fillRect(0, 0, state.w, state.h);
  }
  
    // ===== ΣΤΥΛ =====

  // 1) Κύματα — φυλλοειδή βουνά με ήλιο
  function drawWaves(rng, pal, o) {
    fillBg(pal);

    var w = state.w, h = state.h;
    var minDim = Math.min(w, h);

    // Ήλιος
    var sunX = w * (0.2 + rng() * 0.6);
    var sunY = h * (0.14 + rng() * 0.1);
    var sunR = minDim * (0.035 + rng() * 0.05);
    var glow = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, sunR * 4);
    glow.addColorStop(0, rgba("#ffffff", 0.9));
    glow.addColorStop(0.25, rgba("#ffffff", 0.35));
    glow.addColorStop(1, rgba("#ffffff", 0));
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = rgba("#ffffff", 0.85);
    ctx.beginPath();
    ctx.arc(sunX, sunY, sunR, 0, TAU);
    ctx.fill();

    // Στρώματα κυμάτων (πίσω → μπροστά)
    var layers = Math.round(4 + o.density * 9);
    var cols = pal.colors;
    var i, L;
    for (L = 0; L < layers; L++) {
      var t = layers === 1 ? 0 : L / (layers - 1);
      var yBase = h * (0.32 + 0.62 * t);
      var amp = h * (0.03 + o.chaos * 0.10) * (0.5 + rng() * 0.7);
      var f1 = 1 + rng() * 2.5;
      var f2 = 2 + rng() * 4;
      var p1 = rng() * TAU;
      var p2 = rng() * TAU;
      var step = Math.max(4, w / 260);

      ctx.beginPath();
      ctx.moveTo(0, h);
      for (var x = 0; x <= w; x += step) {
        var u = x / w;
        var y = yBase
          + Math.sin(u * f1 * TAU + p1) * amp
          + Math.sin(u * f2 * TAU + p2) * amp * 0.35;
        ctx.lineTo(x, y);
      }
      ctx.lineTo(w, h);
      ctx.closePath();
      ctx.fillStyle = cols[L % cols.length];
      ctx.fill();
    }
  }

  // 2) Πεδίο ροής — σωληνοειδή σχεδιάσματα που ακολουθούν θόρυβο
  function drawFlow(rng, pal, o) {
    var w = state.w, h = state.h;
    var g = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, Math.max(w, h) * 0.7);
    g.addColorStop(0, pal.bg);
    g.addColorStop(1, "#000000");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);

    var noise = makeNoise(rng, 8);
    var scale = 2.5 + o.chaos * 3;
    var turns = 1 + o.chaos * 2;

    var area = w * h;
    var n = Math.round((300 + o.density * 1200) * Math.min(1.5, area / (1920 * 1080)));
    if (n < 150) n = 150;

    var cols = pal.colors;
    var segLen = Math.max(3, Math.min(w, h) / 320);
    ctx.lineCap = "round";

    for (var p = 0; p < n; p++) {
      var x = rng() * w;
      var y = rng() * h;
      var col = cols[Math.floor(rng() * cols.length)];
      ctx.strokeStyle = rgba(col, 0.08 + rng() * 0.16);
      ctx.lineWidth = 0.5 + rng() * 2.5 * (0.4 + o.density);

      ctx.beginPath();
      ctx.moveTo(x, y);
      var maxSteps = 40 + Math.floor(rng() * 90);
      for (var s = 0; s < maxSteps; s++) {
        var ang = noise(x / w * scale, y / h * scale) * TAU * turns;
        x += Math.cos(ang) * segLen;
        y += Math.sin(ang) * segLen;
        if (x < -20 || x > w + 20 || y < -20 || y > h + 20) break;
        ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
  }

  // 3) Τροχιές — συγκεντρικοί κύκλοι με διακοσμητικά σημεία
  function drawOrbits(rng, pal, o) {
    fillBg(pal);
    var w = state.w, h = state.h;
    var minDim = Math.min(w, h);
    var cx = w * (0.5 + (rng() - 0.5) * 0.25 * o.chaos);
    var cy = h * (0.5 + (rng() - 0.5) * 0.25 * o.chaos);

    // Κεντρική λάμψη
    var glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, minDim * 0.55);
    glow.addColorStop(0, rgba(pal.colors[0], 0.28));
    glow.addColorStop(1, rgba(pal.colors[0], 0));
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, w, h);

    var n = Math.round(8 + o.density * 42);
    var cols = pal.colors;
    for (var i = 0; i < n; i++) {
      var t = (i + 1) / n;
      var r = minDim * 0.05 + t * minDim * 0.48 * (0.85 + rng() * 0.3);
      var col = cols[i % cols.length];

      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, TAU);
      ctx.strokeStyle = rgba(col, 0.18 + rng() * 0.45);
      ctx.lineWidth = minDim * (0.0012 + rng() * 0.012);
      ctx.stroke();

      // Διακοσμητικό «πλανήτης» πάνω στην τροχιά
      if (rng() < 0.55) {
        var ang = rng() * TAU;
        var pr = minDim * (0.004 + rng() * 0.012);
        ctx.beginPath();
        ctx.arc(cx + Math.cos(ang) * r, cy + Math.sin(ang) * r, pr, 0, TAU);
        ctx.fillStyle = rgba(col, 0.9);
        ctx.fill();
      }
    }
  }

  // 4) Κάνναβος — πλέγμα κύκλων με μέγεθος από θόρυβο
  function drawGrid(rng, pal, o) {
    fillBg(pal);
    var w = state.w, h = state.h;
    var noise = makeNoise(rng, 12);
    var cols = pal.colors;

    var nc = Math.round(10 + o.density * 36);
    var cell = w / nc;
    var nr = Math.ceil(h / cell);

    for (var j = 0; j < nr; j++) {
      for (var i = 0; i < nc; i++) {
        var val = noise(i / nc * 4, j / nr * 4);
        var jitter = cell * o.chaos * 0.5;
        var x = (i + 0.5) * cell + (rng() - 0.5) * jitter;
        var y = (j + 0.5) * cell + (rng() - 0.5) * jitter;
        var r = cell * 0.48 * Math.pow(val, 1.15);

        ctx.beginPath();
        ctx.arc(x, y, r, 0, TAU);
        ctx.fillStyle = cols[Math.min(cols.length - 1, Math.floor(val * cols.length))];
        ctx.fill();
      }
    }
  }

  // 5) Νεφελώματα — απαλά φωτεινές μάζες
  function drawBlobs(rng, pal, o) {
    fillBg(pal);
    var w = state.w, h = state.h;
    var minDim = Math.min(w, h);
    var cols = pal.colors;

    // Αστρόπεδο
    var stars = Math.round(120 + o.density * 380);
    for (var s = 0; s < stars; s++) {
      ctx.fillStyle = rgba("#ffffff", 0.1 + rng() * 0.5);
      ctx.fillRect(rng() * w, rng() * h, 1 + rng() * 1.5, 1 + rng() * 1.5);
    }

    var n = 4 + Math.round(o.density * 8);
    for (var i = 0; i < n; i++) {
      var col = cols[i % cols.length];
      var cx = w * (0.15 + rng() * 0.7);
      var cy = h * (0.15 + rng() * 0.7);
      var r = minDim * (0.18 + rng() * 0.38);
      var spread = 0.6 + o.chaos * 1.4;

      var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
      g.addColorStop(0, rgba(col, 0.5));
      g.addColorStop(0.5, rgba(col, 0.18));
      g.addColorStop(1, rgba(col, 0));
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, TAU);
      ctx.fill();

      // Λεπτά κύκλοι-κοντούρες
      var rings = 1 + Math.floor(rng() * 3);
      for (var k = 1; k <= rings; k++) {
        ctx.beginPath();
        ctx.arc(cx, cy, r * (0.35 + k * 0.22 * spread), 0, TAU);
        ctx.strokeStyle = rgba(col, 0.12);
        ctx.lineWidth = minDim * 0.0015;
        ctx.stroke();
      }
    }
  }

  var STYLES = {
    waves: drawWaves,
    flow: drawFlow,
    orbits: drawOrbits,
    grid: drawGrid,
    blobs: drawBlobs
  };

  // ===== GRAIN =====
  function applyGrain(rng) {
    var tile = document.createElement("canvas");
    tile.width = 160;
    tile.height = 160;
    var tctx = tile.getContext("2d");
    var img = tctx.createImageData(160, 160);
    var data = img.data;
    for (var i = 0; i < data.length; i += 4) {
      var v = Math.floor(rng() * 255);
      data[i] = v;
      data[i + 1] = v;
      data[i + 2] = v;
      data[i + 3] = 16;
    }
    tctx.putImageData(img, 0, 0);

    var pat = ctx.createPattern(tile, "repeat");
    ctx.save();
    ctx.globalCompositeOperation = "overlay";
    ctx.fillStyle = pat;
    ctx.fillRect(0, 0, state.w, state.h);
    ctx.restore();
  }

  // ===== RENDER =====
  function render() {
    var seedStr = seedInput.value.trim();
    if (!seedStr) {
      seedStr = randomSeed();
      seedInput.value = seedStr;
    }
    state.seed = seedStr;

    var hasher = xmur3(seedStr);
    var rng = mulberry32(hasher());

    var pal = PALETTES[state.palette];
    var opts = { density: state.density, chaos: state.chaos };

    canvas.width = state.w;
    canvas.height = state.h;

    ctx.fillStyle = pal.bg;
    ctx.fillRect(0, 0, state.w, state.h);

    STYLES[state.style](rng, pal, opts);

    if (state.grain) applyGrain(rng);

    renderStatus();
  }

  function renderStatus() {
    statusLine.textContent = state.w + " × " + state.h + " " + T.savedAs[currentLang] + state.seed;
  }

  function requestRender() {
    if (pendingRender) return;
    pendingRender = true;
    window.requestAnimationFrame(function () {
      pendingRender = false;
      render();
    });
  }
  
    // ===== DEBOUNCED RENDER =====
  // Για controls που εκπέμπουν συνεχώς (sliders). Το label ενημερώνεται αμέσως,
  // το βαρύ render τρέχει μία φορά, 120ms μετά την τελευταία κίνηση.
  var renderTimer = null;

  function scheduleRender() {
    if (renderTimer) clearTimeout(renderTimer);
    renderTimer = setTimeout(function () {
      renderTimer = null;
      requestRender();
    }, 120);
  }

  // ===== SEED =====
  function randomSeed() {
    var a = SEED_WORDS[Math.floor(Math.random() * SEED_WORDS.length)];
    var b = SEED_WORDS[Math.floor(Math.random() * SEED_WORDS.length)];
    var n = Math.floor(Math.random() * 99);
    return a + "-" + b + "-" + n;
  }

  // ===== ΕΞΑΓΩΓΗ =====
  var savedTimer = null;

  function flashSaved() {
    // Ενημέρωση status → «αποθηκεύτηκε» → επιστροφή στις διαστάσεις/seed
    statusLine.textContent = T.downloaded[currentLang];
    clearTimeout(savedTimer);
    savedTimer = setTimeout(renderStatus, 2200);
  }

  function download(type) {
    var ext = type === "image/jpeg" ? "jpg" : "png";
    var fname = "wallpaper_" + state.seed.replace(/[^a-z0-9\-_]/gi, "_") + "_" + state.w + "x" + state.h + "." + ext;
    canvas.toBlob(function (blob) {
      if (!blob) return;
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = fname;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
      flashSaved();
    }, type, 0.92);
  }

  // ===== UI SETUP =====
  (function init() {

    seedInput.value = randomSeed();

    seedBtn.addEventListener("click", function () {
      seedInput.value = randomSeed();
      requestRender();
    });

    seedInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter") requestRender();
    });

    styleSel.addEventListener("change", function () {
      state.style = styleSel.value;
      requestRender();
    });

    paletteSel.addEventListener("change", function () {
      state.palette = parseInt(paletteSel.value, 10) || 0;
      requestRender();
    });

    densityRange.addEventListener("input", function () {
      state.density = densityRange.value / 100;
      densityVal.textContent = densityRange.value + "%";
      scheduleRender();
    });

    chaosRange.addEventListener("input", function () {
      state.chaos = chaosRange.value / 100;
      chaosVal.textContent = chaosRange.value + "%";
      scheduleRender();
    });

    grainChk.addEventListener("change", function () {
      state.grain = grainChk.checked;
      requestRender();
    });

    resSel.addEventListener("change", function () {
      if (resSel.value === "custom") {
        customDims.classList.add("visible");
        applyCustomDims();
      } else {
        customDims.classList.remove("visible");
        var parts = resSel.value.split("x");
        state.w = parseInt(parts[0], 10);
        state.h = parseInt(parts[1], 10);
        requestRender();
      }
    });

    function applyCustomDims() {
      var cw = parseInt(customW.value, 10) || 1920;
      var ch = parseInt(customH.value, 10) || 1080;
      state.w = Math.max(256, Math.min(8192, cw));
      state.h = Math.max(256, Math.min(8192, ch));
      scheduleRender();
    }

    customW.addEventListener("change", applyCustomDims);
    customH.addEventListener("change", applyCustomDims);

    regenBtn.addEventListener("click", function () {
      seedInput.value = randomSeed();
      state.style = styleSel.value = Object.keys(STYLES)[Math.floor(Math.random() * 5)];
      state.palette = paletteSel.selectedIndex = Math.floor(Math.random() * PALETTES.length);
      state.density = densityRange.value = String(20 + Math.floor(Math.random() * 70));
      state.chaos = chaosRange.value = String(10 + Math.floor(Math.random() * 85));
      densityVal.textContent = densityRange.value + "%";
      chaosVal.textContent = chaosRange.value + "%";
      requestRender();
    });

    pngBtn.addEventListener("click", function () { download("image/png"); });
    jpgBtn.addEventListener("click", function () { download("image/jpeg"); });

    // Πληκτρολόγιο: R = τυχαίο reroll
    document.addEventListener("keydown", function (e) {
      if (e.key !== "r" && e.key !== "R") return;
      var tag = (e.target && e.target.tagName || "").toLowerCase();
      if (tag === "input" || tag === "select" || tag === "textarea") return;
      seedInput.value = randomSeed();
      requestRender();
    });

    applyStatic();   // i18n πριν το πρώτο render — σωστά ονόματα παλετών & status
    render();
  })();

  // ===== ΕΓΚΑΤΑΣΤΑΣΗ (PWA) =====
  var deferredPrompt = null;

  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.hidden = false;
  });

  installBtn.addEventListener("click", function () {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt = null;
    installBtn.hidden = true;
  });

  window.addEventListener("appinstalled", function () {
    deferredPrompt = null;
    installBtn.hidden = true;
  });

  // ===== SERVICE WORKER (offline — κοινός SW της σουίτας στη ρίζα) =====
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("../sw.js").catch(function (err) {
        console.warn("SW registration failed:", err);
      });
    });
  }

})();

</script>
