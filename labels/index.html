<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dymo Label Maker — Soffitta</title>
<meta name="description" content="Retro embossed Dymo tape labels — pick a tape, type your text and download the PNG. Free, open source, no cookies, no tracking.">
<link rel="canonical" href="https://soffitta.site/labels/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://soffitta.site/labels/">
<meta property="og:title" content="Dymo Label Maker — Soffitta">
<meta property="og:description" content="Retro embossed tape labels — pick a tape, type, download.">
<!-- TODO (αργότερα): og-cover.png 1200×630 στον φάκελο labels/ -->
<meta property="og:image" content="https://soffitta.site/labels/og-cover.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#161208">
<link rel="icon" type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23161208'/%3E%3Cpath d='M10 35L32 11L54 35' fill='none' stroke='%23e6ce9a' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='25' y='40' width='14' height='13' rx='3' fill='%23f0c75e'/%3E%3C/svg%3E">
<link rel="manifest" href="../manifest.webmanifest">
<style>
  :root {
    --bg: #161208;
    --surface: #221a10;
    --surface-2: #2d2315;
    --border: #443618;
    --text: #f2ead8;
    --text-muted: #a89a7d;
    --accent: #f0c75e;
    --accent-soft: rgba(240, 199, 94, 0.15);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  header h1 { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.01em; }
  header h1 span { color: var(--accent); }
  header .hint { font-size: 0.8rem; color: var(--text-muted); }

  /* ===== ΕΡΓΑΛΕΙΑ (γλώσσα + εγκατάσταση) ===== */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .lang-switch {
    display: flex;
    border: 1px solid var(--border);
    border-radius: 999px;
    overflow: hidden;
  }

  .lang-switch button {
    background: none;
    border: none;
    padding: 6px 12px;
    color: var(--text-muted);
    cursor: pointer;
    font: 700 0.75rem "Segoe UI", system-ui, sans-serif;
    letter-spacing: 0.04em;
  }

  .lang-switch button.active {
    background: var(--surface-2);
    color: var(--text);
  }

  #installBtn {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 999px;
    padding: 6px 14px;
    cursor: pointer;
    font: 700 0.75rem "Segoe UI", system-ui, sans-serif;
  }
  #installBtn:hover { border-color: var(--accent); }

  .layout {
    display: grid;
    grid-template-columns: 300px 1fr;
    gap: 0;
    flex: 1;
  }

  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; }
  }

  /* ===== CONTROLS ===== */
  aside {
    border-right: 1px solid var(--border);
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    overflow-y: auto;
  }

  @media (max-width: 820px) { aside { border-right: none; border-bottom: 1px solid var(--border); } }

  .group { display: flex; flex-direction: column; gap: 8px; }

  .group label {
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    font-weight: 700;
  }

  input[type="text"] {
    width: 100%;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 11px;
    font-size: 0.9rem;
    font-family: inherit;
    outline: none;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  input[type="text"]:focus { border-color: var(--accent); }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 6px;
    border-radius: 3px;
    background: var(--surface-2);
    outline: none;
    border: 1px solid var(--border);
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }

  input[type="range"]::-moz-range-thumb {
    width: 16px; height: 16px;
    border: none;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }

  .range-val { font-size: 0.78rem; color: var(--accent); font-variant-numeric: tabular-nums; }

  /* ===== ΤΑΙΝΙΕΣ (swatches) ===== */
  .tapes {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }

  .tape {
    height: 40px;
    border-radius: 8px;
    border: 2px solid var(--border);
    cursor: pointer;
    position: relative;
    transition: border-color 0.15s ease, transform 0.1s ease;
  }

  .tape:hover { transform: translateY(-2px); border-color: var(--text); }
  .tape.selected { border-color: var(--accent); }
  .tape.selected::after {
    content: "✓";
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 1rem;
    font-weight: 800;
    color: #000;
    text-shadow: 0 1px 0 rgba(255,255,255,0.5);
  }
  .tape.light.selected::after { color: #fff; text-shadow: 0 -1px 0 rgba(0,0,0,0.5); }

  .check-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.88rem;
    cursor: pointer;
    user-select: none;
  }

  .check-row input { accent-color: var(--accent); width: 16px; height: 16px; cursor: pointer; }

  button {
    font-family: inherit;
    font-size: 0.88rem;
    font-weight: 700;
    border-radius: 8px;
    padding: 10px 14px;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
  }

  button:hover { background: var(--surface-2); border-color: var(--accent); }
  button:active { transform: translateY(1px); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #221a10; }
  button.primary:hover { filter: brightness(1.08); background: var(--accent); }

  .btn-row { display: flex; gap: 8px; }
  .btn-row button { flex: 1; }

  footer {
    margin-top: auto;
    padding: 18px 24px;
    border-top: 1px solid var(--border);
    font-size: 0.78rem;
    color: var(--text-muted);
    text-align: center;
    line-height: 1.7;
  }

  footer a { color: var(--text); text-decoration: none; border-bottom: 1px dotted var(--text-muted); }
  footer a:hover { border-bottom-style: solid; }

  /* ===== PREVIEW ===== */
  main {
    padding: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 50vh;
    overflow-x: auto;
  }

  .canvas-frame {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.45);
    max-width: 100%;
  }

  #label {
    display: block;
    max-width: 100%;
    height: auto;
    border-radius: 6px;
  }

  .status {
    text-align: center;
    margin-top: 10px;
    font-size: 0.76rem;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }
</style>
</head>

<body>

<header>
  <div>
    <h1>🏷️ Dymo <span>Label Maker</span></h1>
    <p class="hint" data-en="Retro embossed tape labels — pick a tape, type, download."
       data-el="Ρετρό ανάγλυφες ετικέτες ταινίας — διάλεξε ταινία, γράψε, κατέβασε.">Retro embossed tape labels — pick a tape, type, download.</p>
  </div>
  <div class="toolbar">
    <button id="installBtn" hidden data-en="⬇ Install app" data-el="⬇ Εγκατάσταση">⬇ Install app</button>
    <div class="lang-switch" role="group" aria-label="Language">
      <button id="langEn" class="active">EN</button>
      <button id="langEl">ΕΛ</button>
    </div>
  </div>
</header>

<div class="layout">

  <aside>

    <div class="group">
      <label for="textInput" data-en="Text" data-el="Κείμενο">Text</label>
      <input type="text" id="textInput" maxlength="30" value="SOFFITTA" autocomplete="off" spellcheck="false">
    </div>

    <div class="group">
      <label data-en="Tape" data-el="Ταινία">Tape</label>
      <div class="tapes" id="tapes"></div>
    </div>

    <div class="group">
      <label for="sizeRange"><span data-en="Size" data-el="Μέγεθος">Size</span> <span class="range-val" id="sizeVal">100%</span></label>
      <input type="range" id="sizeRange" min="60" max="180" value="100">
    </div>

    <div class="group">
      <label for="spacingRange"><span data-en="Letter spacing" data-el="Απόσταση γραμμάτων">Letter spacing</span> <span class="range-val" id="spacingVal">100%</span></label>
      <input type="range" id="spacingRange" min="60" max="200" value="100">
    </div>

    <div class="group">
      <label class="check-row">
        <input type="checkbox" id="frameChk">
        <span data-en="Embossed frame" data-el="Ανάγλυφο πλαίσιο">Embossed frame</span>
      </label>
      <label class="check-row">
        <input type="checkbox" id="cutsChk" checked>
        <span data-en="Side slits" data-el="Τεμαχισμοί στα άκρα">Side slits</span>
      </label>
    </div>

    <div class="group">
      <div class="btn-row">
        <button id="pngBtn">💾 PNG</button>
      </div>
    </div>

  </aside>

  <main>
    <div class="canvas-frame">
      <canvas id="label"></canvas>
      <div class="status" id="statusLine"></div>
    </div>
  </main>

</div>

<footer>
  <span data-en="Designed by" data-el="Σχεδιασμένο από τον">Designed by</span>
  <a href="https://koulaxizis.gr" target="_blank" rel="noopener">Christos Koulaxizis</a> ·
  <a href="../" data-en="All apps" data-el="Όλα τα apps">All apps</a><br>
  <span data-en="No cookies · No tracking · Open source"
        data-el="Χωρίς cookies · Χωρίς tracking · Ανοιχτού κώδικα">No cookies · No tracking · Open source</span>
</footer>

<script>
"use strict";
(function () {

  var TAU = Math.PI * 2;
  var SCALE = 3; // render σε 3× για ευκρινή εξαγωγή

  // ===== ΣΤΑΘΕΡΕΣ =====
  // 8 κλασικά χρώματα ταινίας Dymo
  var TAPES = [
    { name_en: "White",   name_el: "Λευκό",     bg: "#e8e4da", light: true  },
    { name_en: "Red",     name_el: "Κόκκινο",   bg: "#d84b40", light: false },
    { name_en: "Blue",    name_el: "Μπλε",      bg: "#3f6fb5", light: false },
    { name_en: "Yellow",  name_el: "Κίτρινο",   bg: "#f0c75e", light: true  },
    { name_en: "Green",   name_el: "Πράσινο",   bg: "#57a863", light: false },
    { name_en: "Orange",  name_el: "Πορτοκαλί", bg: "#e08a3c", light: false },
    { name_en: "Silver",  name_el: "Ασημί",     bg: "#b8bcc4", light: true  },
    { name_en: "Black",   name_el: "Μαύρο",     bg: "#26262b", light: false }
  ];

  // ===== DOM =====
  var canvas = document.getElementById("label");
  var ctx = canvas.getContext("2d");
  var textInput = document.getElementById("textInput");
  var tapesEl = document.getElementById("tapes");
  var sizeRange = document.getElementById("sizeRange");
  var spacingRange = document.getElementById("spacingRange");
  var sizeVal = document.getElementById("sizeVal");
  var spacingVal = document.getElementById("spacingVal");
  var frameChk = document.getElementById("frameChk");
  var cutsChk = document.getElementById("cutsChk");
  var pngBtn = document.getElementById("pngBtn");
  var statusLine = document.getElementById("statusLine");
  var langEnBtn = document.getElementById("langEn");
  var langElBtn = document.getElementById("langEl");
  var installBtn = document.getElementById("installBtn");

  // ===== i18n (κοινό μοτίβο σε όλη τη σουίτα) =====
  var LANG_KEY = "soffitta.lang";

  var T = {
    title: {
      en: "Dymo Label Maker — Soffitta",
      el: "Ετικετογράφος Dymo — Soffitta"
    },
    metaDesc: {
      en: "Retro embossed Dymo tape labels — pick a tape, type your text and download the PNG. Free, open source, no cookies, no tracking.",
      el: "Ρετρό ανάγλυφες ετικέτες ταινίας Dymo — διάλεξε ταινία, γράψε το κείμενό σου και κατέβασε PNG. Χωρίς cookies, χωρίς tracking."
    },
    downloaded: { en: "Saved label ✓", el: "Η ετικέτα αποθηκεύτηκε ✓" },
    tapeWord: { en: "tape", el: "ταινία" }
  };

  var currentLang = detectLang();

  function detectLang() {
    try {
      var saved = localStorage.getItem(LANG_KEY);
      if (saved === "en" || saved === "el") return saved;
    } catch (e) {}
    var nav = (navigator.language || "en").slice(0, 2).toLowerCase();
    return nav === "el" ? "el" : "en";
  }

  function applyStatic() {
    document.documentElement.setAttribute("lang", currentLang);
    document.title = T.title[currentLang];
    var metaDesc = document.querySelector('meta[name="description"]');
    if (metaDesc) metaDesc.setAttribute("content", T.metaDesc[currentLang]);
    var nodes = document.querySelectorAll("[data-en]");
    for (var i = 0; i < nodes.length; i++) {
      nodes[i].textContent = currentLang === "el"
        ? nodes[i].getAttribute("data-el")
        : nodes[i].getAttribute("data-en");
    }
    langEnBtn.classList.toggle("active", currentLang === "en");
    langElBtn.classList.toggle("active", currentLang === "el");
    fillTapes(); // τα tooltips των ταινιών χτίζονται JS-side
  }

  function setLang(lang) {
    currentLang = lang;
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
    applyStatic();
    renderStatus();
  }

  langEnBtn.addEventListener("click", function () { setLang("en"); });
  langElBtn.addEventListener("click", function () { setLang("el"); });

  // ===== STATE =====
  var state = {
    tape: 0,
    sizeScale: 1.0,   // 0.6 .. 1.8 (slider 60..180 / 100)
    spacing: 1.0      // 0.6 .. 2.0 (slider 60..200 / 100)
  };

  var pendingRender = false;

  function requestRender() {
    if (pendingRender) return;
    pendingRender = true;
    window.requestAnimationFrame(function () {
      pendingRender = false;
      render();
    });
  }

  // ===== ΒΟΗΘΗΤΙΚΑ =====
  // Ανάμειξη προς λευκό (amt > 0) ή μαύρο (amt < 0), amt σε 0..±1
  function shadeMix(hex, amt) {
    var r = parseInt(hex.slice(1, 3), 16);
    var g = parseInt(hex.slice(3, 5), 16);
    var b = parseInt(hex.slice(5, 7), 16);
    if (amt >= 0) {
      r = r + (255 - r) * amt;
      g = g + (255 - g) * amt;
      b = b + (255 - b) * amt;
    } else {
      var f = 1 + amt;
      r *= f; g *= f; b *= f;
    }
    return "rgb(" + Math.round(r) + "," + Math.round(g) + "," + Math.round(b) + ")";
  }

  // Rounded rect path (native compatible helper)
  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.lineTo(x + w - r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.lineTo(x + w, y + h - r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.lineTo(x, y + h);
    c.arcTo(x, y + h, x, y, r);
    c.lineTo(x, y);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  // ===== ΤΑΙΝΙΕΣ (UI) =====
  function fillTapes() {
    tapesEl.innerHTML = "";
    for (var i = 0; i < TAPES.length; i++) {
      var sw = document.createElement("div");
      sw.className = "tape"
        + (TAPES[i].light ? " light" : "")
        + (i === state.tape ? " selected" : "");
      sw.style.background = TAPES[i].bg;
      sw.title = currentLang === "el" ? TAPES[i].name_el : TAPES[i].name_en;
      sw.dataset.index = String(i);
      tapesEl.appendChild(sw);
    }
  }

  tapesEl.addEventListener("click", function (e) {
    var t = e.target;
    if (!t.classList || !t.classList.contains("tape")) return;
    state.tape = parseInt(t.dataset.index, 10) || 0;
    var kids = tapesEl.children;
    for (var j = 0; j < kids.length; j++) {
      kids[j].classList.toggle("selected", j === state.tape);
    }
    requestRender();
  });

  // ===== EVENTS =====
  textInput.addEventListener("input", function () {
    textInput.value = textInput.value.toUpperCase();
    requestRender();
  });

  sizeRange.addEventListener("input", function () {
    state.sizeScale = sizeRange.value / 100;
    sizeVal.textContent = sizeRange.value + "%";
    requestRender();
  });

  spacingRange.addEventListener("input", function () {
    state.spacing = spacingRange.value / 100;
    spacingVal.textContent = spacingRange.value + "%";
    requestRender();
  });

  frameChk.addEventListener("change", function () { requestRender(); });
  cutsChk.addEventListener("change", function () { requestRender(); });

  // ===== RENDER =====
  function fontString(fs) {
    return "700 " + fs + "px 'Arial Narrow', Arial, 'Segoe UI', sans-serif";
  }

  function render() {
    var text = textInput.value.trim().toUpperCase();
    if (!text) text = "LABEL";
    var tape = TAPES[state.tape];

    // Μέγεθος γραμματοσειράς & απόστασης από τα sliders
    var fs = Math.round(34 * state.sizeScale);
    var sp = fs * 0.28 * state.spacing;
    var padX = fs * 0.6;

    // Μέτρηση πλάτους (Manual letter spacing)
    ctx.font = fontString(fs);
    var tw = 0;
    var i;
    for (i = 0; i < text.length; i++) {
      tw += ctx.measureText(text.charAt(i)).width + sp;
    }
    if (text.length > 0) tw -= sp; // αφαιρούμε την τελευταία απόσταση

    var w = Math.max(80, Math.ceil(tw + padX * 2));
    var h = Math.ceil(fs * 1.9);
    var midY = h / 2;

    // Offscreen μέγεθος ×SCALE, preview σε λογικό μέγεθος μέσω CSS
    canvas.width = Math.ceil(w * SCALE);
    canvas.height = Math.ceil(h * SCALE);
    canvas.style.width = w + "px";
    ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);

    // Ταινία με κάθετο γράδιαντο
    var grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, shadeMix(tape.bg, tape.light ? 0.07 : 0.10));
    grad.addColorStop(0.5, tape.bg);
    grad.addColorStop(1, shadeMix(tape.bg, tape.light ? -0.08 : -0.10));
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    // Ανάγλυφο πλαίσιο (προαιρετικό)
    if (frameChk.checked) {
      ctx.strokeStyle = shadeMix(tape.bg, tape.light ? -0.38 : 0.45);
      ctx.lineWidth = Math.max(2, fs * 0.08);
      roundRect(ctx, fs * 0.22, fs * 0.22, w - fs * 0.44, h - fs * 0.44, fs * 0.18);
      ctx.stroke();
    }

    // Κείμενο: highlight (πάνω-αριστερά) → shadow (κάτω-δεξιά) → face
    ctx.font = fontString(fs);
    ctx.textBaseline = "middle";

    var dark = shadeMix(tape.bg, -0.55);
    var lite = shadeMix(tape.bg, 0.85);
    var face = shadeMix(tape.bg, tape.light ? -0.22 : 0.30);
    var off = fs * 0.07; // βάθος ανάγλυφου

    var x = padX;
    for (i = 0; i < text.length; i++) {
      var ch = text.charAt(i);
      ctx.fillStyle = lite;
      ctx.fillText(ch, x - 1, midY - off - 1);
      ctx.fillStyle = dark;
      ctx.fillText(ch, x + 1, midY + off + 1);
      ctx.fillStyle = face;
      ctx.fillText(ch, x, midY);
      x += ctx.measureText(ch).width + sp;
    }

    // Τεμαχισμοί (notches) στα άκρα — διάτρητοι μισοί κύκλοι
    if (cutsChk.checked) {
      ctx.globalCompositeOperation = "destination-out";
      ctx.beginPath();
      ctx.arc(0, midY, h * 0.30, 0, TAU);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(w, midY, h * 0.30, 0, TAU);
      ctx.fill();
      ctx.globalCompositeOperation = "source-over";
    }

    renderStatus();
  }

  function renderStatus() {
    var tape = TAPES[state.tape];
    var name = currentLang === "el" ? tape.name_el : tape.name_en;
    statusLine.textContent =
      Math.round(canvas.width / SCALE) + " × " + Math.round(canvas.height / SCALE)
      + " · " + T.tapeWord[currentLang] + ": " + name;
  }

  // ===== ΕΞΑΓΩΓΗ =====
  var savedTimer = null;

  function flashSaved() {
    statusLine.textContent = T.downloaded[currentLang];
    clearTimeout(savedTimer);
    savedTimer = setTimeout(renderStatus, 2200);
  }

  function download() {
    var text = textInput.value.trim().toUpperCase() || "label";
    var fname = "dymo_" + text.replace(/[^a-z0-9\-_]/gi, "_").toLowerCase()
      + "_" + canvas.width + "x" + canvas.height + ".png";
    canvas.toBlob(function (blob) {
      if (!blob) return;
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = fname;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
      flashSaved();
    }, "image/png");
  }

  pngBtn.addEventListener("click", download);

  // ===== UI SETUP =====
  (function init() {
    sizeVal.textContent = sizeRange.value + "%";
    spacingVal.textContent = spacingRange.value + "%";
    applyStatic();   // i18n πριν το πρώτο render
    render();
  })();

  // ===== ΕΓΚΑΤΑΣΤΑΣΗ (PWA) =====
  var deferredPrompt = null;

  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.hidden = false;
  });

  installBtn.addEventListener("click", function () {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt = null;
    installBtn.hidden = true;
  });

  window.addEventListener("appinstalled", function () {
    deferredPrompt = null;
    installBtn.hidden = true;
  });

  // ===== SERVICE WORKER (offline — κοινός SW της σουίτας στη ρίζα) =====
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("../sw.js").catch(function (err) {
        console.warn("SW registration failed:", err);
      });
    });
  }

})();
</script>

</body>
</html>
