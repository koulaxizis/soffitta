<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wheel of Fate</title> <!-- SUITE NAME prefix όταν επιλεγεί το όνομα -->
<meta name="description" content="Ο τροχός της απόφασης: πρόσθεσε επιλογές, γύρνα και άφησε την τύχη να αποφασίσει. Χωρίς cookies, χωρίς tracking.">
<style>
  :root {
    --bg: #1a120a;
    --surface: #241a0e;
    --surface-2: #2f2214;
    --border: #4d3a1e;
    --text: #f5edd9;
    --text-muted: #b0a084;
    --accent: #ffb35c;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: radial-gradient(ellipse at 50% -20%, #2b1d10 0%, var(--bg) 65%);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  header h1 { font-size: 1.2rem; font-weight: 800; }
  header h1 span { color: var(--accent); }
  header .hint { font-size: 0.78rem; color: var(--text-muted); }

  .layout {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 300px;
  }

  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    .left { border-right: none !important; border-bottom: 1px solid var(--border); }
    .right { border-left: none !important; }
  }

  .left {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px 20px 44px;
    gap: 20px;
  }

  .right {
    border-left: 1px solid var(--border);
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 22px;
    overflow-y: auto;
  }

  #wheel {
    display: block;
    width: min(78vw, 440px);
    height: auto;
    filter: drop-shadow(0 12px 42px rgba(0,0,0,0.55));
  }

  .result {
    min-height: 1.5em;
    font-size: 1.3rem;
    font-weight: 800;
    color: var(--accent);
    text-align: center;
  }

  button {
    font-family: inherit;
    font-size: 0.88rem;
    font-weight: 700;
    border-radius: 8px;
    padding: 10px 18px;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease, filter 0.15s ease;
  }

  button:hover:not([disabled]) { border-color: var(--accent); background: var(--surface-2); }
  button:active:not([disabled]) { transform: translateY(1px); }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #2b1a06;
    font-size: 1.02rem;
    padding: 13px 34px;
  }
  button.primary:hover:not([disabled]) { filter: brightness(1.07); background: var(--accent); }
  button[disabled] { opacity: 0.4; cursor: default; }

  h2.section {
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    font-weight: 800;
    margin-bottom: 8px;
  }

  textarea {
    width: 100%;
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    font-size: 0.92rem;
    font-family: inherit;
    line-height: 1.7;
    outline: none;
    min-height: 150px;
    resize: vertical;
  }
  textarea:focus { border-color: var(--accent); }

  .hint { font-size: 0.72rem; color: var(--text-muted); margin-top: 6px; }

  .quick { display: flex; flex-wrap: wrap; gap: 8px; }
  .quick button { font-size: 0.76rem; padding: 7px 12px; border-radius: 999px; }

  .winners { list-style: none; display: flex; flex-direction: column; gap: 6px; }
  .winners li {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 12px;
    font-size: 0.84rem;
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .winners .time { font-size: 0.68rem; color: var(--text-muted); margin-left: auto; font-variant-numeric: tabular-nums; }

  .empty { font-size: 0.82rem; color: var(--text-muted); font-style: italic; }

  footer {
    margin-top: auto;
    padding: 14px 24px;
    border-top: 1px solid var(--border);
    font-size: 0.76rem;
    color: var(--text-muted);
    text-align: center;
    line-height: 1.7;
  }
  footer a { color: var(--text); text-decoration: none; border-bottom: 1px dotted var(--text-muted); }
  footer a:hover { border-bottom-style: solid; }

  .kbd {
    display: inline-block;
    padding: 1px 6px;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 0.68rem;
    font-family: ui-monospace, monospace;
  }

  .confetti {
    position: fixed;
    top: -12px;
    width: 9px;
    height: 14px;
    pointer-events: none;
    z-index: 20;
    animation: fall 2.6s linear forwards;
  }
  @keyframes fall {
    0% { transform: translateY(0) rotate(0); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .confetti { animation-duration: 0.6s; }
  }
</style>
</head>
<body>

<header>
  <h1>🎡 Wheel of <span>Fate</span></h1>
  <p class="hint"><span class="kbd">Space</span> γύρισμα — η τύχη είναι ο μοναδικός κριτής</p>
</header>

<div class="layout">

  <section class="left">
    <canvas id="wheel" width="480" height="480"></canvas>
    <button id="spinBtn" class="primary">🎯 Γύρνα τον τροχό!</button>
    <div class="result" id="resultEl"></div>
  </section>

  <aside class="right">

    <div>
      <h2 class="section">Επιλογές</h2>
      <textarea id="itemsArea" spellcheck="false" aria-label="Επιλογές τροχού"></textarea>
      <p class="hint">Μία επιλογή ανά γραμμή · 2 έως 20</p>
      <button id="applyBtn" style="width:100%; margin-top:8px;">✓ Εφαρμογή στον τροχό</button>
    </div>

    <div>
      <h2 class="section">Έτοιμα σετ</h2>
      <div class="quick" id="quickSets"></div>
    </div>

    <div>
      <h2 class="section">Νικητές</h2>
      <ul class="winners" id="winList"></ul>
      <p class="empty" id="winEmpty">Κανείς νικητής ακόμα.</p>
      <button id="clearWinBtn" style="width:100%; margin-top:8px;">🧹 Καθάρισμα νικητών</button>
    </div>

  </aside>

</div>

<footer>
  Designed by <a href="https://koulaxizis.gr" target="_blank" rel="noopener">Christos Koulaxizis</a> ·
  <a href="../">Όλα τα apps</a><br>
  Χωρίς cookies · Χωρίς tracking · Open source
</footer>

<script>
"use strict";
(function () {

  // ===== DOM =====
  var canvas = document.getElementById("wheel");
  var ctx = canvas.getContext("2d");
  var spinBtn = document.getElementById("spinBtn");
  var resultEl = document.getElementById("resultEl");
  var itemsArea = document.getElementById("itemsArea");
  var applyBtn = document.getElementById("applyBtn");
  var quickSetsEl = document.getElementById("quickSets");
  var winListEl = document.getElementById("winList");
  var winEmptyEl = document.getElementById("winEmpty");
  var clearWinBtn = document.getElementById("clearWinBtn");

  var TAU = Math.PI * 2;
  var CX = 240, CY = 240, R = 218;

  var LS_ITEMS = "wheelfate.items.v1";
  var LS_WINNERS = "wheelfate.winners.v1";

  var COLORS = [
    "#ffb35c", "#ff8a65", "#ffd166", "#a5d6a7",
    "#81d4fa", "#ce93d8", "#f48fb1", "#e6ce9a",
    "#80cbc4", "#ffab91", "#b39ddb", "#c5e1a5",
    "#90caf9", "#ffb74d", "#f0a4b8", "#8fd3c7",
    "#dcc98c", "#9fd8a2", "#f4b183", "#b8a8e8"
  ];

  var QUICK_SETS = [
    { name: "🍕 Τι θα φάμε;",  items: ["Πίτσα", "Σουβλάκι", "Μπέργκερ", "Πάστα", "Ψητό", "Σαλάτα"] },
    { name: "🎲 Ποιος αρχίζει;", items: ["Ο πρώτος", "Ο δεύτερος", "Ο τρίτος", "Ο τέταρτος"] },
    { name: "❓ Ναι ή όχι;",     items: ["ΝΑΙ", "ΟΧΙ", "Σίγουρα ναι", "Καθόλου", "Ρώτα ξανά"] },
    { name: "🎬 Ταινία απόψε;",  items: ["Δράμα", "Κωμωδία", "Θρίλερ", "Sci-Fi", "Ντοκιμαντέρ", "Animation"] }
  ];

  // ===== STATE =====
  var items = ["Πίτσα", "Σουβλάκι", "Μπέργκερ", "Πάστα", "Ψητό", "Σαλάτα"];
  var winners = [];

  var angle = 0;        // τρέχουσα γωνία τροχού (rad)
  var velocity = 0;      // rad/s
  var spinning = false;
  var lastTs = 0;

  // ===== ΦΟΡΤΩΣΗ =====
  try {
    var savedItems = JSON.parse(localStorage.getItem(LS_ITEMS) || "null");
    if (Array.isArray(savedItems) && savedItems.length >= 2) items = savedItems.slice(0, 20);
  } catch (e) {}

  try {
    var savedWinners = JSON.parse(localStorage.getItem(LS_WINNERS) || "null");
    if (Array.isArray(savedWinners)) winners = savedWinners.slice(0, 20);
  } catch (e) {}

  function saveItems() {
    try { localStorage.setItem(LS_ITEMS, JSON.stringify(items)); } catch (e) {}
  }

  function saveWinners() {
    try { localStorage.setItem(LS_WINNERS, JSON.stringify(winners)); } catch (e) {}
  }

  // ===== ΣΧΕΔΙΑΣΜΟΣ =====
  function fontSz(n) {
    if (n <= 6) return 17;
    if (n <= 8) return 15;
    if (n <= 12) return 13;
    return 11;
  }

  function drawWheel() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    var n = items.length;
    var step = TAU / n;
    var fs = fontSz(n);

    for (var i = 0; i < n; i++) {
      var a0 = i * step - Math.PI / 2 + angle;
      var a1 = a0 + step;

      // Φέτα
      ctx.beginPath();
      ctx.moveTo(CX, CY);
      ctx.arc(CX, CY, R, a0, a1);
      ctx.closePath();
      ctx.fillStyle = COLORS[i % COLORS.length];
      ctx.fill();

      // Διαχωριστική γραμμή
      ctx.beginPath();
      ctx.moveTo(CX, CY);
      ctx.lineTo(CX + Math.cos(a0) * R, CY + Math.sin(a0) * R);
      ctx.strokeStyle = "rgba(30,18,6,0.55)";
      ctx.lineWidth = 2;
      ctx.stroke();

      // Ετικέτα
      var mid = a0 + step / 2;
      ctx.save();
      ctx.translate(CX, CY);
      ctx.rotate(mid);
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      ctx.font = "700 " + fs + "px 'Segoe UI', sans-serif";
      ctx.fillStyle = "#2b1a06";
      var label = items[i];
      while (label.length > 3 && ctx.measureText(label).width > R * 0.62) {
        label = label.slice(0, -2);
      }
      if (label !== items[i]) label += "…";
      ctx.fillText(label, R - 22, 0);
      ctx.restore();
    }

    // Εξωτερικό στεφάνι
    ctx.beginPath();
    ctx.arc(CX, CY, R + 5, 0, TAU);
    ctx.lineWidth = 10;
    ctx.strokeStyle = "#5d4620";
    ctx.stroke();

    // Λαμπάκια στο στεφάνι
    for (var b = 0; b < 16; b++) {
      var ang = (b / 16) * TAU;
      var bx = CX + Math.cos(ang) * (R + 5);
      var by = CY + Math.sin(ang) * (R + 5);
      ctx.beginPath();
      ctx.arc(bx, by, 3.5, 0, TAU);
      ctx.fillStyle = "#fff3d9";
      ctx.fill();
    }

    // Κεντρικός άξονας
    ctx.beginPath();
    ctx.arc(CX, CY, 20, 0, TAU);
    ctx.fillStyle = "#5d4620";
    ctx.fill();
    ctx.beginPath();
    ctx.arc(CX, CY, 8, 0, TAU);
    ctx.fillStyle = "#f5edd9";
    ctx.fill();

    // Δείκτης — κορυφή, δείχνει προς τα κάτω
    ctx.beginPath();
    ctx.moveTo(CX - 15, 6);
    ctx.lineTo(CX + 15, 6);
    ctx.lineTo(CX, 36);
    ctx.closePath();
    ctx.fillStyle = "#ffb35c";
    ctx.fill();
    ctx.strokeStyle = "#5d4620";
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // ===== ΓΥΡΙΣΜΑ (physics με εκθετική τριβή) =====
  function startSpin() {
    if (spinning || items.length < 2) return;
    spinning = true;
    spinBtn.disabled = true;
    resultEl.textContent = "";

    // Αρχική ταχύτητα 9–15 rad/s, τυχαία φορά
    velocity = (9 + Math.random() * 6) * (Math.random() < 0.5 ? -1 : 1);
    lastTs = 0;
    requestAnimationFrame(tick);
  }

  function tick(ts) {
    if (!spinning) return;
    if (!lastTs) lastTs = ts;
    var dt = Math.min(0.05, (ts - lastTs) / 1000);
    lastTs = ts;

    angle += velocity * dt;
    // Η ταχύτητα υποδιπλασιάζεται κάθε 0.35s (ομαλό φρενάρισμα)
    velocity *= Math.pow(0.5, dt / 0.35);

    if (Math.abs(velocity) < 0.08) {
      velocity = 0;
      spinning = false;
      spinBtn.disabled = false;
      finishSpin();
      return;
    }

    drawWheel();
    requestAnimationFrame(tick);
  }

  // ===== ΝΙΚΗΤΗΣ =====
  // Η φέτα i καλύπτει γωνίες [i*step - π/2 + angle, (i+1)*step - π/2 + angle].
  // Ο δείκτης βρίσκεται στην κορυφή: γωνία -π/2. Λύνουμε για i:
  function winnerIndex() {
    var n = items.length;
    var step = TAU / n;
    var u = ((-angle) % TAU + TAU) % TAU;
    return Math.floor(u / step) % n;
  }

  function finishSpin() {
    drawWheel();
    var idx = winnerIndex();
    var text = items[idx];
    resultEl.textContent = "🎉 " + text + "!";
    winners.unshift({ text: text, ts: Date.now() });
    if (winners.length > 20) winners = winners.slice(0, 20);
    saveWinners();
    renderWinners();
    throwConfetti();
  }

  function fmtTime(ts) {
    var d = new Date(ts);
    return ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
  }

  function renderWinners() {
    winListEl.innerHTML = "";
    winEmptyEl.style.display = winners.length ? "none" : "block";
    for (var i = 0; i < winners.length; i++) {
      var li = document.createElement("li");
      var name = document.createElement("span");
      name.textContent = "🏆 " + winners[i].text;
      var time = document.createElement("span");
      time.className = "time";
      time.textContent = fmtTime(winners[i].ts);
      li.appendChild(name);
      li.appendChild(time);
      winListEl.appendChild(li);
    }
  }

  // ===== ΚΟΝΦΕΤΙ =====
  function throwConfetti() {
    var palette = ["#ffb35c", "#ffd166", "#ff8a65", "#a5d6a7", "#81d4fa", "#ce93d8"];
    for (var i = 0; i < 44; i++) {
      var el = document.createElement("div");
      el.className = "confetti";
      el.style.left = (Math.random() * 100) + "vw";
      el.style.background = palette[Math.floor(Math.random() * palette.length)];
      el.style.animationDelay = (Math.random() * 0.5) + "s";
      el.style.animationDuration = (2 + Math.random() * 1.4) + "s";
      document.body.appendChild(el);
      (function (node) {
        setTimeout(function () { node.remove(); }, 3600);
      })(el);
    }
  }

  // ===== ΕΠΕΞΕΡΓΑΣΙΑ ΕΠΙΛΟΓΩΝ =====
  applyBtn.addEventListener("click", function () {
    var lines = itemsArea.value.split(/\n/)
      .map(function (s) { return s.trim(); })
      .filter(function (s) { return s.length > 0; })
      .slice(0, 20);
    if (lines.length < 2) {
      resultEl.textContent = "Χρειάζονται τουλάχιστον 2 επιλογές!";
      return;
    }
    items = lines;
    saveItems();
    angle = 0;
    drawWheel();
    resultEl.textContent = "";
  });

  // ===== ΕΤΟΙΜΑ ΣΕΤ =====
  QUICK_SETS.forEach(function (set) {
    var el = document.createElement("button");
    el.textContent = set.name;
    el.addEventListener("click", function () {
      items = set.items.slice();
      itemsArea.value = items.join("\n");
      saveItems();
      angle = 0;
      drawWheel();
      resultEl.textContent = "";
    });
    quickSetsEl.appendChild(el);
  });

  // ===== ΚΑΘΑΡΙΣΜΑ ΝΙΚΗΤΩΝ =====
  clearWinBtn.addEventListener("click", function () {
    winners = [];
    saveWinners();
    renderWinners();
  });

  // ===== ΠΛΗΚΤΡΟΛΟΓΙΟ =====
  document.addEventListener("keydown", function (e) {
    if (e.code !== "Space") return;
    var tag = (e.target && e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "select" || tag === "textarea" || tag === "button") return;
    e.preventDefault();
    if (!spinning) startSpin();
  });

  spinBtn.addEventListener("click", startSpin);

  // ===== INIT =====
  itemsArea.value = items.join("\n");
  renderWinners();
  drawWheel();

})();
</script>

</body>
</html>
