<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wheel of Fate — Soffitta</title>
<meta name="description" content="The wheel of decisions: add options, spin, and let fate decide. Winners history, quick sets, colorful confetti. Free, open source, no cookies, no tracking.">
<link rel="canonical" href="https://soffitta.site/wheel/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://soffitta.site/wheel/">
<meta property="og:title" content="Wheel of Fate — Soffitta">
<meta property="og:description" content="The decision wheel — add options, spin, and let luck be the only judge.">
<!-- TODO (αργότερα): og-cover.png 1200×630 στον φάκελο wheel/ -->
<meta property="og:image" content="https://soffitta.site/wheel/og-cover.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#1a120a">
<link rel="icon" type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231a120a'/%3E%3Cpath d='M10 35L32 11L54 35' fill='none' stroke='%23e6ce9a' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='25' y='40' width='14' height='13' rx='3' fill='%23ffb35c'/%3E%3C/svg%3E">
<link rel="manifest" href="../manifest.webmanifest">
<style>
  :root {
    --bg: #1a120a;
    --surface: #241a0e;
    --surface-2: #2f2214;
    --border: #4d3a1e;
    --text: #f5edd9;
    --text-muted: #b0a084;
    --accent: #ffb35c;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: radial-gradient(ellipse at 50% -20%, #2b1d10 0%, var(--bg) 65%);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  header h1 { font-size: 1.2rem; font-weight: 800; }
  header h1 span { color: var(--accent); }
  header .hint { font-size: 0.78rem; color: var(--text-muted); }

  /* ===== ΕΡΓΑΛΕΙΑ (γλώσσα + εγκατάσταση) ===== */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .lang-switch {
    display: flex;
    border: 1px solid var(--border);
    border-radius: 999px;
    overflow: hidden;
  }

  .lang-switch button {
    background: none;
    border: none;
    padding: 6px 12px;
    color: var(--text-muted);
    cursor: pointer;
    font: 700 0.75rem "Segoe UI", system-ui, sans-serif;
    letter-spacing: 0.04em;
  }

  .lang-switch button.active {
    background: var(--surface-2);
    color: var(--text);
  }

  #installBtn {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 999px;
    padding: 6px 14px;
    cursor: pointer;
    font: 700 0.75rem "Segoe UI", system-ui, sans-serif;
  }
  #installBtn:hover { border-color: var(--accent); }

  .layout {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 300px;
  }

  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    .left { border-right: none !important; border-bottom: 1px solid var(--border); }
    .right { border-left: none !important; }
  }

  .left {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px 20px 44px;
    gap: 20px;
  }

  .right {
    border-left: 1px solid var(--border);
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 22px;
    overflow-y: auto;
  }

  #wheel {
    display: block;
    width: min(78vw, 440px);
    height: auto;
    cursor: pointer;
    filter: drop-shadow(0 12px 42px rgba(0,0,0,0.55));
  }

  .result {
    min-height: 1.5em;
    font-size: 1.3rem;
    font-weight: 800;
    color: var(--accent);
    text-align: center;
  }

  button {
    font-family: inherit;
    font-size: 0.88rem;
    font-weight: 700;
    border-radius: 8px;
    padding: 10px 18px;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease, filter 0.15s ease;
  }

  button:hover:not([disabled]) { border-color: var(--accent); background: var(--surface-2); }
  button:active:not([disabled]) { transform: translateY(1px); }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #2b1a06;
    font-size: 1.02rem;
    padding: 13px 34px;
  }
  button.primary:hover:not([disabled]) { filter: brightness(1.07); background: var(--accent); }
  button[disabled] { opacity: 0.4; cursor: default; }

  h2.section {
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    font-weight: 800;
    margin-bottom: 8px;
  }

  textarea {
    width: 100%;
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    font-size: 0.92rem;
    font-family: inherit;
    line-height: 1.7;
    outline: none;
    min-height: 150px;
    resize: vertical;
  }
  textarea:focus { border-color: var(--accent); }

  .hint { font-size: 0.72rem; color: var(--text-muted); margin-top: 6px; }

  .quick { display: flex; flex-wrap: wrap; gap: 8px; }
  .quick button { font-size: 0.76rem; padding: 7px 12px; border-radius: 999px; }

  .winners { list-style: none; display: flex; flex-direction: column; gap: 6px; }
  .winners li {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 12px;
    font-size: 0.84rem;
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .winners .time { font-size: 0.68rem; color: var(--text-muted); margin-left: auto; font-variant-numeric: tabular-nums; }

  .empty { font-size: 0.82rem; color: var(--text-muted); font-style: italic; }

  footer {
    margin-top: auto;
    padding: 14px 24px;
    border-top: 1px solid var(--border);
    font-size: 0.76rem;
    color: var(--text-muted);
    text-align: center;
    line-height: 1.7;
  }
  footer a { color: var(--text); text-decoration: none; border-bottom: 1px dotted var(--text-muted); }
  footer a:hover { border-bottom-style: solid; }

  .kbd {
    display: inline-block;
    padding: 1px 6px;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 0.68rem;
    font-family: ui-monospace, monospace;
  }

  .confetti {
    position: fixed;
    top: -12px;
    width: 9px;
    height: 14px;
    pointer-events: none;
    z-index: 20;
    animation: fall 2.6s linear forwards;
  }
  @keyframes fall {
    0% { transform: translateY(0) rotate(0); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .confetti { animation-duration: 0.6s; }
  }
</style>
</head>

<body>

<header>
  <div>
    <h1>🎡 Wheel of <span>Fate</span></h1>
    <p class="hint">
      <span class="kbd">Space</span>
      <span data-en="spin — luck is the only judge" data-el="γύρισμα — η τύχη είναι ο μοναδικός κριτής">spin — luck is the only judge</span>
    </p>
  </div>
  <div class="toolbar">
    <button id="installBtn" hidden data-en="⬇ Install app" data-el="⬇ Εγκατάσταση">⬇ Install app</button>
    <div class="lang-switch" role="group" aria-label="Language">
      <button id="langEn" class="active">EN</button>
      <button id="langEl">ΕΛ</button>
    </div>
  </div>
</header>

<div class="layout">

  <section class="left">
    <canvas id="wheel" width="480" height="480"></canvas>
    <button id="spinBtn" class="primary">🎯 Spin!</button>
    <div class="result" id="resultEl"></div>
  </section>

  <aside class="right">

    <div>
      <h2 class="section" data-en="Options" data-el="Επιλογές">Options</h2>
      <textarea id="itemsArea" spellcheck="false" aria-label="Wheel options"></textarea>
      <p class="hint">
        <span data-en="One option per line · 2 to 20" data-el="Μία επιλογή ανά γραμμή · 2 έως 20">One option per line · 2 to 20</span>
      </p>
      <button id="applyBtn" style="width:100%; margin-top:8px;" data-en="✓ Apply to wheel" data-el="✓ Εφαρμογή στον τροχό">✓ Apply to wheel</button>
    </div>

    <div>
      <h2 class="section" data-en="Quick sets" data-el="Έτοιμα σετ">Quick sets</h2>
      <div class="quick" id="quickSets"></div>
    </div>

    <div>
      <h2 class="section" data-en="Winners" data-el="Νικητές">Winners</h2>
      <ul class="winners" id="winList"></ul>
      <p class="empty" id="winEmpty" data-en="No winners yet." data-el="Κανείς νικητής ακόμα.">No winners yet.</p>
      <button id="clearWinBtn" style="width:100%; margin-top:8px;"
              data-en="🧹 Clear winners" data-el="🧹 Καθάρισμα νικητών">🧹 Clear winners</button>
    </div>

  </aside>

</div>

<footer>
  <span data-en="Designed by" data-el="Σχεδιασμένο από τον">Designed by</span>
  <a href="https://koulaxizis.gr" target="_blank" rel="noopener">Christos Koulaxizis</a> ·
  <a href="../" data-en="All apps" data-el="Όλα τα apps">All apps</a><br>
  <span data-en="No cookies · No tracking · Open source"
        data-el="Χωρίς cookies · Χωρίς tracking · Ανοιχτού κώδικα">No cookies · No tracking · Open source</span>
</footer>

<script>
"use strict";
(function () {

  // ===== DOM =====
  var canvas = document.getElementById("wheel");
  var ctx = canvas.getContext("2d");
  var spinBtn = document.getElementById("spinBtn");
  var resultEl = document.getElementById("resultEl");
  var itemsArea = document.getElementById("itemsArea");
  var applyBtn = document.getElementById("applyBtn");
  var quickSetsEl = document.getElementById("quickSets");
  var winListEl = document.getElementById("winList");
  var winEmptyEl = document.getElementById("winEmpty");
  var clearWinBtn = document.getElementById("clearWinBtn");
  var langEnBtn = document.getElementById("langEn");
  var langElBtn = document.getElementById("langEl");
  var installBtn = document.getElementById("installBtn");

  var TAU = Math.PI * 2;
  var CX = 240, CY = 240, R = 218;

  var LS_ITEMS = "wheelfate.items.v1";
  var LS_WINNERS = "wheelfate.winners.v1";

  var COLORS = [
    "#ffb35c", "#ff8a65", "#ffd166", "#a5d6a7",
    "#81d4fa", "#ce93d8", "#f48fb1", "#e6ce9a",
    "#80cbc4", "#ffab91", "#b39ddb", "#c5e1a5",
    "#90caf9", "#ffb74d", "#f0a4b8", "#8fd3c7",
    "#dcc98c", "#9fd8a2", "#f4b183", "#b8a8e8"
  ];

  // ===== i18n (κοινό μοτίβο σε όλη τη σουίτα) =====
  var LANG_KEY = "soffitta.lang";

  var T = {
    title: {
      en: "Wheel of Fate — Soffitta",
      el: "Τροχός της Μοίρας — Soffitta"
    },
    metaDesc: {
      en: "The wheel of decisions: add options, spin, and let fate decide. Without cookies, without tracking.",
      el: "Ο τροχός της απόφασης: πρόσθεσε επιλογές, γύρνα και άφησε την τύχη να αποφασίσει. Χωρίς cookies, χωρίς tracking."
    },
    celebrate: { en: "🎉 ", el: "🎉 " },
    excl: { en: "!", el: "!" },
    needTwo: {
      en: "At least 2 options are needed!",
      el: "Χρειάζονται τουλάχιστον 2 επιλογές!"
    },
    winnersList: { en: "Winners", el: "Νικητές" }
  };

  var currentLang = detectLang();

  function detectLang() {
    try {
      var saved = localStorage.getItem(LANG_KEY);
      if (saved === "en" || saved === "el") return saved;
    } catch (e) {}
    var nav = (navigator.language || "en").slice(0, 2).toLowerCase();
    return nav === "el" ? "el" : "en";
  }

  // ===== ΕΤΟΙΜΑ ΣΕΤ (bilingual — JS-rendered) =====
  var QUICK_SETS = [
    {
      name_en: "🍕 What to eat?", name_el: "🍕 Τι θα φάμε;",
      items_en: ["Pizza", "Souvlaki", "Burger", "Pasta", "Roast", "Salad"],
      items_el: ["Πίτσα", "Σουβλάκι", "Μπέργκερ", "Πάστα", "Ψητό", "Σαλάτα"]
    },
    {
      name_en: "🎲 Who starts?",   name_el: "🎲 Ποιος αρχίζει;",
      items_en: ["Player one", "Player two", "Player three", "Player four"],
      items_el: ["Ο πρώτος", "Ο δεύτερος", "Ο τρίτος", "Ο τέταρτος"]
    },
    {
      name_en: "❓ Yes or no?",      name_el: "❓ Ναι ή όχι;",
      items_en: ["YES", "NO", "Definitely yes", "Absolutely not", "Ask again"],
      items_el: ["ΝΑΙ", "ΟΧΙ", "Σίγουρα ναι", "Καθόλου", "Ρώτα ξανά"]
    },
    {
      name_en: "🎬 Movie tonight?",  name_el: "🎬 Ταινία απόψε;",
      items_en: ["Drama", "Comedy", "Thriller", "Sci-Fi", "Documentary", "Animation"],
      items_el: ["Δράμα", "Κωμωδία", "Θρίλερ", "Sci-Fi", "Ντοκιμαντέρ", "Animation"]
    }
  ];

  var DEFAULT_ITEMS_EN = ["Pizza", "Souvlaki", "Burger", "Pasta", "Roast", "Salad"];
  var DEFAULT_ITEMS_EL = ["Πίτσα", "Σουβλάκι", "Μπέργκερ", "Πάστα", "Ψητό", "Σαλάτα"];

    // ===== STATE =====
  var items = [];              // πάντα plain strings — αποθηκεύονται ως έχουν
  var winners = [];
  var activeSet = null;        // { kind: "default" } | { kind: "quick", idx: n } | null = custom
  var dirtyArea = false;       // ο χρήστης πείραξε το textarea

  var angle = 0;        // τρέχουσα γωνία τροχού (rad)
  var velocity = 0;      // rad/s
  var spinning = false;
  var lastTs = 0;

  // ===== ΦΟΡΤΩΣΗ =====
  try {
    var savedItems = JSON.parse(localStorage.getItem(LS_ITEMS) || "null");
    if (Array.isArray(savedItems) && savedItems.length >= 2) items = savedItems.slice(0, 20);
  } catch (e) {}

  try {
    var savedWinners = JSON.parse(localStorage.getItem(LS_WINNERS) || "null");
    if (Array.isArray(savedWinners)) winners = savedWinners.slice(0, 20);
  } catch (e) {}

  if (!items.length) {
    items = (currentLang === "el" ? DEFAULT_ITEMS_EL : DEFAULT_ITEMS_EN).slice();
    activeSet = { kind: "default" };
  }

  function saveItems() {
    try { localStorage.setItem(LS_ITEMS, JSON.stringify(items)); } catch (e) {}
  }

  function saveWinners() {
    try { localStorage.setItem(LS_WINNERS, JSON.stringify(winners)); } catch (e) {}
  }

  // Ξαναχτίζει items + textarea από την πηγή (default / quick set) στη νέα γλώσσα.
  // Επιστρέφει false όταν τα items είναι custom — εκείνη την ώρα δεν πειράζουμε τίποτα.
  function setFromSource() {
    if (!activeSet) return false;
    if (activeSet.kind === "default") {
      items = (currentLang === "el" ? DEFAULT_ITEMS_EL : DEFAULT_ITEMS_EN).slice();
    } else {
      var q = QUICK_SETS[activeSet.idx];
      items = (currentLang === "el" ? q.items_el : q.items_en).slice();
    }
    itemsArea.value = items.join("\n");
    return true;
  }

  // ===== ΣΧΕΔΙΑΣΜΟΣ (αμετάβλητος, unicode-aware truncation — bug #1) =====
  function fontSz(n) {
    if (n <= 6) return 17;
    if (n <= 8) return 15;
    if (n <= 12) return 13;
    return 11;
  }

  // Unicode-aware truncate — δεν σπάει emoji/surrogate pairs
  function truncateLabel(label, maxWidth) {
    if (label.length <= 3) return { text: label, truncated: false };
    var chars = Array.from(label);
    while (chars.length > 3 && ctx.measureText(chars.join("")).width > R * 0.62) {
      chars.pop();
    }
    return { text: chars.join(""), truncated: (label !== chars.join("")) };
  }

  function drawWheel() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    var n = items.length;
    var step = TAU / n;
    var fs = fontSz(n);

    for (var i = 0; i < n; i++) {
      var a0 = i * step - Math.PI / 2 + angle;
      var a1 = a0 + step;

      // Φέτα
      ctx.beginPath();
      ctx.moveTo(CX, CY);
      ctx.arc(CX, CY, R, a0, a1);
      ctx.closePath();
      ctx.fillStyle = COLORS[i % COLORS.length];
      ctx.fill();

      // Διαχωριστική γραμμή
      ctx.beginPath();
      ctx.moveTo(CX, CY);
      ctx.lineTo(CX + Math.cos(a0) * R, CY + Math.sin(a0) * R);
      ctx.strokeStyle = "rgba(30,18,6,0.55)";
      ctx.lineWidth = 2;
      ctx.stroke();

            // Ετικέτα
      var mid = a0 + step / 2;
      ctx.save();
      ctx.translate(CX, CY);
      ctx.rotate(mid);
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      ctx.font = "700 " + fs + "px 'Segoe UI', sans-serif";
      ctx.fillStyle = "#2b1a06";

      // Unicode-aware truncation (bug #1) — δεν σπάει emoji / surrogate pairs
      var label = items[i];
      var cs = Array.from(label);
      var shortened = false;
      while (cs.length > 3 && ctx.measureText(cs.join("")).width > R * 0.62) {
        cs.pop();
        shortened = true;
      }
      if (shortened) cs.push("…");
      ctx.fillText(cs.join(""), R - 22, 0);
      ctx.restore();
    }

    // Εξωτερικό στεφάνι
    ctx.beginPath();
    ctx.arc(CX, CY, R + 5, 0, TAU);
    ctx.lineWidth = 10;
    ctx.strokeStyle = "#5d4620";
    ctx.stroke();

    // Λαμπάκια στο στεφάνι
    for (var b = 0; b < 16; b++) {
      var ang = (b / 16) * TAU;
      var bx = CX + Math.cos(ang) * (R + 5);
      var by = CY + Math.sin(ang) * (R + 5);
      ctx.beginPath();
      ctx.arc(bx, by, 3.5, 0, TAU);
      ctx.fillStyle = "#fff3d9";
      ctx.fill();
    }

    // Κεντρικός άξονας
    ctx.beginPath();
    ctx.arc(CX, CY, 20, 0, TAU);
    ctx.fillStyle = "#5d4620";
    ctx.fill();
    ctx.beginPath();
    ctx.arc(CX, CY, 8, 0, TAU);
    ctx.fillStyle = "#f5edd9";
    ctx.fill();

    // Δείκτης — κορυφή, δείχνει προς τα κάτω
    ctx.beginPath();
    ctx.moveTo(CX - 15, 6);
    ctx.lineTo(CX + 15, 6);
    ctx.lineTo(CX, 36);
    ctx.closePath();
    ctx.fillStyle = "#ffb35c";
    ctx.fill();
    ctx.strokeStyle = "#5d4620";
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // itemText: κείμενο φέτας — δίγλωσσα objects μένουν objects αποθηκευμένα
  function itemText(it) {
    return (item && typeof item === "object")
      ? (currentLang === "el" ? item.el : item.en)
      : item;
  }

  // itemLabel: string accessor — έξυπνο παντού
  function itemText(i) {
    var raw = items[i];
    if (typeof item === "object" && item !== null) {
      return currentLang === "el" ? item.name_el : item.name_en;
    }
    return item;
  }
  
    // ===== i18n APPLY =====
  function applyStatic() {
    document.documentElement.setAttribute("lang", currentLang);
    document.title = T.title[currentLang];
    var metaDesc = document.querySelector('meta[name="description"]');
    if (metaDesc) metaDesc.setAttribute("content", T.metaDesc[currentLang]);
    var nodes = document.querySelectorAll("[data-en]");
    for (var i = 0; i < nodes.length; i++) {
      nodes[i].textContent = currentLang === "el"
        ? nodes[i].getAttribute("data-el")
        : nodes[i].getAttribute("data-en");
    }
    langEnBtn.classList.toggle("active", currentLang === "en");
    langElBtn.classList.toggle("active", currentLang === "el");
    spinBtn.textContent = T.spin[currentLang];
    itemsArea.setAttribute("aria-label", currentLang === "el" ? "Επιλογές τροχού" : "Wheel options");
    if (!dirtyArea && setFromSource()) saveItems();
    drawWheel();
    renderQuickSets();
    renderWinners();
  }

  function setLang(lang) {
    currentLang = lang;
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
    applyStatic();
  }

  langEnBtn.addEventListener("click", function () { setLang("en"); });
  langElBtn.addEventListener("click", function () { setLang("el"); });

  // ===== QUICK SETS =====
  function renderQuickSets() {
    quickSetsEl.innerHTML = "";
    QUICK_SETS.forEach(function (set, idx) {
      var el = document.createElement("button");
      el.textContent = currentLang === "el" ? set.name_el : set.name_en;
      el.addEventListener("click", function () {
        activeSet = { kind: "quick", idx: idx };
        dirtyArea = false;
        items = (currentLang === "el" ? set.items_el : set.items_en).slice();
        itemsArea.value = items.join("\n");
        saveItems();
        angle = 0;
        drawWheel();
        resultEl.textContent = "";
      });
      quickSetsEl.appendChild(el);
    });
  }

  // ===== ΓΥΡΙΣΜΑ (physics με εκθετική τριβή — αμετάβλητο) =====
  function startSpin() {
    if (spinning || items.length < 2) return;
    spinning = true;
    spinBtn.disabled = true;
    resultEl.textContent = "";

    velocity = (9 + Math.random() * 6) * (Math.random() < 0.5 ? -1 : 1);
    lastTs = 0;
    requestAnimationFrame(tick);
  }

  function tick(ts) {
    if (!spinning) return;
    if (!lastTs) lastTs = ts;
    var dt = Math.min(0.05, (ts - lastTs) / 1000);
    lastTs = ts;

    angle += velocity * dt;
    velocity *= Math.pow(0.5, dt / 0.35);

    if (Math.abs(velocity) < 0.08) {
      velocity = 0;
      spinning = false;
      spinBtn.disabled = false;
      finishSpin();
      return;
    }

    drawWheel();
    requestAnimationFrame(tick);
  }

  // ===== ΝΙΚΗΤΗΣ (επαληθευμένος μαθηματικά — αμετάβλητος) =====
  function winnerIndex() {
    var n = items.length;
    var step = TAU / n;
    var u = ((-angle) % TAU + TAU) % TAU;
    return Math.floor(u / step) % n;
  }

  function finishSpin() {
    drawWheel();
    var idx = winnerIndex();
    var text = items[idx];
    resultEl.textContent = "🎉 " + text + "!";
    winners.unshift({ text: text, ts: Date.now() });
    if (winners.length > 20) winners = winners.slice(0, 20);
    saveWinners();
    renderWinners();
    throwConfetti();
  }

  function fmtTime(ts) {
    var d = new Date(ts);
    return ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
  }

  function renderWinners() {
    winListEl.innerHTML = "";
    winEmptyEl.style.display = winners.length ? "none" : "block";
    for (var i = 0; i < winners.length; i++) {
      var li = document.createElement("li");
      var name = document.createElement("span");
      name.textContent = "🏆 " + winners[i].text;
      var time = document.createElement("span");
      time.className = "time";
      time.textContent = fmtTime(winners[i].ts);
      li.appendChild(name);
      li.appendChild(time);
      winListEl.appendChild(li);
    }
  }

  // ===== ΚΟΝΦΕΤΙ (αμετάβλητο) =====
  function throwConfetti() {
    var palette = ["#ffb35c", "#ffd166", "#ff8a65", "#a5d6a7", "#81d4fa", "#ce93d8"];
    for (var i = 0; i < 44; i++) {
      var el = document.createElement("div");
      el.className = "confetti";
      el.style.left = (Math.random() * 100) + "vw";
      el.style.background = palette[Math.floor(Math.random() * palette.length)];
      el.style.animationDelay = (Math.random() * 0.5) + "s";
      el.style.animationDuration = (2 + Math.random() * 1.4) + "s";
      document.body.appendChild(el);
      (function (node) {
        setTimeout(function () { node.remove(); }, 3600);
      })(el);
    }
  }

  // ===== ΕΠΕΞΕΡΓΑΣΙΑ ΕΠΙΛΟΓΩΝ =====
  var showingError = false;

  applyBtn.addEventListener("click", function () {
    var lines = itemsArea.value.split(/\n/)
      .map(function (s) { return s.trim(); })
      .filter(function (s) { return s.length > 0; })
      .slice(0, 20);
    if (lines.length < 2) {
      showingError = true;
      resultEl.textContent = T.needTwo[currentLang];
      return;
    }
    showingError = false;
    activeSet = null;   // custom
    dirtyArea = true;
    items = lines;
    saveItems();
    angle = 0;
    drawWheel();
    resultEl.textContent = "";
  });

  // bug #3: το error σβήνει μόλις ο χρήστης αρχίσει να πληκτρολογεί
  itemsArea.addEventListener("input", function () {
    dirtyArea = true;
    if (showingError) {
      showingError = false;
      resultEl.textContent = "";
    }
  });

  // ===== ΚΑΘΑΡΙΣΜΑ ΝΙΚΗΤΩΝ =====
  clearWinBtn.addEventListener("click", function () {
    winners = [];
    saveWinners();
    renderWinners();
  });

  // ===== ΠΛΗΚΤΡΟΛΟΓΙΟ + ΚΛΙΚ ΣΤΟΝ ΤΡΟΧΟ (bug #2) =====
  document.addEventListener("keydown", function (e) {
    if (e.code !== "Space") return;
    var tag = (e.target && e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "select" || tag === "textarea" || tag === "button") return;
    e.preventDefault();
    if (!spinning) startSpin();
  });

  canvas.addEventListener("click", function () {
    if (!spinning) startSpin();
  });

  spinBtn.addEventListener("click", startSpin);

  // ===== INIT =====
  itemsArea.value = items.join("\n");
  applyStatic(); // i18n + quick sets + winners (+ setFromSource όταν δεν είναι custom)

  // ===== ΕΓΚΑΤΑΣΤΑΣΗ (PWA) =====
  var deferredPrompt = null;

  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.hidden = false;
  });

  installBtn.addEventListener("click", function () {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt = null;
    installBtn.hidden = true;
  });

  window.addEventListener("appinstalled", function () {
    deferredPrompt = null;
    installBtn.hidden = true;
  });

  // ===== SERVICE WORKER (offline — κοινός SW της σουίτας στη ρίζα) =====
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("../sw.js").catch(function (err) {
        console.warn("SW registration failed:", err);
      });
    });
  }

})();
</script>
